 active player uses abilities first, then the opponent."],["Zugende: Siegespunkte werden für Ziele und erfüllte Vorhaben gezählt; Fähigkeiten wie Standartenträger, Durchbrechen oder Nahkampf-Effekte wirken.","End of turn: victory points are scored for objectives and completed tactics; abilities such as Standard Bearer and Power Through take effect."],["Zielkontrolle wird zu Beginn der ersten Schlachtrunde und am Ende jedes Zugs geprüft.","Objective control is checked at the start of the first battle round and at the end of each turn."]],"sp":null},{"id":"heldenphase","ph":"h","t":["Heldenphase","Hero phase"],"s":["Helden sammeln Mut, Zauberer wirken Zaubersprüche, Priester sprechen Gebete.","Heroes rally troops, Wizards cast spells and Priests chant prayers."],"d":[["Sammeln (Rally, 1 BP): Eine Einheit außerhalb des Nahkampfs würfelt 6 Würfel; je 4+ gibt 1 Sammelpunkt. Ein Sammelpunkt heilt 1 Schadenspunkt; so viele Punkte wie die Ausdauer des Modells bringen 1 Modell zurück. Musiker geben einen zusätzlichen Würfel.","Rally (1 CP): a unit not in combat rolls 6 dice; each 4+ gives a rally point. One point heals 1 damage; points equal to the model's Health return a slain model. Musicians add an extra die."],["Zauber: Ein Zauberer sagt einen Zauber an und würfelt 2W6 gegen den Zauberwert. Gelingt der Wurf, tritt der Effekt ein.","Spells: a Wizard declares a spell and rolls 2D6 against the casting value. If it succeeds the effect happens."],["Bannen (Unbind, Reaktion): Ein gegnerischer Zauberer innerhalb 30\" würfelt 2W6; übertrifft er den Zauberwurf, verpufft der Zauber. Pro Zauber nur 1 Bannversuch.","Unbind (reaction): an enemy Wizard within 30\" rolls 2D6; if it beats the casting roll the spell fails. One attempt per spell."],["Gebete: Ein Priester sagt ein Gebet an und würfelt einen W6 (Gebetswurf) gegen den Wert des Gebets.","Prayers: a Priest declares a prayer and rolls a D6 (chanting roll) against its value."],["Manifestationen brechen (Banish Manifestation): Zauberer/Priester würfeln 2W6 gegen den Bannwert der Manifestation (30\").","Banish Manifestation: a Wizard/Priest rolls 2D6 against the manifestation's banishment value (30\")."],["Magischer Eingriff (gegnerische Heldenphase, Befehl): Ein Zauberer/Priester darf mit −1 einen Zauber/ein Gebet wirken.","Magical Intervention (enemy Hero phase, command): a Wizard/Priest can cast/chant with −1."]],"sp":null},{"id":"bewegung","ph":"b","t":["Bewegungsphase","Movement phase"],"s":["Einheiten bewegen sich: normal, rennend oder im Rückzug. Nur der Rückzug führt aus dem Nahkampf heraus.","Units move: normally, running or retreating. Only a retreat leaves combat."],"d":[["Normale Bewegung: bis zur Bewegung (Move) weit, nicht in den Nahkampf hinein; Einheit muss im Zusammenhalt enden.","Normal Move: up to Move, not into combat; the unit must end in coherency."],["Rennen (Run): Bewegung plus W6 (Rennenwurf), nicht in den Nahkampf. Danach weder schießen noch angreifen. Mit „Im Laufschritt“ (BP): +6\" statt Wurf.","Run: Move plus a D6 (run roll), not into combat. Afterwards the unit cannot shoot or charge. With “At the Double” (CP): +6\" instead of rolling."],["Rückzug (Retreat): Einheit im Nahkampf nimmt W3 tödlichen Schaden, darf bis zu ihrer Bewegung ziehen und durch gegnerische Kampfreichweiten gehen, darf aber nicht darin enden. Danach weder schießen noch angreifen.","Retreat: a unit in combat takes D3 mortal damage, may move up to its Move through enemy combat ranges but not end in one. Afterwards no shooting or charging."],["Neupositionierung (Redeploy, gegnerische Bewegungsphase, BP): Jedes Modell bis W6\" – nie in oder durch gegnerische Kampfreichweite.","Redeploy (enemy Movement phase, CP): each model up to D6\" – never through or into enemy combat range."],["Fliegen: Modelle ignorieren beim Bewegen andere Modelle, Gelände und gegnerische Kampfreichweiten (vertikale Strecke wird nicht gezählt), dürfen aber nicht im Nahkampf enden.","Fly: models ignore other models, terrain and enemy combat ranges when moving (vertical distance is ignored) but cannot end in combat."],["Gelände: bis 1\" Höhe einfach überschreiten, höhere Stücke erklettern (Höhe zählt zur Strecke), herabspringen beendet die Bewegung.","Terrain: features up to 1\" tall can be crossed freely; taller ones are climbed (height counts); jumping down ends the move."],["Verstärkung rufen: Nutzbar als Spearhead-Fähigkeit (siehe „Verstärkung“).","Call for Reinforcements: a Spearhead ability (see “Reinforcements”)."]],"sp":null},{"id":"fernkampf","ph":"f","t":["Fernkampfphase","Shooting phase"],"s":["Einheiten schießen mit Fernkampfwaffen auf sichtbare Ziele in Reichweite.","Units shoot with ranged weapons at visible targets in range."],"d":[["Schießen (Shoot): Einheit darf nicht gerannt sein oder sich zurückgezogen haben und nicht im Nahkampf stehen (außer Waffe hat Nahbeschuss).","Shoot: the unit must not have run or retreated, and must not be in combat (unless the weapon has Shoot in Combat)."],["Alle Ziele müssen sichtbar und in Waffenreichweite sein; Attacken können auf mehrere Ziele verteilt werden.","All targets must be visible and within weapon range; attacks can be split among targets."],["Deckungsfeuer (gegnerische Fernkampfphase): Eine Einheit außerhalb des Nahkampfs schießt auf die nächste sichtbare feindliche Einheit mit −1 auf Treffer.","Covering Fire (enemy Shooting phase): a unit not in combat shoots at the nearest visible enemy with −1 to hit."],["Geschützter Held: Helden in Reichweite einer nicht-heldischen Einheit sind schwerer als Fernkampfziel zu treffen (−1; Infanterie nicht auf mehr als 12\").","Guarded Hero: Heroes near a non-Hero friendly unit are harder to shoot (−1; Infantry cannot be targeted from over 12\")."]],"sp":null},{"id":"angriff","ph":"a","t":["Angriffsphase","Charge phase"],"s":["Einheiten laufen in den Nahkampf. Der Angriff gelingt nur bei genügend hohem Angriffswurf.","Units run into combat. A charge succeeds only with a high enough charge roll."],"d":[["Angriff (Charge): Einheit nicht im Nahkampf, nicht gerannt/zurückgezogen. Angriffswurf 2W6: die Einheit darf so weit ziehen und muss ½\" von einer sichtbaren feindlichen Einheit enden; dann hat sie angegriffen.","Charge: the unit is not in combat and did not run/retreat. Charge roll 2D6: it may move up to the result and must end within ½\" of a visible enemy unit; it has then charged."],["Während der Angriffsbewegung darf sie durch gegnerische Kampfreichweiten ziehen.","During the charge move it may pass through enemy combat ranges."],["Vorwärts zum Sieg (Reaktion, BP): Angriffswurf wiederholen. Gegenangriff (gegnerische Angriffsphase, BP): Eine Einheit darf eine Angriff-Fähigkeit nutzen.","Forward to Victory (reaction, CP): re-roll the charge. Counter-charge (enemy Charge phase, CP): a unit may use a Charge ability."],["Eine Einheit, die angegriffen hat, bekommt Vorteile (z. B. „Angriff +1 Schaden“, erst-Kämpfen-Regeln).","A unit that has charged gains benefits (e.g. “Charge +1 Damage”, fight-order rules)."]],"sp":null},{"id":"kampf","ph":"k","t":["Kampfphase","Combat phase"],"s":["Beide Spieler wählen abwechselnd Einheiten, die kämpfen – der aktive Spieler beginnt. Jede Einheit im Nahkampf muss kämpfen, wenn sie kann.","Players alternate picking units to fight – the active player starts. Every unit in combat must fight if able."],"d":[["Kämpfen (Fight): Einheit im Nahkampf oder mit Angriff in diesem Zug darf nachrücken, danach mit allen Nahkampfwaffen angreifen.","Fight: a unit in combat or one that charged this turn may pile in, then attack with all its melee weapons."],["Nachrücken (Pile In): Im Nahkampf wählst du eine Ziel-Einheit; jedes Modell darf bis zu 3\" ziehen, darf aber nicht weiter vom Ziel enden. Danach muss die Einheit mit allen bisherigen Gegnern im Nahkampf bleiben. Nach einem Angriff (nicht im Nahkampf) darf jedes Modell 3\" in beliebige Richtung ziehen.","Pile In: when in combat pick a target unit; each model moves up to 3\" but must not end farther from it, and the unit must stay in combat with all its previous enemies. A unit not in combat (e.g. after a charge) can move each model 3\" in any direction."],["Zuerst nutzen beide Spieler ihre sonstigen Kampfphasen-Fähigkeiten (aktiver Spieler zuerst); erst dann wird abwechselnd gekämpft. Hat ein Spieler keine kampfbereite Einheit mehr, macht der andere allein weiter. „Kämpft zuerst“ / „Kämpft zuletzt“ verschieben die Reihenfolge.","First both players use their other Combat phase abilities (active player first); only then do they alternate fighting. When one side has no eligible unit left the other continues alone. “Strike-first” / “Strike-last” shift the order."],["Alles-oder-nichts-Angriff / -Verteidigung (Reaktion, BP): +1 Treffer für angreifende Einheit bzw. +1 auf Schutzwürfe für das Ziel.","All-out Attack / All-out Defence (reaction, CP): +1 to hit for the attacker, or +1 to the target's save rolls."],["Champion: +1 Attacken für Waffen des Champions. Durchbrechen (Power Through, Zugende): Nach einem Angriff W3 tödlicher Schaden auf Feind mit geringerer Ausdauer, dann Bewegung.","Champion: +1 Attacks for the champion's weapons. Power Through (end of turn): after charging, D3 mortal damage to an enemy with lower Health, then move."]],"sp":null},{"id":"angriffsfolge","ph":"x","t":["Angriffsfolge","The attack sequence"],"s":["Jede Attacke wird in vier Schritten abgehandelt: Treffer, Verwundung, Schutz, Schaden.","Each attack is resolved in four steps: hit, wound, save, damage."],"d":[["1. Trefferwurf: W6 ≥ Treffen-Wert der Waffe. Unmodifizierte 1 verfehlt immer; unmodifizierte 6 ist ein kritischer Treffer.","1. Hit roll: D6 ≥ the weapon's Hit value. An unmodified 1 always fails; an unmodified 6 is a critical hit."],["2. Verwundungswurf: W6 ≥ Verwunden-Wert. Unmodifizierte 1 verfehlt immer.","2. Wound roll: D6 ≥ Wound value. An unmodified 1 always fails."],["3. Schutzwurf: Der Verteidiger würfelt W6 und zieht die Wucht (Rend) der Waffe ab; ≥ Schutzwert wehrt den Treffer ab. Unmodifizierte 1 verfehlt immer.","3. Save roll: the defender rolls a D6 and subtracts the weapon's Rend; ≥ Save stops the attack. An unmodified 1 always fails."],["4. Schaden bestimmen: So viele Schadenspunkte wie der Schaden-Wert der Waffe kommen in den Schadenspool der Zieleinheit.","4. Determine damage: damage points equal to the weapon's Damage go into the target unit's damage pool."],["Schnelles Würfeln: Gleiche Attacken (gleiche Werte, gleiche Fähigkeiten, gleiches Ziel) lassen sich gemeinsam würfeln.","Fast dice rolling: identical attacks (same values, abilities and target) can be rolled together."]],"sp":null},{"id":"modifikatoren","ph":"x","t":["Modifikatoren und Grenzen","Modifiers and caps"],"s":["Auf Treffer- und Verwundungswürfe wirken Modifikatoren höchstens mit +1 oder −1 insgesamt.","Modifiers to hit and wound rolls are capped at +1 / −1 in total."],"d":[["Alle Plus- und Minuswerte zusammenrechnen, dann auf +1 bzw. −1 begrenzen (Treffer, Verwundung).","Add up all pluses and minuses, then cap at +1 / −1 (hit and wound rolls)."],["Schutzwürfe: Bonus höchstens +1, aber die Wucht (Rend) und andere Abzüge sind nicht begrenzt.","Save rolls: bonus capped at +1, but Rend and other penalties are not capped."],["Reihenfolge bei Werten: 1. auf festen Wert setzen, 2. multiplizieren/teilen, 3. addieren/subtrahieren. Werte und Würfe sinken nie unter 1 (Wucht bis auf 0); Halbieren rundet ab. Kritische Treffer hängen nur vom unmodifizierten Wurf ab.","Order for values: 1. set to a fixed value, 2. multiply/divide, 3. add/subtract. Values and rolls never drop below 1 (Rend down to 0); halving rounds down. Critical hits depend only on the unmodified roll."]],"sp":null},{"id":"schaden","ph":"x","t":["Schadenspool und Schaden","Damage pool and damage"],"s":["Schaden wird zuerst gesammelt (Schadenspool), dann werden Rettungswürfe gemacht und erst danach Modelle entfernt.","Damage is collected first (damage pool), then ward rolls are made, and only then are models removed."],"d":[["Schadensfolge: 1. Rettungswürfe (Ward) für jeden Schadenspunkt im Pool, 2. verbleibende Schadenspunkte verteilen, gefallene Modelle entfernen.","Damage sequence: 1. ward rolls for each damage point in the pool, 2. allocate the remaining damage and remove slain models."],["Erreicht der zugeteilte Schaden die Ausdauer des Modells, ist es gefallen und der Zähler fällt auf 0. Eine Einheit mit zugeteiltem Schaden ist angeschlagen.","When allocated damage equals a model's Health it is slain and the counter resets to 0. A unit with allocated damage is damaged."],["Tödlicher Schaden (Mortal damage): kommt direkt in den Schadenspool, keine Treffer-, Verwundungs- oder Schutzwürfe.","Mortal damage goes straight into the damage pool – no hit, wound or save rolls."],["Gefallene Modelle wählt der Besitzer; der Zusammenhalt muss gewahrt bleiben. Fällt das letzte Modell, ist die Einheit zerstört.","The owner picks slain models; coherency must be kept. When the last model falls the unit is destroyed."],["Mehrere Rettungen: Es gilt nur die mit dem niedrigsten Wert.","Several ward saves: only the lowest value applies."]],"sp":null},{"id":"waffenf","ph":"x","t":["Waffenfähigkeiten","Weapon abilities"],"s":["Waffen können Zusatzregeln haben, die meist bei kritischen Treffern wirken.","Weapons can have extra rules, mostly triggered by critical hits."],"d":[["Krit. (2 Treffer): Ein kritischer Treffer zählt als 2 Treffer, je Treffer ein Verwundungswurf.","Crit (2 Hits): a critical hit counts as 2 hits; one wound roll for each."],["Krit. (verwundet): Ein kritischer Treffer verwundet automatisch; Schutzwurf wie gewohnt.","Crit (Auto-wound): a critical hit automatically wounds; make the save as normal."],["Krit. (tödlich): Ein kritischer Treffer verursacht tödlichen Schaden in Höhe des Schadens; die Angriffsfolge endet.","Crit (Mortal): a critical hit inflicts mortal damage equal to the weapon's Damage and the sequence ends."],["Anti-X (+1 Wucht): +1 Wucht gegen Ziele mit Schlüsselwort X; mehrere Anti-Fähigkeiten addieren sich.","Anti-X (+1 Rend): +1 Rend against targets with keyword X; several Anti abilities add up."],["Angriff (+1 Schaden): +1 Schaden, wenn die Einheit in diesem Zug angegriffen hat.","Charge (+1 Damage): +1 Damage if the unit charged this turn."],["Begleiter: Die Waffe wird nicht von Fähigkeiten beeinflusst, die Attacken oder die Angriffsfolge ändern.","Companion: the weapon is unaffected by abilities that change Attacks or the attack sequence."],["Nahbeschuss (Shoot in Combat): Die Waffe darf auch im Nahkampf zum Schießen genutzt werden.","Shoot in Combat: the weapon can be used to shoot even when the unit is in combat."]],"sp":null},{"id":"gelaende","ph":"x","t":["Gelände","Terrain"],"s":["Gelände bietet Deckung, blockiert Sicht oder macht Stellungen unsicher. In Spearhead gibt es 2 große und 2 kleine Stücke.","Terrain gives cover, blocks sight or makes footing unstable. Spearhead uses 2 large and 2 small features."],"d":[["Jeder Spieler baut 1 großes und 1 kleines Geländestück ganz in seinem Territorium auf (Abstände siehe „Vorbereitung“).","Each player places 1 large and 1 small terrain feature wholly in their territory (distances: see “Pre-battle”)."],["Großes Gelände: Deckung, Versperrt Sicht, Instabil. Kleines Gelände: Deckung, Instabil.","Large terrain: Cover, Obscuring, Unstable. Small terrain: Cover, Unstable."],["Deckung: −1 auf Trefferwürfe gegen Einheiten, die hinter oder ganz auf dem Gelände stehen – außer sie haben angegriffen oder können fliegen.","Cover: −1 to hit rolls against units behind or wholly on the feature – unless they charged or can Fly."],["Versperrt Sicht (Obscuring): Einheiten hinter oder ganz auf dem Stück können nicht beschossen werden (außer Fliegen).","Obscuring: units behind or wholly on it cannot be shot (except Fly)."],["Instabil (Unstable): Man darf darüber ziehen, aber dort, wo es höher als 1\" ist, nicht aufstellen oder eine Bewegung beenden.","Unstable: models can cross it but cannot be set up on or end a move where it is more than 1\" tall."],["Unpassierbar: Kein Modell darf sich darüber bewegen, dort aufgestellt werden oder darauf enden. Ort der Macht: Helden innerhalb 3\" dürfen „Ort der Macht aktivieren“.","Impassable: no model can cross, be set up on or end on it. Place of Power: Heroes within 3\" can use “Activate Place of Power”."]],"sp":null},{"id":"ziele","ph":"x","t":["Zielkontrolle","Objective control"],"s":["Ziele sind aufgedruckte Kreise auf der Karte. Wer dort mehr Kontrolle hat, kontrolliert das Ziel.","Objectives are printed circles on the map. Whoever has more control there controls the objective."],"d":[["Ein Modell, das ein Ziel ganz oder teilweise berührt, beansprucht (contests) es.","A model that is wholly or partly on an objective contests it."],["Zähle die Kontrolle-Werte aller beanspruchenden Modelle je Spieler; der höhere Wert gewinnt das Ziel. Bei Gleichstand ändert sich nichts.","Add up the Control values of all contesting models per player; the higher total takes the objective. On a tie nothing changes."],["Prüfung: zu Beginn der ersten Schlachtrunde und am Ende jedes Zugs. Ein Ziel bleibt in deiner Kontrolle, bis der Gegner es gewinnt.","Check: at the start of the first battle round and at the end of each turn. An objective stays yours until the opponent gains it."],["Größe der Ziele: Aqshy, Ghyran und City of Ash 6\" Durchmesser; Ossia alle vier Ziele 5\"; Dolorum Eckziele 5\", Zentrum 7\". Beansprucht wird, sobald die Base die gedruckte Fläche berührt.","Objective sizes: Aqshy, Ghyran and City of Ash 6\" across; Ossia all four objectives 5\"; Dolorum corner objectives 5\", centre 7\". A unit contests as soon as its base touches the printed area."],["Standartenträger: +1 auf den Kontrollwert der Einheit.","Standard Bearer: +1 to the unit's control score."]],"sp":["Auf jedem Reichs-Schlachtfeld sind die Ziele namentlich bekannt (z. B. Draconithion, Ignax, Behemat, Vulcatrix, Nagendra).","On each realm battlefield objectives have names (e.g. Draconithion, Ignax, Behemat, Vulcatrix, Nagendra)."]},{"id":"heilen","ph":"x","t":["Heilen und Zurückbringen","Healing and returning models"],"s":["Heilen entfernt zugeteilten Schaden, Zurückbringen stellt gefallene Modelle wieder auf.","Healing removes allocated damage; returning models puts slain models back."],"d":[["Heal (X): Entferne X zugeteilte Schadenspunkte von einer Einheit. Es bringt keine gefallenen Modelle zurück.","Heal (X): remove X allocated damage points from a unit. It does not bring slain models back."],["Zurückbringen/Hinzufügen: Modelle werden einzeln im Zusammenhalt mit Modellen der Einheit aufgestellt, die nicht in diesem Zug zurückkamen (ab 7 Modellen: zu 2 anderen). Im Nahkampf mit einem Feind nur, wenn die Einheit schon mit ihm im Nahkampf ist.","Returning/adding: models are set up one at a time in coherency with models that did not return this turn (7+ models: with 2 others). They may be in combat with an enemy only if the unit already is."],["Marker (Tokens) sind keine Modelle: ignoriere sie bei Sicht und Zusammenhalt; sie zeigen Effekte an.","Tokens are not models: ignore them for visibility and coherency; they show ongoing effects."]],"sp":null},{"id":"verstaerkung","ph":"x","t":["Verstärkung","Reinforcements"],"s":["Zerstörte Einheiten mit dem Schlüsselwort Verstärkung können einmal als Ersatz zurückkehren.","Destroyed units with the Reinforcements keyword can return once as replacements."],"d":[["Verstärkung rufen (1× pro Zug, deine Bewegungsphase): Wähle eine zerstörte Einheit mit Verstärkung. Stelle eine identische Ersatzeinheit ganz in deinem Territorium, ganz innerhalb 6\" der Schlachtfeldkante und nicht im Nahkampf auf.","Call for Reinforcements (once per turn, your Movement phase): pick a destroyed Reinforcements unit. Set up an identical replacement wholly in your territory, wholly within 6\" of the battlefield edge and not in combat."],["Jede Verstärkungseinheit darf nur einmal ersetzt werden; Ersatzeinheiten können nicht ihrerseits ersetzt werden.","Each Reinforcements unit can be replaced only once; replacements cannot be replaced."],["Reserve: Einheiten in Reserve werden nicht aufgestellt, sondern später durch Fähigkeiten betreten (z. B. Tunnel der Skaven).","Reserve: units in reserve are not deployed but enter later via abilities (e.g. Skaven tunnels)."]],"sp":null},{"id":"sp","ph":"x","t":["Siegespunkte","Victory points"],"s":["Siegespunkte (SP) gibt es für gehaltene Ziele und erfüllte Taktikkarten. Wer nach 4 Runden die meisten hat, gewinnt.","Victory points (VP) come from held objectives and completed tactic cards. Whoever has the most after 4 rounds wins."],"d":[["Am Ende deines Zugs: 1 SP, wenn du mindestens 1 Ziel kontrollierst; +1 SP bei mindestens 2 Zielen; +1 SP, wenn du mehr Ziele kontrollierst als der Gegner.","At the end of your turn: 1 VP if you control at least 1 objective; +1 VP for 2 or more; +1 VP if you control more objectives than the opponent."],["Dazu +SP für erfüllte Taktikkarten (Vorhaben).","Plus VP for completed battle tactics."],["Wer weniger SP hat, ist in der Runde Außenseiter (mehr Befehlspunkte, Chance auf Initiative).","The player with fewer VP is the underdog for the round (more command points, a chance to seize the initiative)."]],"sp":null},{"id":"taktik","ph":"x","t":["Taktikkarten und Wendungen","Battle tactic and twist cards"],"s":["Jede Karte hat ein Vorhaben (Siegespunkte) und einen Befehl (sofortiger Vorteil) – du kannst nur eines nutzen.","Each card has a battle tactic (victory points) and a command (immediate benefit) – you can use only one."],"d":[["In Runde 1 ziehst du 3 Karten; danach darfst du abwerfen und wieder auf 3 auffüllen.","In round 1 you draw 3 cards; afterwards you may discard and refill to 3."],["Vorhaben werden am Ende deines Zugs gewertet, wenn die Bedingung erfüllt ist; der Befehl der Karte wird zum angegebenen Zeitpunkt genutzt und die Karte dann abgelegt.","Tactics are scored at the end of your turn if the condition is met; the card's command is played at the stated time and the card discarded."],["Wendungskarten (Twist) gelten für eine Schlachtrunde und hängen von der gewählten Reichsseite ab.","Twist cards apply to one battle round and depend on the chosen realm side."],["Pro Einheit und Phase nur 1 Befehl, auch von Karten.","Only 1 command per unit and phase – this includes card commands."]],"sp":null},{"id":"armee","ph":"x","t":["Spearhead-Armeen","Spearhead armies"],"s":["Jede Armee hat feste Einheiten, Kampfeigenschaften, eine Auswahl von 2 Regimentsfähigkeiten und 4 Verbesserungen.","Each army has fixed units, battle traits, a choice of 2 regiment abilities and 4 enhancements."],"d":[["Kampfeigenschaften (Battle Traits): mächtige, thematische Fähigkeiten für die ganze Armee.","Battle traits: powerful thematic abilities for the whole army."],["Regimentsfähigkeit: Du wählst 1 von 2; sie verleiht der Armee eine besondere Stärke.","Regiment ability: you pick 1 of 2; it gives the army a special strength."],["Verbesserung (Enhancement): 1 von 4 für den General; meist stärkt sie diesen oder die Nachbarn.","Enhancement: 1 of 4 for the general; usually strengthens the general or nearby units."],["Der General ist in jeder Armee festgelegt; fällt er, hat dies je nach Armee Folgen.","The general is fixed for each army; losing them has consequences depending on the army."]],"sp":null},{"id":"ende","ph":"x","t":["Ende der Schlachtrunde und der Schlacht","End of the battle round and battle"],"s":["Nach beiden Zügen gibt es Fähigkeiten für das Rundenende; nach der letzten Runde zählen die Siegespunkte.","After both turns end-of-round abilities are used; after the final round victory points decide."],"d":[["Am Ende der Schlachtrunde nutzt der aktive Spieler Fähigkeiten „Ende der Schlachtrunde“, dann der Gegner.","At the end of the battle round the active player uses End of Battle Round abilities, then the opponent."],["Befehlspunkte werden auf 0 gesetzt.","Command points reset to 0."],["Nach Runde 4 endet die Schlacht: die meisten Siegespunkte gewinnen.","After round 4 the battle ends: the most victory points wins."]],"sp":null}],"G":[{"id":"aktiv","k":[["aktiver Spieler","aktive Spieler","aktiven Spieler"],["active player"]],"t":["aktiver Spieler","active player"],"d":["Der Spieler, der gerade seinen Zug hat.","The player whose turn it currently is."],"s":"ablauf"},{"id":"aussen","k":[["Außenseiter"],["underdog"]],"t":["Außenseiter","underdog"],"d":["Wer weniger Siegespunkte hat; erhält 1 Befehlspunkt extra und kann die Initiative ergreifen.","The player with fewer victory points; gets 1 extra command point and may seize the initiative."],"s":"rundenbeginn"},{"id":"bp","k":[["Befehlspunkt","Befehlspunkte","Befehlspunkten","BP"],["command point","command points","CP"]],"t":["Befehlspunkt","command point"],"d":["Währung für Befehle: 4 pro Schlachtrunde (Außenseiter 5), verfallen am Rundenende.","Currency for commands: 4 per battle round (5 for the underdog), lost at the end of the round."],"s":"befehle"},{"id":"befehl","k":[["Befehl","Befehle"],["command","commands"]],"t":["Befehl","command"],"d":["Fähigkeit, die Befehlspunkte kostet; pro Einheit und Phase nur einer.","An ability that costs command points; only one per unit and phase."],"s":"befehle"},{"id":"prio","k":[["Prioritätswurf"],["priority roll"]],"t":["Prioritätswurf","priority roll"],"d":["Wurf zu Rundenbeginn (ab Runde 2): Der Gewinner entscheidet, wer den ersten Zug hat.","Roll at the start of a round (from round 2): the winner decides who takes the first turn."],"s":"rundenbeginn"},{"id":"kampfr","k":[["Kampfreichweite"],["combat range"]],"t":["Kampfreichweite","combat range"],"d":["3\" waagerecht um jedes Modell (senkrecht unbegrenzt).","3\" horizontally around every model (unlimited vertically)."],"s":"messen"},{"id":"nahkampf","k":[["Nahkampf","im Nahkampf"],["combat","in combat"]],"t":["Nahkampf","combat"],"d":["Zustand: Einheiten gegnerischer Armeen liegen in der Kampfreichweite des anderen und sehen sich.","Status: opposing units within each other's combat range that can see each other."],"s":"messen"},{"id":"zusammenhalt","k":[["Zusammenhalt"],["coherency"]],"t":["Zusammenhalt","coherency"],"d":["Modelle einer Einheit stehen höchstens ½\" auseinander und bilden eine Gruppe (ab 7 Modellen: 2 Nachbarn).","Models of a unit are within ½\" of each other and form one group (7+ models: 2 neighbours)."],"s":"messen"},{"id":"sichtbar","k":[["sichtbar","Sicht"],["visible","visibility"]],"t":["sichtbar","visible"],"d":["Eine Sichtlinie von einem Modell zu irgendeinem Teil des anderen ist möglich.","A line of sight from one model to any part of the other is possible."],"s":"sicht"},{"id":"schluessel","k":[["Schlüsselwort","Schlüsselwörter"],["keyword","keywords"]],"t":["Schlüsselwort","keyword"],"d":["Eigenschaft wie Held, Infanterie, Fliegen, die darüber entscheidet, welche Regeln gelten.","A trait such as Hero, Infantry or Fly that decides which rules apply."],"s":"schriftrolle"},{"id":"truppenschrift","k":[["Truppenschriftrolle"],["warscroll"]],"t":["Truppenschriftrolle","warscroll"],"d":["Das Datenblatt einer Einheit mit Werten, Waffen und Fähigkeiten.","The datasheet of a unit with characteristics, weapons and abilities."],"s":"schriftrolle"},{"id":"bewegung","k":[["Bewegung"],["Move"]],"t":["Bewegung","Move"],"d":["Wert: maximale Bewegungsstrecke eines Modells in Zoll.","Characteristic: maximum move distance of a model in inches."],"s":"schriftrolle"},{"id":"ausdauer","k":[["Ausdauer"],["Health"]],"t":["Ausdauer","Health"],"d":["Wert: So viele Schadenspunkte tötet 1 Modell.","Characteristic: damage points needed to slay 1 model."],"s":"schriftrolle"},{"id":"schutz","k":[["Schutzwurf","Schutzwert","Schutzwürfe","Schutzwürfen","Schutz"],["save","save roll","save rolls"]],"t":["Schutzwurf","save"],"d":["Wurf, um einen verwundenden Treffer abzuwehren; die Wucht wird abgezogen.","A roll to stop a wounding hit; Rend is subtracted."],"s":"angriffsfolge"},{"id":"kontrolle","k":[["Kontrolle","Kontrollwert"],["Control","control score"]],"t":["Kontrolle","Control"],"d":["Wert: Beitrag zur Zielkontrolle (je Modell).","Characteristic: contribution to objective control (per model)."],"s":"ziele"},{"id":"rettung","k":[["Rettung","Rettungswurf","Rettungswürfe","Rettungswürfen","Rettungswerte"],["Ward","ward save","ward roll","ward rolls"]],"t":["Rettung","Ward"],"d":["Zusatzwurf gegen jeden Schadenspunkt vor der Zuteilung; mehrere Rettungen: nur die beste zählt.","Extra roll against each damage point before allocation; with several wards only the best applies."],"s":"schaden"},{"id":"attacken","k":[["Attacken"],["Attacks"]],"t":["Attacken","Attacks"],"d":["Waffenwert: Anzahl der Würfe pro Modell.","Weapon characteristic: number of attacks per model."],"s":"angriffsfolge"},{"id":"treffen","k":[["Treffen","Trefferwurf","Trefferwürfe","Trefferwürfen"],["Hit","hit roll","hit rolls"]],"t":["Treffen","Hit"],"d":["Wurf, ob eine Attacke trifft; 6 unmodifiziert ist ein kritischer Treffer.","Roll to see if an attack hits; an unmodified 6 is a critical hit."],"s":"angriffsfolge"},{"id":"verwunden","k":[["Verwunden","Verwundungswurf","Verwundungswürfe","Verwundungswürfen"],["Wound","wound roll","wound rolls"]],"t":["Verwunden","Wound"],"d":["Wurf, ob ein Treffer verwundet.","Roll to see if a hit wounds."],"s":"angriffsfolge"},{"id":"wucht","k":[["Wucht"],["Rend"]],"t":["Wucht","Rend"],"d":["Wird vom Schutzwurf abgezogen.","Subtracted from the save roll."],"s":"angriffsfolge"},{"id":"schaden","k":[["Schaden","Schadenspunkt","Schadenspunkte","Schadenspunkten"],["Damage","damage point","damage points"]],"t":["Schaden","Damage"],"d":["Anzahl der Schadenspunkte, die eine erfolgreiche Attacke zufügt.","Number of damage points a successful attack inflicts."],"s":"schaden"},{"id":"pool","k":[["Schadenspool"],["damage pool"]],"t":["Schadenspool","damage pool"],"d":["Zwischenspeicher für Schaden, bevor Rettungswürfe gemacht und Modelle entfernt werden.","Temporary store for damage before ward rolls and removal of models."],"s":"schaden"},{"id":"tod","k":[["tödlicher Schaden","tödlichen Schaden","tödlichem Schaden"],["mortal damage"]],"t":["tödlicher Schaden","mortal damage"],"d":["Schaden ohne Treffer-, Verwundungs- oder Schutzwurf.","Damage without hit, wound or save rolls."],"s":"schaden"},{"id":"krit","k":[["kritischer Treffer","kritische Treffer","kritischen Treffer","Krit."],["critical hit","critical hits","Crit"]],"t":["kritischer Treffer","critical hit"],"d":["Ein unmodifizierter Trefferwurf von 6; löst oft Waffenfähigkeiten aus.","An unmodified hit roll of 6; often triggers weapon abilities."],"s":"waffenf"},{"id":"krit2","k":[["Krit. (2 Treffer)"],["Crit (2 Hits)"]],"t":["Krit. (2 Treffer)","Crit (2 Hits)"],"d":["Kritischer Treffer zählt als 2 Treffer.","A critical hit counts as 2 hits."],"s":"waffenf"},{"id":"kritv","k":[["Krit. (verwundet)"],["Crit (Auto-wound)"]],"t":["Krit. (verwundet)","Crit (Auto-wound)"],"d":["Kritischer Treffer verwundet automatisch.","A critical hit automatically wounds."],"s":"waffenf"},{"id":"kritt","k":[["Krit. (tödlich)"],["Crit (Mortal)"]],"t":["Krit. (tödlich)","Crit (Mortal)"],"d":["Kritischer Treffer verursacht tödlichen Schaden = Schaden der Waffe.","A critical hit inflicts mortal damage equal to the weapon's Damage."],"s":"waffenf"},{"id":"anti","k":[["Anti-"],["Anti-"]],"t":["Anti-","Anti-"],"d":["Waffe hat +1 Wucht gegen Ziele mit dem genannten Schlüsselwort.","The weapon has +1 Rend against targets with the stated keyword."],"s":"waffenf"},{"id":"angrbonus","k":[["Angriff (+1 Schaden)"],["Charge (+1 Damage)"]],"t":["Angriff (+1 Schaden)","Charge (+1 Damage)"],"d":["+1 Schaden, wenn die Einheit in diesem Zug angegriffen hat.","+1 Damage if the unit charged this turn."],"s":"waffenf"},{"id":"begleiter","k":[["Begleiter"],["Companion"]],"t":["Begleiter","Companion"],"d":["Die Waffe ist von Fähigkeiten ausgenommen, die Attacken oder die Angriffsfolge ändern.","The weapon is immune to abilities that alter Attacks or the attack sequence."],"s":"waffenf"},{"id":"nahbeschuss","k":[["Nahbeschuss"],["Shoot in Combat"]],"t":["Nahbeschuss","Shoot in Combat"],"d":["Die Waffe darf auch im Nahkampf schießen.","The weapon may shoot even in combat."],"s":"waffenf"},{"id":"rennen","k":[["Rennen","Rennenwurf","rennen"],["Run","run roll"]],"t":["Rennen","Run"],"d":["Bewegung + W6; danach kein Schießen oder Angreifen.","Move + D6; no shooting or charging afterwards."],"s":"bewegung"},{"id":"rueckzug","k":[["Rückzug","zurückziehen"],["Retreat"]],"t":["Rückzug","Retreat"],"d":["Verlässt den Nahkampf; kostet W3 tödlichen Schaden.","Leaves combat; costs D3 mortal damage."],"s":"bewegung"},{"id":"neupos","k":[["Neupositionierung"],["Redeploy"]],"t":["Neupositionierung","Redeploy"],"d":["Reaktion in der gegnerischen Bewegungsphase: Modelle bewegen sich bis W6\".","Reaction in the enemy Movement phase: models move up to D6\"."],"s":"bewegung"},{"id":"fliegen","k":[["Fliegen"],["Fly"]],"t":["Fliegen","Fly"],"d":["Ignoriert Modelle, Gelände und Kampfreichweiten beim Bewegen.","Ignores models, terrain and combat ranges when moving."],"s":"bewegung"},{"id":"angriff","k":[["Angriff","Angriffswurf","Angriffswürfe","angegriffen","Angriffsphase"],["Charge","charge roll","charged","Charge phase"]],"t":["Angriff","Charge"],"d":["2W6-Wurf; die Einheit zieht in den Nahkampf (½\" vom Feind).","2D6 roll; the unit moves into combat (within ½\" of an enemy)."],"s":"angriff"},{"id":"nachruecken","k":[["Nachrücken"],["pile-in","Pile In"]],"t":["Nachrücken","pile-in"],"d":["Bis 3\" ziehen, näher an einen Feind, vor dem Kämpfen.","Move up to 3\", closer to an enemy, before fighting."],"s":"kampf"},{"id":"kaempfen","k":[["Kämpfen"],["Fight"]],"t":["Kämpfen","Fight"],"d":["Fähigkeit der Kampfphase: nachrücken, dann Nahkampfattacken.","Combat-phase ability: pile in, then melee attacks."],"s":"kampf"},{"id":"kaempftzuerst","k":[["Kämpft zuerst"],["Strike-first"]],"t":["Kämpft zuerst","Strike-first"],"d":["Die Einheit kämpft vor allen anderen.","The unit fights before others."],"s":"kampf"},{"id":"kaempftzuletzt","k":[["Kämpft zuletzt"],["Strike-last"]],"t":["Kämpft zuletzt","Strike-last"],"d":["Die Einheit kämpft nach allen anderen.","The unit fights after others."],"s":"kampf"},{"id":"fernkampf","k":[["Fernkampf","Fernkampfphase","Fernkampfwaffe","Fernkampfwaffen","Fernkampfattacken"],["shooting","Shooting phase","missile weapon","ranged weapon"]],"t":["Fernkampf","shooting"],"d":["Angriffe mit Fernkampfwaffen auf sichtbare Ziele in Reichweite.","Attacks with ranged weapons at visible targets in range."],"s":"fernkampf"},{"id":"deckungsfeuer","k":[["Deckungsfeuer"],["Covering Fire"]],"t":["Deckungsfeuer","Covering Fire"],"d":["Reaktion: Schießen auf den nächsten sichtbaren Feind mit −1 auf Treffer.","Reaction: shoot at the nearest visible enemy with −1 to hit."],"s":"fernkampf"},{"id":"heldenphase","k":[["Heldenphase"],["Hero phase"]],"t":["Heldenphase","Hero phase"],"d":["Phase für Zauber, Gebete und Sammeln.","Phase for spells, prayers and rallying."],"s":"heldenphase"},{"id":"zauberer","k":[["Zauberer","Zaubererin"],["Wizard"]],"t":["Zauberer","Wizard"],"d":["Held, der Zauber wirkt (2W6 gegen Zauberwert).","A Hero that casts spells (2D6 against the casting value)."],"s":"heldenphase"},{"id":"priester","k":[["Priester","Priesterin"],["Priest"]],"t":["Priester","Priest"],"d":["Held, der Gebete spricht (W6 gegen Gebetswert).","A Hero that chants prayers (D6 against the prayer value)."],"s":"heldenphase"},{"id":"zauber","k":[["Zauber","Zauberwurf","Zauberwürfe"],["spell","casting roll"]],"t":["Zauber","spell"],"d":["2W6-Wurf, um einen Zauber zu wirken.","2D6 roll to cast a spell."],"s":"heldenphase"},{"id":"gebet","k":[["Gebet","Gebetswurf"],["prayer","chanting roll"]],"t":["Gebet","prayer"],"d":["W6-Wurf, um ein Gebet erfolgreich zu sprechen.","D6 roll to chant a prayer successfully."],"s":"heldenphase"},{"id":"bannen","k":[["Bannen","Bannversuch"],["Unbind"]],"t":["Bannen","Unbind"],"d":["Reaktion: Ein Zauberer übertrifft mit 2W6 den Zauberwurf.","Reaction: a Wizard beats the casting roll with 2D6."],"s":"heldenphase"},{"id":"manifest","k":[["Manifestation","Manifestationen"],["manifestation","manifestations"]],"t":["Manifestation","manifestation"],"d":["Beschworene magische Erscheinung; kann gebannt werden.","A summoned magical entity; can be banished."],"s":"heldenphase"},{"id":"sammeln","k":[["Sammeln"],["Rally"]],"t":["Sammeln","Rally"],"d":["Befehl: 6 Würfel, je 4+ ein Sammelpunkt zum Heilen oder Zurückbringen.","Command: 6 dice, each 4+ gives a rally point to heal or return models."],"s":"heldenphase"},{"id":"heilen","k":[["heile","heilen","Heilen","Heal"],["Heal"]],"t":["heile","Heal"],"d":["Entfernt zugeteilte Schadenspunkte.","Removes allocated damage points."],"s":"heilen"},{"id":"champion","k":[["Champion"],["champion"]],"t":["Champion","champion"],"d":["Modell mit +1 Attacken.","A model with +1 Attacks."],"s":"kampf"},{"id":"standarte","k":[["Standartenträger"],["standard bearer"]],"t":["Standartenträger","standard bearer"],"d":["+1 Kontrollwert der Einheit.","+1 to the unit's control score."],"s":"ziele"},{"id":"musiker","k":[["Musiker"],["musician"]],"t":["Musiker","musician"],"d":["Ein Zusatzwürfel beim Sammeln.","One extra die when rallying."],"s":"heldenphase"},{"id":"held","k":[["Held","Helden","Heldin"],["Hero","Heroes"]],"t":["Held","Hero"],"d":["Einheit mit Schlüsselwort Held; oft General oder Zauberer.","A unit with the Hero keyword; often a general or caster."],"s":"schriftrolle"},{"id":"heldenschutz","k":[["Geschützter Held","Heldenschutz"],["Guarded Hero"]],"t":["Geschützter Held","Guarded Hero"],"d":["Helden nahe einer nicht-heldischen Einheit sind schwerer zu beschießen.","Heroes near a non-Hero friendly unit are harder to shoot."],"s":"fernkampf"},{"id":"general","k":[["General","Generalin"],["general"]],"t":["General","general"],"d":["Der feste Anführer der Armee; Verbesserungen gelten für ihn.","The army's fixed leader; enhancements apply to them."],"s":"armee"},{"id":"deckung","k":[["Deckung"],["Cover"]],"t":["Deckung","Cover"],"d":["−1 auf Trefferwürfe gegen Einheiten hinter oder auf Gelände.","−1 to hit rolls against units behind or on terrain."],"s":"gelaende"},{"id":"versperrt","k":[["Versperrt Sicht"],["Obscuring"]],"t":["Versperrt Sicht","Obscuring"],"d":["Einheiten dahinter können nicht beschossen werden.","Units behind it cannot be shot."],"s":"gelaende"},{"id":"instabil","k":[["Instabil"],["Unstable"]],"t":["Instabil","Unstable"],"d":["Bewegung darüber erlaubt, aber nicht Aufstellen oder Enden, wo es höher als 1\" ist.","Crossing allowed, but no set-up or ending a move where it is taller than 1\"."],"s":"gelaende"},{"id":"unpass","k":[["Unpassierbar"],["Impassable"]],"t":["Unpassierbar","Impassable"],"d":["Modelle dürfen sich nicht darüber bewegen oder darauf enden.","Models cannot move across or end on it."],"s":"gelaende"},{"id":"ortmacht","k":[["Ort der Macht"],["Place of Power"]],"t":["Ort der Macht","Place of Power"],"d":["Helden innerhalb 3\" dürfen ihn aktivieren.","Heroes within 3\" can activate it."],"s":"gelaende"},{"id":"ziel","k":[["Ziel","Ziele","Zielen","Zielmarker"],["objective","objectives"]],"t":["Ziel","objective"],"d":["Aufgedruckter Kreis, der Siegespunkte bringt.","Printed circle that earns victory points."],"s":"ziele"},{"id":"zielk","k":[["Zielkontrolle"],["objective control"]],"t":["Zielkontrolle","objective control"],"d":["Wer mehr Kontrolle auf einem Ziel hat, kontrolliert es.","Whoever has more Control on an objective controls it."],"s":"ziele"},{"id":"territorium","k":[["Territorium"],["territory"]],"t":["Territorium","territory"],"d":["Aufstellungsbereich eines Spielers laut Aufstellungsplan.","A player's deployment area according to the map."],"s":"vorbereitung"},{"id":"verst","k":[["Verstärkung","Verstärkung rufen"],["Reinforcements","Call for Reinforcements"]],"t":["Verstärkung","Reinforcements"],"d":["Zerstörte Einheit kehrt einmal als Ersatz zurück.","A destroyed unit returns once as a replacement."],"s":"verstaerkung"},{"id":"reserve","k":[["Reserve"],["reserve"]],"t":["Reserve","reserve"],"d":["Einheiten, die später per Fähigkeit auf das Feld kommen.","Units that enter the battlefield later via an ability."],"s":"verstaerkung"},{"id":"regiment","k":[["Regimentsfähigkeit","Regimentsfähigkeiten","Regiment"],["regiment ability","regiment abilities","regiment"]],"t":["Regimentsfähigkeit","regiment ability"],"d":["Eine von 2 wählbaren Armeefähigkeiten.","One of 2 selectable army abilities."],"s":"armee"},{"id":"verbesserung","k":[["Verbesserung","Verbesserungen"],["enhancement","enhancements"]],"t":["Verbesserung","enhancement"],"d":["Eine von 4 Verbesserungen für den General.","One of 4 enhancements for the general."],"s":"armee"},{"id":"kampfeig","k":[["Kampfeigenschaft","Kampfeigenschaften"],["battle trait","battle traits"]],"t":["Kampfeigenschaft","battle trait"],"d":["Dauerhafte Fähigkeiten der gesamten Armee.","Permanent army-wide abilities."],"s":"armee"},{"id":"taktik","k":[["Taktisches Vorhaben","Vorhaben","Taktikkarte","Taktikkarten"],["battle tactic","battle tactics","battle tactic card"]],"t":["Taktisches Vorhaben","battle tactic"],"d":["Ziel auf einer Karte, das am Zugende Siegespunkte gibt.","A goal on a card that scores victory points at the end of the turn."],"s":"taktik"},{"id":"wendung","k":[["Wendungskarte","Wendung"],["twist card","twist"]],"t":["Wendungskarte","twist card"],"d":["Rundenregel aus dem Wendungsdeck des gewählten Reichs.","Round rule from the chosen realm's twist deck."],"s":"taktik"},{"id":"sp","k":[["Siegespunkt","Siegespunkte","Siegespunkten","SP"],["victory point","victory points","VP"]],"t":["Siegespunkt","victory point"],"d":["Punkte zum Gewinnen der Schlacht.","Points that decide the battle."],"s":"sp"},{"id":"schlachtrunde","k":[["Schlachtrunde","Schlachtrunden"],["battle round","battle rounds"]],"t":["Schlachtrunde","battle round"],"d":["Eine Runde, in der beide Spieler je einen Zug haben.","A round in which both players take one turn."],"s":"ablauf"},{"id":"phase","k":[["Phase","Phasen"],["phase","phases"]],"t":["Phase","phase"],"d":["Abschnitt eines Zugs: Hero, Bewegung, Fernkampf, Angriff, Kampf.","Section of a turn: Hero, Movement, Shooting, Charge, Combat."],"s":"ablauf"},{"id":"passiv","k":[["Passiv","passive Fähigkeit","passiven Fähigkeit"],["Passive","passive ability"]],"t":["Passiv","Passive"],"d":["Wirkt automatisch, solange die Bedingung erfüllt ist.","Applies automatically while the condition is met."],"s":"faehigkeiten"},{"id":"reaktion","k":[["Reaktion","Reaktionen"],["Reaction","reactions"]],"t":["Reaktion","Reaction"],"d":["Fähigkeit als Antwort auf eine angesagte Fähigkeit.","An ability used in response to a declared ability."],"s":"faehigkeiten"},{"id":"durchbrechen","k":[["Durchbrechen"],["Power Through"]],"t":["Durchbrechen","Power Through"],"d":["Zugende: Nach einem Angriff W3 tödlicher Schaden, dann Bewegung.","End of turn: after a charge D3 mortal damage, then a move."],"s":"kampf"},{"id":"fraktionsgel","k":[["Fraktionsgelände"],["faction terrain"]],"t":["Fraktionsgelände","faction terrain"],"d":["Besonderes Gelände einer Armee.","Special terrain feature of an army."],"s":"gelaende"},{"id":"zoll","k":[["Zoll"],["inch","inches"]],"t":["Zoll","inch"],"d":["Maßeinheit (\") für Entfernungen.","Unit (\") for distances."],"s":"messen"}],"FL":{"T":["Krit. (tödlich)","Crit (Mortal)"],"V":["Krit. (verwundet)","Crit (Auto-wound)"],"B":["Nahbeschuss","Shoot in Combat"],"G":["Begleiter","Companion"],"S":["Schockfäuste: Krit. Treffer = W6 Treffer","Shock Gauntlets: critical hit = D6 hits"],"M":["Jeder Treffer = 1 tödlicher Schaden","Each hit = 1 mortal damage"],"Q":["Anti-Zauberer/Priester (+1 Wucht)","Anti-Wizard/Priest (+1 Rend)"],"C":["Angriff (+1 Schaden)","Charge (+1 Damage)"],"D":["Krit. (2 Treffer)","Crit (2 Hits)"],"K":["Anti-Kavallerie (+1 Wucht)","Anti-Cavalry (+1 Rend)"],"H":["Anti-Held (+1 Wucht)","Anti-Hero (+1 Rend)"],"O":["Anti-Monster (+1 Wucht)","Anti-Monster (+1 Rend)"],"I":["Anti-Infanterie (+1 Wucht)","Anti-Infantry (+1 Rend)"],"N":["Anti-Angriff (+1 Wucht)","Anti-charge (+1 Rend)"]},"PK":[{"id":"fj","n":["Fire and Jade","Fire and Jade"],"sub":["Grundspiel · Reiche Aqshy und Ghyran","Core set · Realms of Aqshy and Ghyran"],"intro":["Das Battlepack aus dem Grundspiel. Zwei Reiche mit je 5 Zielen, jede Seite stellt 1 großes und 1 kleines Geländestück auf.","The battlepack from the core set. Two realms with 5 objectives each; each side sets up 1 large and 1 small terrain feature."],"setup":[["Würfelduell: Der Gewinner wird Angreifer oder Verteidiger.","Roll-off: the winner chooses to be attacker or defender."],["Beide Spieler wählen Regimentsfähigkeit und Verbesserung.","Both players pick a regiment ability and an enhancement."],["Der Verteidiger wählt das Schlachtfeld (Seite der Matte).","The defender picks the battlefield (side of the mat)."],["Der Verteidiger wählt die Aufstellungskarte (horizontal oder diagonal) und sein Gebiet.","The defender picks the deployment map (horizontal or diagonal) and their territory."],["Gelände wird aufgestellt (siehe unten).","Terrain is set up (see below)."],["Aufstellung: Der Angreifer beginnt, dann der Verteidiger – ganz im eigenen Gebiet, mehr als 6 Zoll vom Feindgebiet.","Deployment: the attacker goes first, then the defender – wholly in own territory, more than 6\" from enemy territory."]],"maps":[["Horizontal: Das Feld wird an der Mittellinie der langen Kante geteilt; jede Seite hat die Hälfte als Gebiet.","Horizontal: the board is split along the middle line; each side has one half as territory."],["Diagonal: Die Teilung verläuft von Ecke zu Ecke; jede Seite hat ein Dreieck als Gebiet.","Diagonal: the split runs corner to corner; each side has a triangle as territory."]],"bf":[{"n":["Aqshy (Reich des Feuers)","Aqshy (Realm of Fire)"],"obj":[{"n":"Vulcatrix","x":3,"y":3,"r":3,"w":null,"h":null,"a":0},{"n":"Ignax","x":25.25,"y":3.5,"r":3,"w":null,"h":null,"a":0},{"n":"Dracothion","x":15,"y":11.2,"r":3,"w":null,"h":null,"a":0},{"n":"Behemat","x":4.75,"y":18.9,"r":3,"w":null,"h":null,"a":0},{"n":"Nagendra","x":27,"y":19.4,"r":3,"w":null,"h":null,"a":0}]},{"n":["Ghyran (Reich des Lebens)","Ghyran (Realm of Life)"],"obj":[{"n":"Vulcatrix","x":7.5,"y":3.5,"r":3,"w":null,"h":null,"a":0},{"n":"Behemat","x":0.75,"y":11.2,"r":3,"w":null,"h":null,"a":0},{"n":"Dracothion","x":15,"y":11.2,"r":3,"w":null,"h":null,"a":0},{"n":"Ignax","x":29.25,"y":11.2,"r":3,"w":null,"h":null,"a":0},{"n":"Nagendra","x":22.5,"y":18.9,"r":3,"w":null,"h":null,"a":0}]}],"objNote":["Alle Ziele haben 6 Zoll Durchmesser. Für die Ziel-Taktikkarten (Podeste) zählt der Name des Ziels.","All objectives are 6\" across. The names matter for the dais battle tactic cards."],"terr":[{"n":["Großes Geländestück","Large terrain feature"],"d":["6\" × 1,5\"","6\" × 1.5\""],"k":["Sichtblocker: Deckung, blockiert die Sicht, instabil","Obscuring: cover, blocks visibility, unstable"],"t":["Jeder Spieler stellt 1 auf.","Each player sets up 1."]},{"n":["Kleines Geländestück","Small terrain feature"],"d":["3\" × 1,2\"","3\" × 1.2\""],"k":["Hindernis: Deckung, instabil","Obstacle: cover, unstable"],"t":["Jeder Spieler stellt 1 auf.","Each player sets up 1."]}],"terrNote":["Abwechselnd, der Verteidiger beginnt (groß, klein), dann der Angreifer: ganz im eigenen Gebiet, mehr als 6 Zoll von anderem Gelände, mehr als 3 Zoll von den langen Kanten und vom Feindgebiet, nicht auf Zielen. Gelände darf frei gedreht werden. Maße und Art sind im Spiel angenommen.","Alternating, defender first (large, small), then the attacker: wholly in own territory, more than 6\" from other terrain, more than 3\" from the long edges and enemy territory, not on objectives. Terrain can be rotated freely. Sizes and type are assumed in the game."],"tac":[{"n":"War of Attrition","c":["Erfüllt am Ende deines Zugs, wenn in diesem Zug feindliche Einheiten zerstört wurden UND mehr feindliche als befreundete Einheiten zerstört wurden.","Complete at the end of your turn if any enemy units were destroyed this turn AND more enemy than friendly units were destroyed this turn."],"k":"Stand Guard","t":["Gegnerische Heldenphase. Ansage: Wähle eine befreundete Einheit. Effekt: Sie kämpft in diesem Zug zuerst.","Enemy Hero Phase. Declare: pick a friendly unit. Effect: it has STRIKE-FIRST this turn."]},{"n":"Raid","c":["Erfüllt am Ende deines Zugs, wenn sich befreundete Einheiten vollständig im Feindgebiet und nicht im Nahkampf befinden.","Complete at the end of your turn if any friendly units are wholly within enemy territory and not in combat."],"k":"Steel Defence","t":["Reaktion: Der Gegner hat eine Attacke-Fähigkeit angesagt. Eingesetzt von: der anvisierten befreundeten Einheit. Effekt: Ignoriere in dieser Phase die Wucht von Attacken, die diese Einheit als Ziel haben.","Reaction: opponent declared an ATTACK ability. Used by: the targeted friendly unit. Effect: ignore the Rend characteristic of attacks that target it this phase."]},{"n":"Take the Flanks","c":["Erfüllt am Ende deines Zugs, wenn sich befreundete Einheiten innerhalb von 3 Zoll um jede kurze Schlachtfeldkante befinden.","Complete at the end of your turn if there are friendly units within 3\" of each short battlefield edge."],"k":"Redeploy","t":["Gegnerische Bewegungsphase. Ansage: Wähle eine befreundete Einheit, die nicht im Nahkampf ist. Effekt: Sie darf sich bis zu W6 Zoll bewegen (nicht in den Nahkampf).","Enemy Movement Phase. Declare: pick a friendly unit not in combat. Effect: it can move up to D6\" (not into combat)."]},{"n":"Take Without Warning","c":["Erfüllt am Ende deines Zugs, wenn du die Kontrolle über ein Ziel erlangt hast, das dein Gegner zu Beginn des Zugs kontrolliert hat, UND keine der Einheiten, die es umkämpfen, in diesem Zug eine Kämpfen-Fähigkeit eingesetzt hat.","Complete at the end of your turn if you gained control of an objective your opponent controlled at the start of the turn AND none of the units contesting it used a FIGHT ability this turn."],"k":"Fight to the Last","t":["Reaktion: Der Gegner hat eine Attacke-Fähigkeit angesagt. Eingesetzt von: der anvisierten befreundeten Einheit. Effekt: Sie hat in dieser Phase Rettung (5+).","Reaction: opponent declared an ATTACK ability. Used by: the targeted friendly unit. Effect: it has WARD (5+) this phase."]},{"n":"Hold Ground","c":["Erfüllt am Ende deines Zugs, wenn in dem großen Geländestück in deinem Gebiet mehr befreundete als feindliche Modelle um die Kontrolle kämpfen.","Complete at the end of your turn if there are more friendly than enemy models contesting the large terrain feature in your territory."],"k":"Rise to the Challenge","t":["Beliebige Nahkampfphase. Ansage: Wähle einen befreundeten HELDEN. Effekt: Heile (W6) diesen HELDEN.","Any Combat Phase. Declare: pick a friendly HERO. Effect: Heal (D6) that HERO."]},{"n":"Cut Off the Head","c":["Erfüllt am Ende deines Zugs, wenn der feindliche General in diesem Zug erschlagen wurde ODER in einem früheren Zug erschlagen wurde und in diesem Zug feindliche Einheiten zerstört wurden.","Complete at the end of your turn if the enemy general was slain this turn OR was slain in an earlier turn and any enemy units were destroyed this turn."],"k":"Counter-Charge","t":["Gegnerische Angriffsphase. Ansage: Wähle eine befreundete Einheit, die nicht im Nahkampf ist. Effekt: Sie darf eine Angriff-Fähigkeit einsetzen, als wäre es deine Angriffsphase.","Enemy Charge Phase. Declare: pick a friendly unit not in combat. Effect: it can use a CHARGE ability as if it were your charge phase."]},{"n":"The Ignax Dais","c":["Erfüllt, wenn du am Ende deines Zugs das Ziel Ignax kontrollierst.","Complete if you control the Ignax objective at the end of your turn."],"k":"Forward to Victory","t":["Reaktion: Du hast eine Angriff-Fähigkeit angesagt. Eingesetzt von: der Einheit, die sie einsetzt. Effekt: Du darfst den Angriffswurf wiederholen.","Reaction: you declared a CHARGE ability. Used by: the unit using it. Effect: you can re-roll the charge roll."]},{"n":"The Behemat Dais","c":["Erfüllt, wenn du am Ende deines Zugs das Ziel Behemat kontrollierst.","Complete if you control the Behemat objective at the end of your turn."],"k":"Scroll of Arcane Bolt","t":["Beliebige Heldenphase. Ansage: Wähle einen befreundeten HELDEN und eine sichtbare feindliche Einheit innerhalb von 12 Zoll und wirf einen Würfel. Effekt: Bei 2+ erleidet jene Einheit W3 tödlichen Schaden.","Any Hero Phase. Declare: pick a friendly HERO and a visible enemy unit within 12\", then roll a dice. Effect: on a 2+, inflict D3 mortal damage on that unit."]},{"n":"The Dracothion Dais","c":["Erfüllt, wenn du am Ende deines Zugs das Ziel Dracothion kontrollierst.","Complete if you control the Dracothion objective at the end of your turn."],"k":"Go to Ground","t":["Reaktion: Der Gegner hat eine Schießen-Fähigkeit angesagt. Eingesetzt von: der anvisierten Einheit. Effekt: Bis zum Ende der Phase treffen sie nur unmodifizierte Trefferwürfe von 6; sie kämpft in diesem Zug zuletzt.","Reaction: opponent declared a SHOOT ability. Used by: the targeted unit. Effect: until end of phase only unmodified hit rolls of 6 hit it; it has STRIKE-LAST this turn."]},{"n":"Raze","c":["Erfüllt am Ende deines Zugs, wenn sich befreundete Einheiten innerhalb von 3 Zoll um die lange Schlachtfeldkante im Feindgebiet befinden.","Complete at the end of your turn if any friendly units are within 3\" of the long battlefield edge in enemy territory."],"k":"Inspiring Presence","t":["Beliebige Heldenphase. Ansage: Wähle einen befreundeten HELDEN. Effekt: Wirf einen Würfel und addiere das Ergebnis für den Rest des Zugs zum Kontrollwert dieses HELDEN.","Any Hero Phase. Declare: pick a friendly HERO. Effect: roll a dice; add the result to the control score of that HERO for the rest of the turn."]},{"n":"Attack on Two Fronts","c":["Erfüllt am Ende deines Zugs, wenn du 2 Ziele kontrollierst, die dein Gegner zu Beginn des Zugs kontrolliert hat.","Complete at the end of your turn if you control 2 objectives that your opponent controlled at the start of the turn."],"k":"Call Reinforcements","t":["Beliebige Bewegungsphase. Ansage: Wähle eine zerstörte befreundete INFANTERIE- oder KAVALLERIE-Einheit mit 5+ Modellen, die noch nicht ersetzt wurde. Effekt: Stelle W3 Modelle von ihr mehr als 6 Zoll von allen feindlichen Einheiten entfernt auf.","Any Movement Phase. Declare: pick a destroyed friendly INFANTRY or CAVALRY unit with 5+ models that has not been replaced. Effect: set up D3 models from it more than 6\" from all enemy units."]},{"n":"Do Not Waver","c":["Erfüllt am Ende deines Zugs, wenn befreundete Einheiten in diesem Zug eine Kämpfen-Fähigkeit eingesetzt haben UND keine befreundete Einheit zerstört wurde.","Complete at the end of your turn if any friendly units used a FIGHT ability this turn AND no friendly units were destroyed this turn."],"k":"Fall Back and Rally","t":["Reaktion: Du hast eine Rückzug-Fähigkeit angesagt. Eingesetzt von: der Einheit, die sie einsetzt. Effekt: Kein tödlicher Schaden durch diesen Rückzug; wirf für jedes erschlagene Modell einen Würfel, bei 5+ kehrt 1 Modell zurück.","Reaction: you declared a RETREAT ability. Used by: the unit using it. Effect: no mortal damage from that RETREAT; roll 1 dice per slain model, each 5+ returns 1 model."]}],"tw":[{"n":["Aqshy","Aqshy"],"l":[{"n":"Ring of Fire","t":["Der Außenseiter wählt 1 Ziel (kein Außenseiter: Gewinner des Würfelduells). Dieses Ziel wird von keinem Spieler kontrolliert und kann in dieser Schlachtrunde weder umkämpft noch kontrolliert werden. Am Ende jedes Zugs dieser Runde, nachdem Siegpunkte vergeben wurden, erleidet jede Einheit mit Modellen darauf W3 tödlichen Schaden (für jede Einheit würfeln).","The underdog picks 1 objective (no underdog: roll-off winner). That objective is controlled by neither player and cannot be contested or controlled this battle round. At the end of each turn this round, after victory points are scored, inflict D3 mortal damage on each unit that has any models on it (roll for each unit)."]},{"n":"Let the Blood Flow","t":["Jeder Spieler erhält am Ende seines Zugs 1 zusätzlichen Siegpunkt für jede in diesem Zug zerstörte feindliche Einheit. Der Außenseiter wählt 1 befreundete Einheit, die rasend wird: +1 auf Trefferwürfe ihrer Nahkampfattacken in dieser Schlachtrunde.","Each player scores 1 extra victory point at the end of their turn for each enemy unit destroyed in that turn. The underdog picks 1 friendly unit to be frenzied: add 1 to hit rolls for its combat attacks this battle round."]},{"n":"Bloodmarked","t":["Der Außenseiter wählt in jeder Armee 1 Einheit, die blutmarkiert wird (kein Außenseiter: Jeder Spieler wählt 1 feindliche Einheit, der aktive Spieler beginnt). Jeder Spieler erhält am Ende der Schlachtrunde 1 zusätzlichen Siegpunkt, wenn die feindliche blutmarkierte Einheit in dieser Runde zerstört wurde.","The underdog picks 1 unit in each army to be bloodmarked (no underdog: each player picks 1 enemy unit, active player first). Each player scores 1 extra victory point at the end of the battle round if the enemy bloodmarked unit was destroyed this round."]},{"n":"Reclaim Aqshy","t":["Der Außenseiter wählt 2 Ziele (kein Außenseiter: Jeder Spieler wählt 1, der aktive Spieler beginnt). Jeder Spieler erhält am Ende seines Zugs 1 zusätzlichen Siegpunkt für jedes dieser Ziele, das er kontrolliert.","The underdog picks 2 objectives (no underdog: each player picks 1, active player first). Each player scores 1 extra victory point at the end of their turn for each of those objectives they control."]},{"n":"Mount the Attack","t":["Jeder Spieler erhält am Ende seines Zugs 1 zusätzlichen Siegpunkt für jedes Ziel, das er kontrolliert und das sein Gegner zu Beginn des Zugs kontrolliert hat. Der Außenseiter wählt 1 befreundete Einheit als Speerspitze: Ihre Nahkampfwaffen haben in dieser Schlachtrunde Angriff (+1 Schaden).","Each player scores 1 extra victory point at the end of their turn for each objective they control that their opponent controlled at the start of that turn. The underdog picks 1 friendly unit to be the spearhead: its melee weapons have Charge (+1 Damage) this battle round."]},{"n":"Wreathed in Smoke","t":["Der Außenseiter wählt 1 Ziel (kein Außenseiter: Gewinner des Würfelduells). Bis zum Ende der Schlachtrunde treffen bei Attacken gegen eine Einheit, die dieses Ziel umkämpft, nur unmodifizierte Trefferwürfe von 6.","The underdog picks 1 objective (no underdog: roll-off winner). Until the end of the battle round, only unmodified hit rolls of 6 hit when attacking a unit contesting that objective."]}]},{"n":["Ghyran","Ghyran"],"l":[{"n":"Reclaim Ghyran","t":["Der Außenseiter wählt 2 Ziele (kein Außenseiter: Jeder Spieler wählt 1, der aktive Spieler beginnt). Jeder Spieler erhält am Ende seines Zugs 1 zusätzlichen Siegpunkt für jedes dieser Ziele, das er kontrolliert.","The underdog picks 2 objectives (no underdog: each player picks 1, active player first). Each player scores 1 extra victory point at the end of their turn for each of those objectives they control."]},{"n":"Alarielle’s Blessing","t":["Der Außenseiter (kein Außenseiter: Gewinner des Würfelduells) wählt einen Effekt. Dornenschild: Eine befreundete Einheit hat in dieser Schlachtrunde Rettung (6+). Jaderegen: Bis zu 3 verschiedene befreundete Einheiten heilen je (W3) (für jede würfeln).","The underdog (no underdog: roll-off winner) picks one effect. Shield of Thorns: a friendly unit has WARD (6+) this battle round. Rain of Jade: up to 3 different friendly units Heal (D3) each (roll for each)."]},{"n":"Take the Land","t":["Jeder Spieler erhält am Ende seines Zugs 1 zusätzlichen Siegpunkt, wenn im großen Geländestück im Feindgebiet mehr befreundete als feindliche Modelle um die Kontrolle kämpfen. Der Außenseiter addiert 1 auf Verwundungswürfe für Attacken gegen eine Einheit, die ein großes Geländestück umkämpft.","Each player scores 1 extra victory point at the end of their turn if there are more friendly than enemy models contesting the large terrain feature in enemy territory. The underdog adds 1 to wound rolls for attacks that target a unit contesting a large terrain feature."]},{"n":"Grasping Vines","t":["Der Außenseiter (kein Außenseiter: Gewinner des Würfelduells) wählt eine feindliche Einheit. Bis zum Ende der Schlachtrunde ist ihr Bewegungswert halbiert und sie würfelt bei Angriffswürfen 1 Würfel weniger.","The underdog (no underdog: roll-off winner) picks an enemy unit. Until the end of the battle round, halve its Move characteristic and roll 1 fewer dice for its charge rolls."]},{"n":"The Grandfather’s Blessing","t":["Der Außenseiter (kein Außenseiter: Gewinner des Würfelduells) wählt einen Effekt. Nurgles Fäule: Eine feindliche Einheit hat in dieser Schlachtrunde −1 auf Schutzwürfe. Zersetzender Dunst: Für eine feindliche Einheit können in dieser Schlachtrunde keine Rettungswürfe gemacht werden.","The underdog (no underdog: roll-off winner) picks one effect. Nurgle’s Rot: an enemy unit has -1 to save rolls this battle round. Eroding Miasma: ward rolls cannot be made for an enemy unit this battle round."]},{"n":"Lifespring","t":["Der Außenseiter (kein Außenseiter: Gewinner des Würfelduells) wählt 1 Ziel als Lebensquelle dieser Schlachtrunde. Jeder Spieler erhält am Ende seines Zugs 1 zusätzlichen Siegpunkt, wenn er sie kontrolliert. Am Ende jedes Zugs, nachdem Siegpunkte vergeben wurden, heilt jede Einheit, die sie umkämpft, (1).","The underdog (no underdog: roll-off winner) picks 1 objective to be a lifespring this battle round. Each player scores 1 extra victory point at the end of their turn if they control it. At the end of each turn, after victory points are scored, Heal (1) each unit contesting it."]}]}]},{"id":"sb","n":["Sand and Bone","Sand and Bone"],"sub":["Schlachtfelder Dolorum und Ossia","Battlefields Dolorum and Ossia"],"intro":["Ein Schlachtfeld aus Knochenmauern und Gräbern: Mauern und Zäune bilden das Gelände, auf Ossia kommt die Crypt of Blood in die Mitte, und manche Wendungen bringen die Ikone der Nulahmia ins Spiel.","A battlefield of bone walls and graves: walls and fences form the terrain, Ossia adds the Crypt of Blood in the centre, and some twists bring in the Icon of Nulahmia."],"setup":[["Würfelduell: Der Gewinner wird Angreifer oder Verteidiger.","Roll-off: the winner chooses to be attacker or defender."],["Beide Spieler wählen Regimentsfähigkeit und Verbesserung.","Both players pick a regiment ability and an enhancement."],["Der Verteidiger wählt das Schlachtfeld (Seite der Matte).","The defender picks the battlefield (side of the mat)."],["Der Verteidiger wählt die Aufstellungskarte (horizontal oder diagonal) und sein Gebiet.","The defender picks the deployment map (horizontal or diagonal) and their territory."],["Gelände wird aufgestellt (siehe unten).","Terrain is set up (see below)."],["Aufstellung: Der Angreifer beginnt, dann der Verteidiger – ganz im eigenen Gebiet, mehr als 6 Zoll vom Feindgebiet.","Deployment: the attacker goes first, then the defender – wholly in own territory, more than 6\" from enemy territory."]],"maps":[["Horizontal: Teilung an der Mittellinie der langen Kante.","Horizontal: split along the middle line."],["Diagonal: Teilung von Ecke zu Ecke (Gebiet A oben rechts, Gebiet B unten links).","Diagonal: split corner to corner (territory A top right, B bottom left)."]],"bf":[{"n":["Dolorum","Dolorum"],"obj":[{"n":"Delusion","x":7.5,"y":2.5,"r":2.5,"w":null,"h":null,"a":0},{"n":"Necropolis","x":27.5,"y":5,"r":2.5,"w":null,"h":null,"a":0},{"n":"Grief","x":15,"y":11.2,"r":3.5,"w":null,"h":null,"a":0},{"n":"Blood","x":2.5,"y":17.4,"r":2.5,"w":null,"h":null,"a":0},{"n":"Night","x":22.5,"y":19.9,"r":2.5,"w":null,"h":null,"a":0}]},{"n":["Ossia","Ossia"],"obj":[{"n":"Delusion","x":2.5,"y":5,"r":2.5,"w":null,"h":null,"a":0},{"n":"Necropolis","x":17.5,"y":8.75,"r":2.5,"w":null,"h":null,"a":0},{"n":"Blood","x":12.5,"y":13.65,"r":2.5,"w":null,"h":null,"a":0},{"n":"Night","x":27.5,"y":17.4,"r":2.5,"w":null,"h":null,"a":0}],"my":"crypt"}],"objNote":["Dolorum: Mitte 7\" Durchmesser, Ecken 5\". Ossia: alle Ziele 5\" Durchmesser. Die Namen zählen für die Podest-Taktikkarten (Blood, Necropolis).","Dolorum: centre 7\" across, corners 5\". Ossia: all objectives 5\" across. The names matter for the dais battle tactic cards (Blood, Necropolis)."],"terr":[{"n":["Large Wall","Large Wall"],"d":["7\" × 0.8\" · Höhe 4\"","7\" × 0.8\" · height 4\""],"k":["Sichtblocker: Deckung, blockiert die Sicht, instabil","Obscuring: cover, blocks visibility, unstable"],"t":["Großes Geländestück","Large terrain feature"]},{"n":["Small Wall","Small Wall"],"d":["4\" × 0.8\" · Höhe 3\"","4\" × 0.8\" · height 3\""],"k":["Hindernis: Deckung, instabil","Obstacle: cover, unstable"],"t":["Kleines Geländestück","Small terrain feature"]},{"n":["Large Fence","Large Fence"],"d":["7\" × 0.8\" · Höhe 3\"","7\" × 0.8\" · height 3\""],"k":["Sichtblocker: Deckung, blockiert die Sicht, instabil","Obscuring: cover, blocks visibility, unstable"],"t":["Großes Geländestück","Large terrain feature"]},{"n":["Small Fence","Small Fence"],"d":["4\" × 0.8\" · Höhe 3\"","4\" × 0.8\" · height 3\""],"k":["Hindernis: Deckung, instabil","Obstacle: cover, unstable"],"t":["Kleines Geländestück","Small terrain feature"]},{"n":["Crypt of Blood","Crypt of Blood"],"d":["4.5\" × 1.6\" · Höhe 2\"","4.5\" × 1.6\" · height 2\""],"k":["Hindernis: Deckung, instabil","Obstacle: cover, unstable"],"t":["Nur auf Ossia: steht in der Mitte des Schlachtfelds, diagonal zur Feldrichtung. Fähigkeit – Unholy Draught (deine Nahkampfphase, 1× pro Zug): Wähle eine befreundete Einheit innerhalb von 6 Zoll um die Krypta und wirf einen W6 (+1 als Außenseiter): Bei 4+ addiert sie bis Zugende 1 auf Trefferwürfe im Nahkampf, sonst erleidet sie W3 tödlichen Schaden.","Ossia only: stands in the centre of the battlefield, along the diagonal. Ability – Unholy Draught (your Combat phase, once per turn): pick a friendly unit within 6\" of the crypt and roll a D6 (+1 for the underdog): on a 4+ it adds 1 to melee hit rolls until end of turn, otherwise it suffers D3 mortal damage."]},{"n":["Icon of Nulahmia","Icon of Nulahmia"],"d":["2\" × 2\" · Höhe 4\"","2\" × 2\" · height 4\""],"k":["Hindernis: Deckung, instabil","Obstacle: cover, unstable"],"t":["Wird nur durch die Wendung Haunted Locus aufgestellt und bleibt bis zum Rundenende. Fähigkeit – Veiled Promises (Ende deines Zugs, 1× pro Zug): Wähle eine befreundete Einheit innerhalb von 6 Zoll und wirf einen W6 (+1 als Außenseiter): Bei 4+ erhält sie bis Zugende +3 Kontrolle, sonst −3.","Only set up by the twist Haunted Locus and stays until the end of the round. Ability – Veiled Promises (end of your turn, once per turn): pick a friendly unit within 6\" and roll a D6 (+1 for the underdog): on a 4+ it gets +3 Control until end of turn, otherwise −3."]}],"groups":[{"n":["Gruppe A","Group A"],"l":["Large Wall","Small Fence"]},{"n":["Gruppe B","Group B"],"l":["Small Wall","Large Fence"]}],"terrNote":["Der Verteidiger wählt eine Geländegruppe, der Angreifer erhält die andere. Danach abwechselnd: Je 1 großes und 1 kleines Geländestück ganz im eigenen Gebiet, mehr als 6 Zoll von anderem Gelände, mehr als 3 Zoll von den langen Kanten und vom Feindgebiet, nicht auf Zielen. Auf Ossia steht zuerst die Crypt of Blood in der Mitte. Geländemaße sind nach Modellfotos geschätzt.","The defender picks a terrain group, the attacker takes the other. Then alternating: 1 large and 1 small feature each, wholly in own territory, more than 6\" from other terrain, more than 3\" from the long edges and enemy territory, not on objectives. On Ossia the Crypt of Blood stands in the centre first. Terrain sizes are estimated from model photos."],"tac":[{"n":"Dig Two Graves","c":["Erfüllt am Ende deines Zugs, wenn in diesem Zug sowohl im eigenen Gebiet als auch im Feindgebiet Modelle erschlagen wurden.","Complete at the end of your turn if models were slain in friendly territory and models were also slain in enemy territory this turn."],"k":"Counter-Charge","t":["Gegnerische Angriffsphase. Ansage: Wähle eine befreundete Einheit, die nicht im Nahkampf ist. Sie darf eine Angriff-Fähigkeit einsetzen, als wäre es deine Angriffsphase.","Enemy Charge Phase. Declare: pick a friendly unit not in combat. It can use a CHARGE ability as if it were your Charge phase."]},{"n":"War of Attrition","c":["Erfüllt am Ende deines Zugs, wenn in diesem Zug feindliche Einheiten zerstört wurden und mehr feindliche als befreundete Einheiten zerstört wurden.","Complete at the end of your turn if any enemy units were destroyed this turn and more enemy than friendly units were destroyed this turn."],"k":"Speed of Death","t":["Ende eines beliebigen Zugs. Ansage: Wähle eine befreundete Einheit im Nahkampf. Nimm sie vom Schlachtfeld und stelle sie mehr als 6 Zoll von allen feindlichen Einheiten wieder auf.","End of any turn. Declare: pick a friendly unit in combat. Remove it and set it up again more than 6\" from all enemy units."]},{"n":"Hold Ground","c":["Erfüllt am Ende deines Zugs, wenn du das große Geländestück in deinem eigenen Gebiet kontrollierst.","Complete at the end of your turn if you control the large terrain feature in your own territory."],"k":"Frantic Scramble","t":["Beliebige Nahkampfphase. Ansage: Wähle eine befreundete Einheit im Nahkampf. Sie darf sich bis zu 3 Zoll bewegen und dabei in den Nahkampf ziehen.","Any Combat Phase. Declare: pick a friendly unit in combat. It can move up to 3\" and may move into combat."]},{"n":"Raze","c":["Erfüllt am Ende deines Zugs, wenn sich befreundete Einheiten innerhalb von 3 Zoll um die lange Schlachtfeldkante im Feindgebiet befinden.","Complete at the end of your turn if any friendly units are within 3\" of the long battlefield edge in enemy territory."],"k":"Determined Effort","t":["Beliebige Angriffsphase. Ansage: Wähle eine befreundete Einheit, die nicht im Nahkampf ist. Sie addiert für den Rest des Zugs W3 auf ihre Angriffswürfe.","Any Charge Phase. Declare: pick a friendly unit not in combat. It adds D3 to its charge rolls for the rest of the turn."]},{"n":"Morbid Consecration","c":["Erfüllt am Ende deines Zugs, wenn du ein Ziel kontrollierst, das nicht vollständig im eigenen Gebiet liegt (nicht das Podest des Blutes oder das Podest der Nekropole).","Complete at the end of your turn if you control an objective that is not wholly within friendly territory (not the Dais of Blood or the Dais of the Necropolis)."],"k":"Final Breath","t":["Deine Heldenphase. Ansage: Wähle eine zerstörte befreundete Einheit, die noch nicht ersetzt wurde. Stelle einen Ersatz mit einem Ausdauerwert von insgesamt bis zu 4 (oder ein einzelnes Modell mit Schaden = Ausdauer minus 4) mehr als 6 Zoll von allen feindlichen Einheiten entfernt auf.","Your Hero Phase. Declare: pick a destroyed friendly unit not yet replaced. Set up a replacement with combined Health up to 4 (or a single model with damage = Health minus 4) more than 6\" from all enemy units."]},{"n":"Attack on Two Fronts","c":["Erfüllt am Ende deines Zugs, wenn du 2 Ziele kontrollierst, die dein Gegner zu Beginn des Zugs kontrolliert hat.","Complete at the end of your turn if you control 2 objectives that your opponent controlled at the start of the turn."],"k":"Translucent Flesh","t":["Reaktion: Der Gegner hat eine Attacke-Fähigkeit angesagt. Eingesetzt von: der anvisierten Einheit. Effekt: Für den Rest der Phase scheitert eine Attacke gegen sie, wenn der unmodifizierte Trefferwurf oder Verwundungswurf 1–3 beträgt.","Reaction: the opponent declared an ATTACK ability. Used by: the targeted unit. Effect: for the rest of the phase, if the unmodified hit or wound roll of an attack against it is 1-3, the attack fails."]},{"n":"Desolate Landscapes","c":["Erfüllt am Ende deines Zugs, wenn eine befreundete Einheit in diesem Zug eine Kämpfen-Fähigkeit eingesetzt hat, sich auf dem Schlachtfeld befindet und kein Ziel umkämpft.","Complete at the end of your turn if a friendly unit used a FIGHT ability this turn and is on the battlefield and not contesting an objective."],"k":"Aura of Ending","t":["Deine Heldenphase. Ansage: Wähle einen befreundeten HELDEN, der ein Ziel umkämpft. Wirf für jede feindliche Einheit, die es umkämpft, einen Würfel: Bei 4+ erleidet sie 2 tödlichen Schaden.","Your Hero Phase. Declare: pick a friendly HERO contesting an objective. Roll a dice for each enemy unit contesting it: on a 4+ it suffers 2 mortal damage."]},{"n":"Take Without Warning","c":["Erfüllt am Ende deines Zugs, wenn du die Kontrolle über ein Ziel erlangt hast, das dein Gegner zu Beginn des Zugs kontrolliert hat, und keine der Einheiten, die es umkämpfen, in diesem Zug eine Kämpfen-Fähigkeit eingesetzt hat.","Complete at the end of your turn if you gained control of an objective your opponent controlled at the start of the turn and none of the units contesting it used a FIGHT ability this turn."],"k":"Monument of Living Bone","t":["Beliebige Heldenphase. Ansage: Wähle ein Geländestück im eigenen Gebiet. Es wird für den Rest des Zugs zusätzlich wie ein Ziel behandelt.","Any Hero Phase. Declare: pick a terrain feature in friendly territory. For the rest of the turn it is also treated as an objective."]},{"n":"The Dais of the Necropolis","c":["Erfüllt am Ende deines Zugs, wenn du das Ziel Necropolis kontrollierst.","Complete at the end of your turn if you control the Necropolis objective."],"k":"Grind Them to Dust","t":["Beliebige Nahkampfphase. Ansage: Wähle eine befreundete Einheit. Sie darf in dieser Phase 2 Kämpfen-Fähigkeiten einsetzen; nach der ersten erleidet sie W3 tödlichen Schaden und kämpft für den Rest des Zugs zuletzt.","Any Combat Phase. Declare: pick a friendly unit. It can use 2 FIGHT abilities this phase; after the first it suffers D3 mortal damage and has STRIKE-LAST for the rest of the turn."]},{"n":"The Grip of Death","c":["Erfüllt am Ende deines Zugs, wenn du 2 Ziele kontrollierst, die nicht vollständig im eigenen Gebiet liegen.","Complete at the end of your turn if you control 2 objectives that are not wholly within friendly territory."],"k":"Re-form the Line!","t":["Gegnerische Bewegungsphase. Ansage: Wähle eine befreundete Einheit. Im Nahkampf: Sie darf einen Rückzug einsetzen, als wäre es deine Bewegungsphase. Nicht im Nahkampf: Wirf für jedes erschlagene Modell einen Würfel (5+ bringt 1 Modell zurück) oder für jeden Schadenspunkt (5+ heilt 1).","Enemy Movement Phase. Declare: pick a friendly unit. In combat: it can RETREAT as if it were your Movement phase. Not in combat: roll a dice per slain model (5+ returns 1 model) or per damage point (5+ heals 1)."]},{"n":"Raid","c":["Erfüllt am Ende deines Zugs, wenn sich befreundete Einheiten vollständig im Feindgebiet und nicht im Nahkampf befinden.","Complete at the end of your turn if any friendly units are wholly within enemy territory and not in combat."],"k":"Terrifying Assault","t":["Beliebige Angriffsphase. Ansage: Wähle eine befreundete Einheit im Nahkampf und eine feindliche Einheit im Nahkampf mit ihr. Wirf einen Würfel und subtrahiere das Ergebnis für den Rest des Zugs vom Kontrollwert des Ziels.","Any Charge Phase. Declare: pick a friendly unit in combat and an enemy unit in combat with it. Roll a dice and subtract the result from the target's control score for the rest of the turn."]},{"n":"The Dais of Blood","c":["Erfüllt am Ende deines Zugs, wenn du das Ziel Blood kontrollierst.","Complete at the end of your turn if you control the Blood objective."],"k":"Unleash Bloodlust","t":["Gegnerische Nahkampfphase. Ansage: Wähle eine befreundete Einheit. Addiere für den Rest des Zugs 1 auf die Attacken ihrer Nahkampfwaffen; ihr Kontrollwert ist dafür für den Rest der Schlachtrunde höchstens 1.","Enemy Combat Phase. Declare: pick a friendly unit. Add 1 to the Attacks of its melee weapons for the rest of the turn, but its maximum control score is 1 for the rest of the battle round."]}],"tw":[{"n":["Dolorum","Dolorum"],"l":[{"n":"Savage Mourning","t":["Jeder Spieler erhält am Ende seines Zugs 1 zusätzlichen SP für jede befreundete Einheit, die mit einer feindlichen Einheit im Nahkampf ist. Hat der Außenseiter in dieser Schlachtrunde mehr Einheiten verloren als der Gegner, erhält er 1 zusätzlichen SP.","Each player scores 1 extra VP at the end of their turn for each friendly unit in combat with an enemy unit. If the underdog has had more units destroyed than the enemy this battle round, they score 1 extra VP."]},{"n":"Survivor's Grief","t":["Jeder Spieler erhält am Ende seines Zugs 1 zusätzlichen SP für jede seiner im Verlauf der Schlacht zerstörten oder ersetzten Spearhead-Einheiten (Ersatzeinheiten zählen nicht). Der Außenseiter (sonst Gewinner des Würfelduells) wählt 1 befreundete Einheit: Sie darf in dieser Schlachtrunde auch nach einem Rennen oder Rückzug angreifen.","Each player scores 1 extra VP at the end of their turn for each of their Spearhead units destroyed or replaced during the battle (replacement units do not count). The underdog (else roll-off winner) picks 1 friendly unit: it can charge even after a run or retreat this battle round."]},{"n":"Banish Your Fears","t":["Jeder Spieler erhält am Ende seines Zugs 1 zusätzlichen SP für jedes Ziel, das er kontrolliert und das der Gegner zu Beginn des Zugs kontrolliert hat. Der Außenseiter wählt 1 befreundete Einheit: Ihre Nahkampfwaffen haben in dieser Schlachtrunde Anti-Angriff (+1 Wucht).","Each player scores 1 extra VP at the end of their turn for each objective they control that the opponent controlled at the start of that turn. The underdog picks 1 friendly unit: its melee weapons have Anti-charge (+1 Rend) this battle round."]},{"n":"Overpowering Grief","t":["Der Außenseiter (sonst Gewinner des Würfelduells) wählt 1 Ziel. Es wird von keinem Spieler kontrolliert und kann für den Rest der Schlachtrunde nicht kontrolliert werden.","The underdog (else roll-off winner) picks 1 objective. It is controlled by neither player and cannot be controlled for the rest of the battle round."]},{"n":"Haunted Locus","t":["Der Außenseiter (sonst Gewinner des Würfelduells) stellt die Ikone der Nulahmia irgendwo auf dem Schlachtfeld auf: mehr als 3 Zoll von allen Geländestücken und Einheiten, ohne ein Ziel zu berühren. Sie bleibt bis zum Ende der Schlachtrunde.","The underdog (else roll-off winner) places the Icon of Nulahmia anywhere on the battlefield: more than 3\" from all terrain features and all units, not touching an objective. It stays until the end of the battle round."]},{"n":"Darkened Skies","t":["Der Außenseiter (sonst Gewinner des Würfelduells) wählt 1 Ziel. Für den Rest der Schlachtrunde gilt es als von einer befreundeten Einheit dieses Spielers mit einem nicht modifizierbaren Kontrollwert von 1 umkämpft.","The underdog (else roll-off winner) picks 1 objective. For the rest of the battle round it counts as contested by a friendly unit of that player with an unmodifiable control score of 1."]}]},{"n":["Ossia","Ossia"],"l":[{"n":"Disciplined Conquest","t":["Der Außenseiter wählt 2 Ziele (kein Außenseiter: Jeder Spieler wählt 1, der aktive Spieler beginnt). Jeder Spieler erhält am Ende seines Zugs 2 zusätzliche SP, wenn er beide kontrolliert.","The underdog picks 2 objectives (no underdog: each player picks 1, active player first). Each player scores 2 extra VP at the end of their turn if they control both."]},{"n":"Invincible Redoubts","t":["Der Außenseiter (sonst Gewinner des Würfelduells) wählt: Präzisionsschlag (eine befreundete Einheit kämpft zuerst, solange sie vollständig im eigenen Gebiet ist) oder Zwietracht in den Reihen (eine feindliche Einheit kämpft zuletzt, solange sie vollständig im Gebiet des Außenseiters ist), jeweils für den Rest der S
