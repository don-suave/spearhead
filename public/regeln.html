,"hp":3,"m":3,"sv":5,"cv":1,"wd":6,"b":"40","g":0,"note":null,"rw":[],"mw":[{"n":["Rundmaulbiss","Lamprey Bite"],"a":3,"h":4,"w":3,"rd":1,"d":1,"f":""}],"ab":[{"n":["Messerscharfe Finnen","Razor-sharp Fins"],"t":["Deine Bewegungsphase: Feindliche Einheit, über die sich Modelle bewegt haben; je Modell, das sich über sie bewegt hat, ein Würfel; je 4+ 1 tödlicher Schaden.","Your Movement phase: enemy unit that models moved across; one die per model that moved across it; each 4+ 1 mortal damage."]}]},{"n":["Tzaangors","Tzaangors"],"kw":[["Infanterie","Infantry"],["Verstärkung","Reinforcements"]],"mv":6,"hp":2,"m":5,"sv":5,"cv":1,"wd":0,"b":"40","g":0,"note":null,"rw":[],"mw":[{"n":["Bösartige Klinge und Schnabel","Vicious Blade and Beak"],"a":2,"h":4,"w":3,"rd":0,"d":1,"f":""}],"ab":[]},{"n":["Feuerdämonen des Tzeentch","Flamers of Tzeentch"],"kw":[["Infanterie","Infantry"],["Fliegen","Fly"],["Rettung (6+)","Ward (6+)"]],"mv":9,"hp":2,"m":3,"sv":5,"cv":1,"wd":6,"b":"40","g":0,"note":null,"rw":[{"n":["Wyrdflammen","Warpflames"],"r":12,"a":3,"h":3,"w":4,"rd":0,"d":["W3","D3"],"f":""}],"mw":[{"n":["Flammende Mäuler","Flaming Maws"],"a":3,"h":3,"w":4,"rd":0,"d":1,"f":""}],"ab":[]}]}],"R":[{"id":"ablauf","ph":"x","t":["Spielablauf im Überblick","Game overview"],"s":["Eine Schlacht besteht aus Schlachtrunden. In jeder Runde hat jeder Spieler einen Zug; jeder Zug läuft in festen Phasen ab.","A battle is fought in battle rounds. In each round both players take a turn, and every turn is played in fixed phases."],"d":[["Spearhead dauert 4 Schlachtrunden (ca. 1,5 Stunden). Gewonnen hat, wer am Ende die meisten Siegespunkte hat.","Spearhead lasts 4 battle rounds (about 1.5 hours). Whoever has the most victory points at the end wins."],["Reihenfolge im Zug: Zugbeginn → Heldenphase → Bewegungsphase → Fernkampfphase → Angriffsphase → Kampfphase → Zugende.","Order within a turn: start of turn → Hero phase → Movement phase → Shooting phase → Charge phase → Combat phase → end of turn."],["Der Spieler, der gerade am Zug ist, heißt aktiver Spieler – egal ob er den ersten oder zweiten Zug der Runde hat.","The player whose turn it is is the active player – whether they go first or second in the round."],["Vor der ersten Runde folgen Vorbereitung und Aufstellungsphase.","Before round 1 come the pre-battle steps and the deployment phase."]],"sp":null},{"id":"messen","ph":"x","t":["Entfernungen, Kampfreichweite, Zusammenhalt","Distances, combat range, coherency"],"s":["Gemessen wird in Zoll (\") von Basenrand zu Basenrand. Jedes Modell hat 3\" Kampfreichweite; Einheiten müssen zusammenhalten.","Distances are measured in inches (\") from base edge to base edge. Every model has a 3\" combat range; units must stay together."],"d":[["Kampfreichweite: 3\" waagerecht um den Basenrand, senkrecht unbegrenzt. Die Kampfreichweite einer Einheit ist die Summe der Reichweiten all ihrer Modelle.","Combat range: 3\" horizontally from the base edge, unlimited vertically. A unit's combat range is the combined range of all its models."],["Zwei gegnerische Einheiten, die in der Kampfreichweite der anderen liegen und sich sehen können, sind im Nahkampf.","Two opposing units within each other's combat range that can see each other are in combat."],["Zusammenhalt: Nach jedem Setzen oder Bewegen muss jedes Modell höchstens ½\" (waagerecht) von mindestens einem Modell der eigenen Einheit entfernt sein, die Einheit bildet also eine einzige Gruppe.","Coherency: after being set up or moving, every model must be within ½\" (horizontally) of at least one other model of its unit, so the unit forms one single group."],["Hat eine Einheit 7 oder mehr Modelle, muss jedes Modell zu mindestens zwei anderen Modellen Zusammenhalt haben.","While a unit has 7 or more models, each model must be in coherency with at least two others."],["Kann eine Bewegung nicht im Zusammenhalt enden, darf sie nicht ausgeführt werden. Beim Entfernen gefallener Modelle muss der Zusammenhalt erhalten bleiben (möglichst wenige zusätzliche Modelle entfernen).","If a move cannot end in coherency it cannot be made. When slain models are removed, coherency must be kept (remove as few extra models as possible)."]],"sp":null},{"id":"sicht","ph":"x","t":["Sichtbarkeit","Visibility"],"s":["Ein Modell sieht ein anderes, wenn man von seinem Körper aus eine Sichtlinie zu irgendeinem Teil des anderen ziehen kann.","A model can see another if a line of sight can be drawn from its body to any part of the other model."],"d":[["Modelle in derselben Einheit blockieren die Sicht nicht; Geländestücke mit „Versperrt Sicht“ schon.","Models in the same unit never block sight; terrain with Obscuring does."],["Für Fernkampf muss das Ziel sichtbar sein, im Nahkampf muss es sichtbar und in Kampfreichweite sein.","For shooting the target must be visible; for melee it must be visible and within combat range."],["Hinter einem Gelände mit „Deckung“ stehende Ziele sind schwerer zu treffen (−1 auf Trefferwürfe).","Targets behind terrain with Cover are harder to hit (−1 to hit rolls)."]],"sp":null},{"id":"schriftrolle","ph":"x","t":["Truppenschriftrolle und Werte","Warscroll and characteristics"],"s":["Jede Einheit hat eine Truppenschriftrolle mit Werten, Waffen, Fähigkeiten und Schlüsselwörtern.","Every unit has a warscroll with characteristics, weapons, abilities and keywords."],"d":[["Bewegung (Move): wie weit sich Modelle bei Bewegungen höchstens bewegen dürfen.","Move: the maximum distance models can move."],["Ausdauer (Health): so viele Schadenspunkte tötet 1 Modell. Schutzwurf (Save): Mindestwurf, um einen Treffer abzuwehren.","Health: damage points needed to slay one model. Save: the roll needed to stop a successful attack."],["Kontrolle (Control): Beitrag der Modelle zur Zielkontrolle. Rettung (Ward): zusätzlicher Wurf gegen jeden einzelnen Schadenspunkt.","Control: how much each model counts for objective control. Ward: an extra roll against each single damage point."],["Waffen: Reichweite, Attacken, Treffen, Verwunden, Wucht (Rend), Schaden sowie Waffenfähigkeiten.","Weapons: Range, Attacks, Hit, Wound, Rend and Damage, plus weapon abilities."],["Schlüsselwörter wie Held, Infanterie, Fliegen oder Verstärkung entscheiden, welche Regeln und Fähigkeiten auf die Einheit wirken.","Keywords such as Hero, Infantry, Fly or Reinforcements decide which rules and abilities apply to the unit."]],"sp":null},{"id":"faehigkeiten","ph":"x","t":["Fähigkeiten einsetzen","Using abilities"],"s":["Fähigkeiten werden angesagt, Gegner können reagieren, dann wird der Effekt abgehandelt. Passive Fähigkeiten wirken automatisch.","Abilities are declared, opponents may react, then the effect is resolved. Passive abilities just apply."],"d":[["1. Fähigkeit ansagen (Ziel/Ansage). 2. Reaktionen: abwechselnd, der aktive Spieler beginnt. 3. Effekt abhandeln.","1. Declare the ability. 2. Reactions, alternating, active player first. 3. Resolve the effect."],["Eine Einheit darf pro Phase nur 1 Kern-Fähigkeit (Core) einsetzen.","A unit can use only 1 Core ability per phase."],["Passive Fähigkeiten werden nicht angesagt; sie wirken immer, solange ihre Bedingung erfüllt ist. Dieselbe passive Wirkung zählt nie doppelt.","Passive abilities are not declared; they always apply while their condition is met. The same passive effect never stacks."],["„Einmal pro Schlacht / Zug / Phase“ begrenzt, wie oft eine Fähigkeit zählt (je Einheit oder, bei „Armee“, für das ganze Heer).","“Once per battle / turn / phase” limits how often an ability can be used (per unit or, with “army”, for the whole army)."],["Regeln der Eins: 1 Kern-Fähigkeit pro Phase; dieselbe Fähigkeit nicht mehrmals pro Phase (wenn nicht anders angegeben); dieselbe passive Wirkung nie mehrfach gleichzeitig.","Rules of One: 1 Core ability per phase; the same ability not more than once per phase (unless stated); the same passive effect never twice at the same time."]],"sp":null},{"id":"befehle","ph":"x","t":["Befehlspunkte und Befehle","Command points and commands"],"s":["Befehle sind Fähigkeiten, die Befehlspunkte (BP) kosten. Pro Schlachtrunde gibt es 4 BP, mit Außenseiter-Bonus 5.","Commands are abilities that cost command points (CP). Each battle round you get 4 CP, or 5 as the underdog."],"d":[["Befehlspunkte verfallen am Rundenende – nichts wird gespart.","Unused command points are lost at the end of the battle round – nothing is saved."],["Jede Einheit darf pro Phase nur 1 Befehl einsetzen, jeder Befehl nur 1-mal pro Armee und Phase.","Each unit can use only 1 command per phase, and each command only once per army per phase."],["Typische Befehle: Sammeln (Rally), Im Laufschritt, Vorwärts zum Sieg (Angriffswurf wiederholen), Gegenangriff, Magischer Eingriff, Alles-oder-nichts-Angriff und Alles-oder-nichts-Verteidigung.","Typical commands: Rally, At the Double, Forward to Victory (re-roll a charge), Counter-charge, Magical Intervention, All-out Attack and All-out Defence."]],"sp":null},{"id":"vorbereitung","ph":"v","t":["Vorbereitung der Schlacht","Pre-battle steps"],"s":["Armeen wählen, Schlachtplan und Seite bestimmen, Gelände aufbauen – dann beginnt die Aufstellung.","Choose armies, determine battleplan and side, set up terrain – then deployment begins."],"d":[["Jeder Spieler nimmt eine Spearhead-Armee; ihre Zusammensetzung ist fest und kann nicht verändert werden.","Each player takes a Spearhead army; its composition is fixed and cannot be changed."],["Ein Wurf entscheidet, wer Angreifer und wer Verteidiger ist. Beide wählen ein Regimentsfähigkeit und eine Verbesserung für den General.","A roll-off decides attacker and defender. Both pick one regiment ability and one enhancement for their general."],["Auf der gewählten Karte (Aufstellungsplan) gehört je eine Hälfte als Territorium jedem Spieler; die Seite der Reiche-Schlachtfeld-Regel wird ausgewählt.","On the chosen map each player owns a territory; the realm battlefield side is chosen."],["Gelände: jeder Spieler stellt 1 großes und 1 kleines Geländestück. Anderes Gelände mehr als 6\" entfernt, mehr als 3\" von langen Kanten und gegnerischem Territorium, nicht auf Zielen.","Terrain: each player places 1 large and 1 small terrain feature. Other terrain more than 6\" away, more than 3\" from long edges and enemy territory, not on objectives."],["Wähle Taktikkarten-Deck und Wendungskarten (Twist) des gewählten Reichs.","Prepare the battle tactic deck and the twist cards of the chosen realm."]],"sp":["Die Zusammensetzung einer Spearhead-Armee ist fest: Regiment, General, Kampfeigenschaften.","A Spearhead army has a fixed composition: regiment, general, battle traits."]},{"id":"aufstellung","ph":"v","t":["Aufstellungsphase","Deployment phase"],"s":["Abwechselnd werden Einheiten innerhalb des eigenen Territoriums aufgestellt. Der Angreifer beginnt.","Players alternate setting up units wholly inside their own territory. The attacker starts."],"d":[["Einheit aufstellen (Deploy): ganz im eigenen Territorium und mehr als 6\" (Schnelleinstieg: 9\") vom gegnerischen Territorium.","Deploy: wholly within your territory and more than 6\" (Quick Start: 9\") from enemy territory."],["Fraktionsgelände wird ganz in deinem Territorium, mehr als 3\" von Zielen und anderem Gelände aufgestellt.","Faction terrain is set up wholly in your territory, more than 3\" from objectives and other terrain."],["Aufstellungsfähigkeiten der Armee (z. B. Reserve, Tunnel) werden danach abgehandelt.","Army deployment abilities (reserve, tunnels, etc.) are used afterwards."],["Ein Regiment kann am Stück aufgestellt werden („Regiment aufstellen“).","A whole regiment can be deployed in one go (“Deploy regiment”)."]],"sp":null},{"id":"rundenbeginn","ph":"r","t":["Beginn der Schlachtrunde","Start of the battle round"],"s":["Wer beginnt, ist in Runde 1 der Angreifer; danach entscheidet der Prioritätswurf. Außenseiter, Taktikkarten und Befehlspunkte werden bestimmt.","In round 1 the attacker starts; later the priority roll decides. Underdog, tactic cards and command points are determined."],"d":[["Aktiven Spieler bestimmen: Runde 1 entscheidet der Angreifer; ab Runde 2 würfeln beide (Prioritätswurf), der Gewinner wählt den ersten Zug. Bei Gleichstand entscheidet, wer zuletzt den ersten Zug hatte.","Active player: in round 1 the attacker chooses; from round 2 both roll (priority roll) and the winner picks who goes first. On a tie, whoever went first last round chooses."],["Außenseiter ist, wer weniger Siegespunkte hat; bei Gleichstand gibt es keinen.","The underdog is the player with fewer victory points; on a tie there is none."],["Wendungskarte der Runde aufdecken; Taktikkarten ziehen/auffüllen (Hand: 3 Karten).","Reveal the round's twist card; draw/refill battle tactic cards (hand size 3)."],["Befehlspunkte: jeder erhält 4 (Außenseiter 5). Danach Fähigkeiten „Beginn der Schlachtrunde“ (aktiver Spieler zuerst).","Command points: each player gets 4 (underdog 5). Then Start of Battle Round abilities (active player first)."],["Initiative ergreifen: Wer den ersten Zug in Runde 2+ wählt, erhält keine neuen Taktikkarten, außer als Außenseiter mit ≥5 SP Rückstand.","Seizing the initiative: a player choosing the first turn in round 2+ draws no new tactic cards unless they are underdog by 5+ VP."]],"sp":null},{"id":"zugablauf","ph":"z","t":["Zugbeginn und Zugende","Start and end of turn"],"s":["Zu Zugbeginn und Zugende gibt es eigene Fähigkeiten; am Zugende werden Ziele geprüft und Siegespunkte gewertet.","There are abilities at the start and end of each turn; objectives are checked and victory points scored at the end."],"d":[["Zugbeginn: Taktisches Vorhaben (1× pro Runde, ein Taktik-Vorhaben zusätzlich versuchen), Ort der Macht aktivieren.","Start of turn: Tactical Gambit (once per round), Activate Place of Power."],["In jeder Phase nutzt zuerst der aktive Spieler seine Fähigkeiten, danach der Gegner.","In every phase the active player uses abilities first, then the opponent."],["Zugende: Siegespunkte werden für Ziele und erfüllte Vorhaben gezählt; Fähigkeiten wie Standartenträger, Durchbrechen oder Nahkampf-Effekte wirken.","End of turn: victory points are scored for objectives and completed tactics; abilities such as Standard Bearer and Power Through take effect."],["Zielkontrolle wird zu Beginn der ersten Schlachtrunde und am Ende jedes Zugs geprüft.","Objective control is checked at the start of the first battle round and at the end of each turn."]],"sp":null},{"id":"heldenphase","ph":"h","t":["Heldenphase","Hero phase"],"s":["Helden sammeln Mut, Zauberer wirken Zaubersprüche, Priester sprechen Gebete.","Heroes rally troops, Wizards cast spells and Priests chant prayers."],"d":[["Sammeln (Rally, 1 BP): Eine Einheit außerhalb des Nahkampfs würfelt 6 Würfel; je 4+ gibt 1 Sammelpunkt. Ein Sammelpunkt heilt 1 Schadenspunkt; so viele Punkte wie die Ausdauer des Modells bringen 1 Modell zurück. Musiker geben einen zusätzlichen Würfel.","Rally (1 CP): a unit not in combat rolls 6 dice; each 4+ gives a rally point. One point heals 1 damage; points equal to the model's Health return a slain model. Musicians add an extra die."],["Zauber: Ein Zauberer sagt einen Zauber an und würfelt 2W6 gegen den Zauberwert. Gelingt der Wurf, tritt der Effekt ein.","Spells: a Wizard declares a spell and rolls 2D6 against the casting value. If it succeeds the effect happens."],["Bannen (Unbind, Reaktion): Ein gegnerischer Zauberer innerhalb 30\" würfelt 2W6; übertrifft er den Zauberwurf, verpufft der Zauber. Pro Zauber nur 1 Bannversuch.","Unbind (reaction): an enemy Wizard within 30\" rolls 2D6; if it beats the casting roll the spell fails. One attempt per spell."],["Gebete: Ein Priester sagt ein Gebet an und würfelt einen W6 (Gebetswurf) gegen den Wert des Gebets.","Prayers: a Priest declares a prayer and rolls a D6 (chanting roll) against its value."],["Manifestationen brechen (Banish Manifestation): Zauberer/Priester würfeln 2W6 gegen den Bannwert der Manifestation (30\").","Banish Manifestation: a Wizard/Priest rolls 2D6 against the manifestation's banishment value (30\")."],["Magischer Eingriff (gegnerische Heldenphase, Befehl): Ein Zauberer/Priester darf mit −1 einen Zauber/ein Gebet wirken.","Magical Intervention (enemy Hero phase, command): a Wizard/Priest can cast/chant with −1."]],"sp":null},{"id":"bewegung","ph":"b","t":["Bewegungsphase","Movement phase"],"s":["Einheiten bewegen sich: normal, rennend oder im Rückzug. Nur der Rückzug führt aus dem Nahkampf heraus.","Units move: normally, running or retreating. Only a retreat leaves combat."],"d":[["Normale Bewegung: bis zur Bewegung (Move) weit, nicht in den Nahkampf hinein; Einheit muss im Zusammenhalt enden.","Normal Move: up to Move, not into combat; the unit must end in coherency."],["Rennen (Run): Bewegung plus W6 (Rennenwurf), nicht in den Nahkampf. Danach weder schießen noch angreifen. Mit „Im Laufschritt“ (BP): +6\" statt Wurf.","Run: Move plus a D6 (run roll), not into combat. Afterwards the unit cannot shoot or charge. With “At the Double” (CP): +6\" instead of rolling."],["Rückzug (Retreat): Einheit im Nahkampf nimmt W3 tödlichen Schaden, darf bis zu ihrer Bewegung ziehen und durch gegnerische Kampfreichweiten gehen, darf aber nicht darin enden. Danach weder schießen noch angreifen.","Retreat: a unit in combat takes D3 mortal damage, may move up to its Move through enemy combat ranges but not end in one. Afterwards no shooting or charging."],["Neupositionierung (Redeploy, gegnerische Bewegungsphase, BP): Jedes Modell bis W6\" – nie in oder durch gegnerische Kampfreichweite.","Redeploy (enemy Movement phase, CP): each model up to D6\" – never through or into enemy combat range."],["Fliegen: Modelle ignorieren beim Bewegen andere Modelle, Gelände und gegnerische Kampfreichweiten (vertikale Strecke wird nicht gezählt), dürfen aber nicht im Nahkampf enden.","Fly: models ignore other models, terrain and enemy combat ranges when moving (vertical distance is ignored) but cannot end in combat."],["Gelände: bis 1\" Höhe einfach überschreiten, höhere Stücke erklettern (Höhe zählt zur Strecke), herabspringen beendet die Bewegung.","Terrain: features up to 1\" tall can be crossed freely; taller ones are climbed (height counts); jumping down ends the move."],["Verstärkung rufen: Nutzbar als Spearhead-Fähigkeit (siehe „Verstärkung“).","Call for Reinforcements: a Spearhead ability (see “Reinforcements”)."]],"sp":null},{"id":"fernkampf","ph":"f","t":["Fernkampfphase","Shooting phase"],"s":["Einheiten schießen mit Fernkampfwaffen auf sichtbare Ziele in Reichweite.","Units shoot with ranged weapons at visible targets in range."],"d":[["Schießen (Shoot): Einheit darf nicht gerannt sein oder sich zurückgezogen haben und nicht im Nahkampf stehen (außer Waffe hat Nahbeschuss).","Shoot: the unit must not have run or retreated, and must not be in combat (unless the weapon has Shoot in Combat)."],["Alle Ziele müssen sichtbar und in Waffenreichweite sein; Attacken können auf mehrere Ziele verteilt werden.","All targets must be visible and within weapon range; attacks can be split among targets."],["Deckungsfeuer (gegnerische Fernkampfphase): Eine Einheit außerhalb des Nahkampfs schießt auf die nächste sichtbare feindliche Einheit mit −1 auf Treffer.","Covering Fire (enemy Shooting phase): a unit not in combat shoots at the nearest visible enemy with −1 to hit."],["Geschützter Held: Helden in Reichweite einer nicht-heldischen Einheit sind schwerer als Fernkampfziel zu treffen (−1; Infanterie nicht auf mehr als 12\").","Guarded Hero: Heroes near a non-Hero friendly unit are harder to shoot (−1; Infantry cannot be targeted from over 12\")."]],"sp":null},{"id":"angriff","ph":"a","t":["Angriffsphase","Charge phase"],"s":["Einheiten laufen in den Nahkampf. Der Angriff gelingt nur bei genügend hohem Angriffswurf.","Units run into combat. A charge succeeds only with a high enough charge roll."],"d":[["Angriff (Charge): Einheit nicht im Nahkampf, nicht gerannt/zurückgezogen. Angriffswurf 2W6: die Einheit darf so weit ziehen und muss ½\" von einer sichtbaren feindlichen Einheit enden; dann hat sie angegriffen.","Charge: the unit is not in combat and did not run/retreat. Charge roll 2D6: it may move up to the result and must end within ½\" of a visible enemy unit; it has then charged."],["Während der Angriffsbewegung darf sie durch gegnerische Kampfreichweiten ziehen.","During the charge move it may pass through enemy combat ranges."],["Vorwärts zum Sieg (Reaktion, BP): Angriffswurf wiederholen. Gegenangriff (gegnerische Angriffsphase, BP): Eine Einheit darf eine Angriff-Fähigkeit nutzen.","Forward to Victory (reaction, CP): re-roll the charge. Counter-charge (enemy Charge phase, CP): a unit may use a Charge ability."],["Eine Einheit, die angegriffen hat, bekommt Vorteile (z. B. „Angriff +1 Schaden“, erst-Kämpfen-Regeln).","A unit that has charged gains benefits (e.g. “Charge +1 Damage”, fight-order rules)."]],"sp":null},{"id":"kampf","ph":"k","t":["Kampfphase","Combat phase"],"s":["Beide Spieler wählen abwechselnd Einheiten, die kämpfen – der aktive Spieler beginnt. Jede Einheit im Nahkampf muss kämpfen, wenn sie kann.","Players alternate picking units to fight – the active player starts. Every unit in combat must fight if able."],"d":[["Kämpfen (Fight): Einheit im Nahkampf oder mit Angriff in diesem Zug darf nachrücken, danach mit allen Nahkampfwaffen angreifen.","Fight: a unit in combat or one that charged this turn may pile in, then attack with all its melee weapons."],["Nachrücken (Pile In): Im Nahkampf wählst du eine Ziel-Einheit; jedes Modell darf bis zu 3\" ziehen, darf aber nicht weiter vom Ziel enden. Danach muss die Einheit mit allen bisherigen Gegnern im Nahkampf bleiben. Nach einem Angriff (nicht im Nahkampf) darf jedes Modell 3\" in beliebige Richtung ziehen.","Pile In: when in combat pick a target unit; each model moves up to 3\" but must not end farther from it, and the unit must stay in combat with all its previous enemies. A unit not in combat (e.g. after a charge) can move each model 3\" in any direction."],["Zuerst nutzen beide Spieler ihre sonstigen Kampfphasen-Fähigkeiten (aktiver Spieler zuerst); erst dann wird abwechselnd gekämpft. Hat ein Spieler keine kampfbereite Einheit mehr, macht der andere allein weiter. „Kämpft zuerst“ / „Kämpft zuletzt“ verschieben die Reihenfolge.","First both players use their other Combat phase abilities (active player first); only then do they alternate fighting. When one side has no eligible unit left the other continues alone. “Strike-first” / “Strike-last” shift the order."],["Alles-oder-nichts-Angriff / -Verteidigung (Reaktion, BP): +1 Treffer für angreifende Einheit bzw. +1 auf Schutzwürfe für das Ziel.","All-out Attack / All-out Defence (reaction, CP): +1 to hit for the attacker, or +1 to the target's save rolls."],["Champion: +1 Attacken für Waffen des Champions. Durchbrechen (Power Through, Zugende): Nach einem Angriff W3 tödlicher Schaden auf Feind mit geringerer Ausdauer, dann Bewegung.","Champion: +1 Attacks for the champion's weapons. Power Through (end of turn): after charging, D3 mortal damage to an enemy with lower Health, then move."]],"sp":null},{"id":"angriffsfolge","ph":"x","t":["Angriffsfolge","The attack sequence"],"s":["Jede Attacke wird in vier Schritten abgehandelt: Treffer, Verwundung, Schutz, Schaden.","Each attack is resolved in four steps: hit, wound, save, damage."],"d":[["1. Trefferwurf: W6 ≥ Treffen-Wert der Waffe. Unmodifizierte 1 verfehlt immer; unmodifizierte 6 ist ein kritischer Treffer.","1. Hit roll: D6 ≥ the weapon's Hit value. An unmodified 1 always fails; an unmodified 6 is a critical hit."],["2. Verwundungswurf: W6 ≥ Verwunden-Wert. Unmodifizierte 1 verfehlt immer.","2. Wound roll: D6 ≥ Wound value. An unmodified 1 always fails."],["3. Schutzwurf: Der Verteidiger würfelt W6 und zieht die Wucht (Rend) der Waffe ab; ≥ Schutzwert wehrt den Treffer ab. Unmodifizierte 1 verfehlt immer.","3. Save roll: the defender rolls a D6 and subtracts the weapon's Rend; ≥ Save stops the attack. An unmodified 1 always fails."],["4. Schaden bestimmen: So viele Schadenspunkte wie der Schaden-Wert der Waffe kommen in den Schadenspool der Zieleinheit.","4. Determine damage: damage points equal to the weapon's Damage go into the target unit's damage pool."],["Schnelles Würfeln: Gleiche Attacken (gleiche Werte, gleiche Fähigkeiten, gleiches Ziel) lassen sich gemeinsam würfeln.","Fast dice rolling: identical attacks (same values, abilities and target) can be rolled together."]],"sp":null},{"id":"modifikatoren","ph":"x","t":["Modifikatoren und Grenzen","Modifiers and caps"],"s":["Auf Treffer- und Verwundungswürfe wirken Modifikatoren höchstens mit +1 oder −1 insgesamt.","Modifiers to hit and wound rolls are capped at +1 / −1 in total."],"d":[["Alle Plus- und Minuswerte zusammenrechnen, dann auf +1 bzw. −1 begrenzen (Treffer, Verwundung).","Add up all pluses and minuses, then cap at +1 / −1 (hit and wound rolls)."],["Schutzwürfe: Bonus höchstens +1, aber die Wucht (Rend) und andere Abzüge sind nicht begrenzt.","Save rolls: bonus capped at +1, but Rend and other penalties are not capped."],["Reihenfolge bei Werten: 1. auf festen Wert setzen, 2. multiplizieren/teilen, 3. addieren/subtrahieren. Werte und Würfe sinken nie unter 1 (Wucht bis auf 0); Halbieren rundet ab. Kritische Treffer hängen nur vom unmodifizierten Wurf ab.","Order for values: 1. set to a fixed value, 2. multiply/divide, 3. add/subtract. Values and rolls never drop below 1 (Rend down to 0); halving rounds down. Critical hits depend only on the unmodified roll."]],"sp":null},{"id":"schaden","ph":"x","t":["Schadenspool und Schaden","Damage pool and damage"],"s":["Schaden wird zuerst gesammelt (Schadenspool), dann werden Rettungswürfe gemacht und erst danach Modelle entfernt.","Damage is collected first (damage pool), then ward rolls are made, and only then are models removed."],"d":[["Schadensfolge: 1. Rettungswürfe (Ward) für jeden Schadenspunkt im Pool, 2. verbleibende Schadenspunkte verteilen, gefallene Modelle entfernen.","Damage sequence: 1. ward rolls for each damage point in the pool, 2. allocate the remaining damage and remove slain models."],["Erreicht der zugeteilte Schaden die Ausdauer des Modells, ist es gefallen und der Zähler fällt auf 0. Eine Einheit mit zugeteiltem Schaden ist angeschlagen.","When allocated damage equals a model's Health it is slain and the counter resets to 0. A unit with allocated damage is damaged."],["Tödlicher Schaden (Mortal damage): kommt direkt in den Schadenspool, keine Treffer-, Verwundungs- oder Schutzwürfe.","Mortal damage goes straight into the damage pool – no hit, wound or save rolls."],["Gefallene Modelle wählt der Besitzer; der Zusammenhalt muss gewahrt bleiben. Fällt das letzte Modell, ist die Einheit zerstört.","The owner picks slain models; coherency must be kept. When the last model falls the unit is destroyed."],["Mehrere Rettungen: Es gilt nur die mit dem niedrigsten Wert.","Several ward saves: only the lowest value applies."]],"sp":null},{"id":"waffenf","ph":"x","t":["Waffenfähigkeiten","Weapon abilities"],"s":["Waffen können Zusatzregeln haben, die meist bei kritischen Treffern wirken.","Weapons can have extra rules, mostly triggered by critical hits."],"d":[["Krit. (2 Treffer): Ein kritischer Treffer zählt als 2 Treffer, je Treffer ein Verwundungswurf.","Crit (2 Hits): a critical hit counts as 2 hits; one wound roll for each."],["Krit. (verwundet): Ein kritischer Treffer verwundet automatisch; Schutzwurf wie gewohnt.","Crit (Auto-wound): a critical hit automatically wounds; make the save as normal."],["Krit. (tödlich): Ein kritischer Treffer verursacht tödlichen Schaden in Höhe des Schadens; die Angriffsfolge endet.","Crit (Mortal): a critical hit inflicts mortal damage equal to the weapon's Damage and the sequence ends."],["Anti-X (+1 Wucht): +1 Wucht gegen Ziele mit Schlüsselwort X; mehrere Anti-Fähigkeiten addieren sich.","Anti-X (+1 Rend): +1 Rend against targets with keyword X; several Anti abilities add up."],["Angriff (+1 Schaden): +1 Schaden, wenn die Einheit in diesem Zug angegriffen hat.","Charge (+1 Damage): +1 Damage if the unit charged this turn."],["Begleiter: Die Waffe wird nicht von Fähigkeiten beeinflusst, die Attacken oder die Angriffsfolge ändern.","Companion: the weapon is unaffected by abilities that change Attacks or the attack sequence."],["Nahbeschuss (Shoot in Combat): Die Waffe darf auch im Nahkampf zum Schießen genutzt werden.","Shoot in Combat: the weapon can be used to shoot even when the unit is in combat."]],"sp":null},{"id":"gelaende","ph":"x","t":["Gelände","Terrain"],"s":["Gelände bietet Deckung, blockiert Sicht oder macht Stellungen unsicher. In Spearhead gibt es 2 große und 2 kleine Stücke.","Terrain gives cover, blocks sight or makes footing unstable. Spearhead uses 2 large and 2 small features."],"d":[["Jeder Spieler baut 1 großes und 1 kleines Geländestück ganz in seinem Territorium auf (Abstände siehe „Vorbereitung“).","Each player places 1 large and 1 small terrain feature wholly in their territory (distances: see “Pre-battle”)."],["Großes Gelände: Deckung, Versperrt Sicht, Instabil. Kleines Gelände: Deckung, Instabil.","Large terrain: Cover, Obscuring, Unstable. Small terrain: Cover, Unstable."],["Deckung: −1 auf Trefferwürfe gegen Einheiten, die hinter oder ganz auf dem Gelände stehen – außer sie haben angegriffen oder können fliegen.","Cover: −1 to hit rolls against units behind or wholly on the feature – unless they charged or can Fly."],["Versperrt Sicht (Obscuring): Einheiten hinter oder ganz auf dem Stück können nicht beschossen werden (außer Fliegen).","Obscuring: units behind or wholly on it cannot be shot (except Fly)."],["Instabil (Unstable): Man darf darüber ziehen, aber dort, wo es höher als 1\" ist, nicht aufstellen oder eine Bewegung beenden.","Unstable: models can cross it but cannot be set up on or end a move where it is more than 1\" tall."],["Unpassierbar: Kein Modell darf sich darüber bewegen, dort aufgestellt werden oder darauf enden. Ort der Macht: Helden innerhalb 3\" dürfen „Ort der Macht aktivieren“.","Impassable: no model can cross, be set up on or end on it. Place of Power: Heroes within 3\" can use “Activate Place of Power”."]],"sp":null},{"id":"ziele","ph":"x","t":["Zielkontrolle","Objective control"],"s":["Ziele sind aufgedruckte Kreise auf der Karte. Wer dort mehr Kontrolle hat, kontrolliert das Ziel.","Objectives are printed circles on the map. Whoever has more control there controls the objective."],"d":[["Ein Modell, das ein Ziel ganz oder teilweise berührt, beansprucht (contests) es.","A model that is wholly or partly on an objective contests it."],["Zähle die Kontrolle-Werte aller beanspruchenden Modelle je Spieler; der höhere Wert gewinnt das Ziel. Bei Gleichstand ändert sich nichts.","Add up the Control values of all contesting models per player; the higher total takes the objective. On a tie nothing changes."],["Prüfung: zu Beginn der ersten Schlachtrunde und am Ende jedes Zugs. Ein Ziel bleibt in deiner Kontrolle, bis der Gegner es gewinnt.","Check: at the start of the first battle round and at the end of each turn. An objective stays yours until the opponent gains it."],["Größe der Ziele: Aqshy, Ghyran und City of Ash 6\" Durchmesser; Ossia alle vier Ziele 5\"; Dolorum Eckziele 5\", Zentrum 7\". Beansprucht wird, sobald die Base die gedruckte Fläche berührt.","Objective sizes: Aqshy, Ghyran and City of Ash 6\" across; Ossia all four objectives 5\"; Dolorum corner objectives 5\", centre 7\". A unit contests as soon as its base touches the printed area."],["Standartenträger: +1 auf den Kontrollwert der Einheit.","Standard Bearer: +1 to the unit's control score."]],"sp":["Auf jedem Reichs-Schlachtfeld sind die Ziele namentlich bekannt (z. B. Draconithion, Ignax, Behemat, Vulcatrix, Nagendra).","On each realm battlefield objectives have names (e.g. Draconithion, Ignax, Behemat, Vulcatrix, Nagendra)."]},{"id":"heilen","ph":"x","t":["Heilen und Zurückbringen","Healing and returning models"],"s":["Heilen entfernt zugeteilten Schaden, Zurückbringen stellt gefallene Modelle wieder auf.","Healing removes allocated damage; returning models puts slain models back."],"d":[["Heal (X): Entferne X zugeteilte Schadenspunkte von einer Einheit. Es bringt keine gefallenen Modelle zurück.","Heal (X): remove X allocated damage points from a unit. It does not bring slain models back."],["Zurückbringen/Hinzufügen: Modelle werden einzeln im Zusammenhalt mit Modellen der Einheit aufgestellt, die nicht in diesem Zug zurückkamen (ab 7 Modellen: zu 2 anderen). Im Nahkampf mit einem Feind nur, wenn die Einheit schon mit ihm im Nahkampf ist.","Returning/adding: models are set up one at a time in coherency with models that did not return this turn (7+ models: with 2 others). They may be in combat with an enemy only if the unit already is."],["Marker (Tokens) sind keine Modelle: ignoriere sie bei Sicht und Zusammenhalt; sie zeigen Effekte an.","Tokens are not models: ignore them for visibility and coherency; they show ongoing effects."]],"sp":null},{"id":"verstaerkung","ph":"x","t":["Verstärkung","Reinforcements"],"s":["Zerstörte Einheiten mit dem Schlüsselwort Verstärkung können einmal als Ersatz zurückkehren.","Destroyed units with the Reinforcements keyword can return once as replacements."],"d":[["Verstärkung rufen (1× pro Zug, deine Bewegungsphase): Wähle eine zerstörte Einheit mit Verstärkung. Stelle eine identische Ersatzeinheit ganz in deinem Territorium, ganz innerhalb 6\" der Schlachtfeldkante und nicht im Nahkampf auf.","Call for Reinforcements (once per turn, your Movement phase): pick a destroyed Reinforcements unit. Set up an identical replacement wholly in your territory, wholly within 6\" of the battlefield edge and not in combat."],["Jede Verstärkungseinheit darf nur einmal ersetzt werden; Ersatzeinheiten können nicht ihrerseits ersetzt werden.","Each Reinforcements unit can be replaced only once; replacements cannot be replaced."],["Reserve: Einheiten in Reserve werden nicht aufgestellt, sondern später durch Fähigkeiten betreten (z. B. Tunnel der Skaven).","Reserve: units in reserve are not deployed but enter later via abilities (e.g. Skaven tunnels)."]],"sp":null},{"id":"sp","ph":"x","t":["Siegespunkte","Victory points"],"s":["Siegespunkte (SP) gibt es für gehaltene Ziele und erfüllte Taktikkarten. Wer nach 4 Runden die meisten hat, gewinnt.","Victory points (VP) come from held objectives and completed tactic cards. Whoever has the most after 4 rounds wins."],"d":[["Am Ende deines Zugs: 1 SP, wenn du mindestens 1 Ziel kontrollierst; +1 SP bei mindestens 2 Zielen; +1 SP, wenn du mehr Ziele kontrollierst als der Gegner.","At the end of your turn: 1 VP if you control at least 1 objective; +1 VP for 2 or more; +1 VP if you control more objectives than the opponent."],["Dazu +SP für erfüllte Taktikkarten (Vorhaben).","Plus VP for completed battle tactics."],["Wer weniger SP hat, ist in der Runde Außenseiter (mehr Befehlspunkte, Chance auf Initiative).","The player with fewer VP is the underdog for the round (more command points, a chance to seize the initiative)."]],"sp":null},{"id":"taktik","ph":"x","t":["Taktikkarten und Wendungen","Battle tactic and twist cards"],"s":["Jede Karte hat ein Vorhaben (Siegespunkte) und einen Befehl (sofortiger Vorteil) – du kannst nur eines nutzen.","Each card has a battle tactic (victory points) and a command (immediate benefit) – you can use only one."],"d":[["In Runde 1 ziehst du 3 Karten; danach darfst du abwerfen und wieder auf 3 auffüllen.","In round 1 you draw 3 cards; afterwards you may discard and refill to 3."],["Vorhaben werden am Ende deines Zugs gewertet, wenn die Bedingung erfüllt ist; der Befehl der Karte wird zum angegebenen Zeitpunkt genutzt und die Karte dann abgelegt.","Tactics are scored at the end of your turn if the condition is met; the card's command is played at the stated time and the card discarded."],["Wendungskarten (Twist) gelten für eine Schlachtrunde und hängen von der gewählten Reichsseite ab.","Twist cards apply to one battle round and depend on the chosen realm side."],["Pro Einheit und Phase nur 1 Befehl, auch von Karten.","Only 1 command per unit and phase – this includes card commands."]],"sp":null},{"id":"armee","ph":"x","t":["Spearhead-Armeen","Spearhead armies"],"s":["Jede Armee hat feste Einheiten, Kampfeigenschaften, eine Auswahl von 2 Regimentsfähigkeiten und 4 Verbesserungen.","Each army has fixed units, battle traits, a choice of 2 regiment abilities and 4 enhancements."],"d":[["Kampfeigenschaften (Battle Traits): mächtige, thematische Fähigkeiten für die ganze Armee.","Battle traits: powerful thematic abilities for the whole army."],["Regimentsfähigkeit: Du wählst 1 von 2; sie verleiht der Armee eine besondere Stärke.","Regiment ability: you pick 1 of 2; it gives the army a special strength."],["Verbesserung (Enhancement): 1 von 4 für den General; meist stärkt sie diesen oder die Nachbarn.","Enhancement: 1 of 4 for the general; usually strengthens the general or nearby units."],["Der General ist in jeder Armee festgelegt; fällt er, hat dies je nach Armee Folgen.","The general is fixed for each army; losing them has consequences depending on the army."]],"sp":null},{"id":"ende","ph":"x","t":["Ende der Schlachtrunde und der Schlacht","End of the battle round and battle"],"s":["Nach beiden Zügen gibt es Fähigkeiten für das Rundenende; nach der letzten Runde zählen die Siegespunkte.","After both turns end-of-round abilities are used; after the final round victory points decide."],"d":[["Am Ende der Schlachtrunde nutzt der aktive Spieler Fähigkeiten „Ende der Schlachtrunde“, dann der Gegner.","At the end of the battle round the active player uses End of Battle Round abilities, then the opponent."],["Befehlspunkte werden auf 0 gesetzt.","Command points reset to 0."],["Nach Runde 4 endet die Schlacht: die meisten Siegespunkte gewinnen.","After round 4 the battle ends: the most victory points wins."]],"sp":null}],"G":[{"id":"aktiv","k":[["aktiver Spieler","aktive Spieler","aktiven Spieler"],["active player"]],"t":["aktiver Spieler","active player"],"d":["Der Spieler, der gerade seinen Zug hat.","The player whose turn it currently is."],"s":"ablauf"},{"id":"aussen","k":[["Außenseiter"],["underdog"]],"t":["Außenseiter","underdog"],"d":["Wer weniger Siegespunkte hat; erhält 1 Befehlspunkt extra und kann die Initiative ergreifen.","The player with fewer victory points; gets 1 extra command point and may seize the initiative."],"s":"rundenbeginn"},{"id":"bp","k":[["Befehlspunkt","Befehlspunkte","Befehlspunkten","BP"],["command point","command points","CP"]],"t":["Befehlspunkt","command point"],"d":["Währung für Befehle: 4 pro Schlachtrunde (Außenseiter 5), verfallen am Rundenende.","Currency for commands: 4 per battle round (5 for the underdog), lost at the end of the round."],"s":"befehle"},{"id":"befehl","k":[["Befehl","Befehle"],["command","commands"]],"t":["Befehl","command"],"d":["Fähigkeit, die Befehlspunkte kostet; pro Einheit und Phase nur einer.","An ability that costs command points; only one per unit and phase."],"s":"befehle"},{"id":"prio","k":[["Prioritätswurf"],["priority roll"]],"t":["Prioritätswurf","priority roll"],"d":["Wurf zu Rundenbeginn (ab Runde 2): Der Gewinner entscheidet, wer den ersten Zug hat.","Roll at the start of a round (from round 2): the winner decides who takes the first turn."],"s":"rundenbeginn"},{"id":"kampfr","k":[["Kampfreichweite"],["combat range"]],"t":["Kampfreichweite","combat range"],"d":["3\" waagerecht um jedes Modell (senkrecht unbegrenzt).","3\" horizontally around every model (unlimited vertically)."],"s":"messen"},{"id":"nahkampf","k":[["Nahkampf","im Nahkampf"],["combat","in combat"]],"t":["Nahkampf","combat"],"d":["Zustand: Einheiten gegnerischer Armeen liegen in der Kampfreichweite des anderen und sehen sich.","Status: opposing units within each other's combat range that can see each other."],"s":"messen"},{"id":"zusammenhalt","k":[["Zusammenhalt"],["coherency"]],"t":["Zusammenhalt","coherency"],"d":["Modelle einer Einheit stehen höchstens ½\" auseinander und bilden eine Gruppe (ab 7 Modellen: 2 Nachbarn).","Models of a unit are within ½\" of each other and form one group (7+ models: 2 neighbours)."],"s":"messen"},{"id":"sichtbar","k":[["sichtbar","Sicht"],["visible","visibility"]],"t":["sichtbar","visible"],"d":["Eine Sichtlinie von einem Modell zu irgendeinem Teil des anderen ist möglich.","A line of sight from one model to any part of the other is possible."],"s":"sicht"},{"id":"schluessel","k":[["Schlüsselwort","Schlüsselwörter"],["keyword","keywords"]],"t":["Schlüsselwort","keyword"],"d":["Eigenschaft wie Held, Infanterie, Fliegen, die darüber entscheidet, welche Regeln gelten.","A trait such as Hero, Infantry or Fly that decides which rules apply."],"s":"schriftrolle"},{"id":"truppenschrift","k":[["Truppenschriftrolle"],["warscroll"]],"t":["Truppenschriftrolle","warscroll"],"d":["Das Datenblatt einer Einheit mit Werten, Waffen und Fähigkeiten.","The datasheet of a unit with characteristics, weapons and abilities."],"s":"schriftrolle"},{"id":"bewegung","k":[["Bewegung"],["Move"]],"t":["Bewegung","Move"],"d":["Wert: maximale Bewegungsstrecke eines Modells in Zoll.","Characteristic: maximum move distance of a model in inches."],"s":"schriftrolle"},{"id":"ausdauer","k":[["Ausdauer"],["Health"]],"t":["Ausdauer","Health"],"d":["Wert: So viele Schadenspunkte tötet 1 Modell.","Characteristic: damage points needed to slay 1 model."],"s":"schriftrolle"},{"id":"schutz","k":[["Schutzwurf","Schutzwert","Schutzwürfe","Schutzwürfen","Schutz"],["save","save roll","save rolls"]],"t":["Schutzwurf","save"],"d":["Wurf, um einen verwundenden Treffer abzuwehren; die Wucht wird abgezogen.","A roll to stop a wounding hit; Rend is subtracted."],"s":"angriffsfolge"},{"id":"kontrolle","k":[["Kontrolle","Kontrollwert"],["Control","control score"]],"t":["Kontrolle","Control"],"d":["Wert: Beitrag zur Zielkontrolle (je Modell).","Characteristic: contribution to objective control (per model)."],"s":"ziele"},{"id":"rettung","k":[["Rettung","Rettungswurf","Rettungswürfe","Rettungswürfen","Rettungswerte"],["Ward","ward save","ward roll","ward rolls"]],"t":["Rettung","Ward"],"d":["Zusatzwurf gegen jeden Schadenspunkt vor der Zuteilung; mehrere Rettungen: nur die beste zählt.","Extra roll against each damage point before allocation; with several wards only the best applies."],"s":"schaden"},{"id":"attacken","k":[["Attacken"],["Attacks"]],"t":["Attacken","Attacks"],"d":["Waffenwert: Anzahl der Würfe pro Modell.","Weapon characteristic: number of attacks per model."],"s":"angriffsfolge"},{"id":"treffen","k":[["Treffen","Trefferwurf","Trefferwürfe","Trefferwürfen"],["Hit","hit roll","hit rolls"]],"t":["Treffen","Hit"],"d":["Wurf, ob eine Attacke trifft; 6 unmodifiziert ist ein kritischer Treffer.","Roll to see if an attack hits; an unmodified 6 is a critical hit."],"s":"angriffsfolge"},{"id":"verwunden","k":[["Verwunden","Verwundungswurf","Verwundungswürfe","Verwundungswürfen"],["Wound","wound roll","wound rolls"]],"t":["Verwunden","Wound"],"d":["Wurf, ob ein Treffer verwundet.","Roll to see if a hit wounds."],"s":"angriffsfolge"},{"id":"wucht","k":[["Wucht"],["Rend"]],"t":["Wucht","Rend"],"d":["Wird vom Schutzwurf abgezogen.","Subtracted from the save roll."],"s":"angriffsfolge"},{"id":"schaden","k":[["Schaden","Schadenspunkt","Schadenspunkte","Schadenspunkten"],["Damage","damage point","damage points"]],"t":["Schaden","Damage"],"d":["Anzahl der Schadenspunkte, die eine erfolgreiche Attacke zufügt.","Number of damage points a successful attack inflicts."],"s":"schaden"},{"id":"pool","k":[["Schadenspool"],["damage pool"]],"t":["Schadenspool","damage pool"],"d":["Zwischenspeicher für Schaden, bevor Rettungswürfe gemacht und Modelle entfernt werden.","Temporary store for damage before ward rolls and removal of models."],"s":"schaden"},{"id":"tod","k":[["tödlicher Schaden","tödlichen Schaden","tödlichem Schaden"],["mortal damage"]],"t":["tödlicher Schaden","mortal damage"],"d":["Schaden ohne Treffer-, Verwundungs- oder Schutzwurf.","Damage without hit, wound or save rolls."],"s":"schaden"},{"id":"krit","k":[["kritischer Treffer","kritische Treffer","kritischen Treffer","Krit."],["critical hit","critical hits","Crit"]],"t":["kritischer Treffer","critical hit"],"d":["Ein unmodifizierter Trefferwurf von 6; löst oft Waffenfähigkeiten aus.","An unmodified hit roll of 6; often triggers weapon abilities."],"s":"waffenf"},{"id":"krit2","k":[["Krit. (2 Treffer)"],["Crit (2 Hits)"]],"t":["Krit. (2 Treffer)","Crit (2 Hits)"],"d":["Kritischer Treffer zählt als 2 Treffer.","A critical hit counts as 2 hits."],"s":"waffenf"},{"id":"kritv","k":[["Krit. (verwundet)"],["Crit (Auto-wound)"]],"t":["Krit. (verwundet)","Crit (Auto-wound)"],"d":["Kritischer Treffer verwundet automatisch.","A critical hit automatically wounds."],"s":"waffenf"},{"id":"kritt","k":[["Krit. (tödlich)"],["Crit (Mortal)"]],"t":["Krit. (tödlich)","Crit (Mortal)"],"d":["Kritischer Treffer verursacht tödlichen Schaden = Schaden der Waffe.","A critical hit inflicts mortal damage equal to the weapon's Damage."],"s":"waffenf"},{"id":"anti","k":[["Anti-"],["Anti-"]],"t":["Anti-","Anti-"],"d":["Waffe hat +1 Wucht gegen Ziele mit dem genannten Schlüsselwort.","The weapon has +1 Rend against targets with the stated keyword."],"s":"waffenf"},{"id":"angrbonus","k":[["Angriff (+1 Schaden)"],["Charge (+1 Damage)"]],"t":["Angriff (+1 Schaden)","Charge (+1 Damage)"],"d":["+1 Schaden, wenn die Einheit in diesem Zug angegriffen hat.","+1 Damage if the unit charged this turn."],"s":"waffenf"},{"id":"begleiter","k":[["Begleiter"],["Companion"]],"t":["Begleiter","Companion"],"d":["Die Waffe ist von Fähigkeiten ausgenommen, die Attacken oder die Angriffsfolge ändern.","The weapon is immune to abilities that alter Atta const reEsc=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');

function mkLinker(ai){

 G.forEach(g=>g.k[li()].forEach(lab=>{if(lab.length>=2&&!lab.endsWith('-'))items.push({lab,t:'g',id:g.id})}));

 const map=new Map();items.forEach(it=>{const k=it.lab.toLowerCase();if(!map.has(k))map.set(k,it)});
 const labs=[...map.values()].map(i=>i.lab).sort((a,b)=>b.length-a.length);
 const re=new RegExp('(^|[^\\p{L}\\p{N}])('+labs.map(reEsc).join('|')+')(?![\\p{L}\\p{N}])','giu');

function linkify(text,ai,self){
 const {re,map}=mkLinker(ai);const seen=new Set();let out='',last=0,m;
 re.lastIndex=0;
 while((m=re.exec(text))){
  const pre=m[1],lab=m[2],at=m.index+pre.length;
  const it=map.get(lab.toLowerCase());if(!it){continue}
  if(lab.length<=3&&lab!==it.lab){continue}
  if(it.t=='a'&&it.id===self)continue;
  const sk=it.t+it.id;if(seen.has(sk))continue;seen.add(sk);
  out+=esc(text.slice(last,at));
  out+=it.t=='g'?`<a class="lk" data-g="${it.id}" role="button" tabindex="0">${esc(lab)}</a>`:`<a class="lk ab" data-a="${ai}|${it.id}" role="button" tabindex="0">${esc(lab)}</a>`;

 }

const rend=v=>!v?'–':'−'+v;
const sp=(txt)=>{const m=txt.match(/^([^:]{2,70}):\s*(.*)$/s);return m?[m[1],m[2]]:[null,txt]};
const flagsOf=f=>String(f||'').split('').filter(c=>FL[c]).map(c=>FL[c][li()]);
const fmtBase=b=>b?String(b).replace('x',' × ')+' mm':'';
function abil(ai,key,ab,pre){
 const [n,t]=[P(ab.n),P(ab.t)];const [chip,rest]=sp(t);
 const k=`${ai}|${key}`;
 return `<details class="ab" data-k="${key}" id="k-${key}" ${open.has(route+'|'+key)?'open':''}><summary><span class="nm">${esc(n)}</span>${chip?`<span class="chip">${esc(chip)}</span>`:''}</summary><div class="body"><p>${linkify(rest,ai,key)}</p></div></details>`;
}
let armyTab='a';
const tabOf=k=>/^u/.test(k)?'m':'a';
function armyPage(ai){
 const a=A[ai];
 let h=`<div class="crumb"><a href="#/sp">${T('t1')}</a> · ${esc(P(a.f))}</div>`;
 h+=`<div class="tabs"><button data-tab="a" class="${armyTab=='a'?'on':''}">${T('tabA')}</button><button data-tab="m" class="${armyTab=='m'?'on':''}">${T('tabM')} <small>${a.units.length}</small></button></div>`;
 const sec=(k,title,hint)=>`<div class="sec" data-k="s-${k}"><h2>${title}</h2>${hint?`<small>${hint}</small>`:''}</div>`;
 if(armyTab=='a'){
  if(a.traits.length){h+=sec('t',T('traits'));a.traits.forEach((x,j)=>h+=abil(ai,'t'+j,x))}
  h+=sec('r',T('reg'),T('regh'));a.reg.forEach((x,j)=>h+=abil(ai,'r'+j,x));
  h+=sec('e',T('enh'),T('enhh'));a.enh.forEach((x,j)=>h+=abil(ai,'e'+j,x));
  return h+`<footer>${T('ver')}</footer>`;
 }
 a.units.forEach((u,k)=>{
  const wl=(w,ranged)=>`<div class="wl"><span class="wn">${esc(P(w.n))}</span><span class="wv">${ranged?w.r+'" · ':''}${esc(P(w.a))}× · ${plus(w.h)}/${plus(w.w)} · ${rend(w.rd)} · ${esc(P(w.d))}</span></div>`;
  h+=`<details class="un" data-k="u${k}" id="k-u${k}" ${open.has(route+'|u'+k)?'open':''}><summary><h3>${esc(P(u.n))}${u.g?`<span class="gen">${T('gen')}</span>`:''}</h3><div class="mini"><span>${T('mv')} <b>${u.mv}"</b></span><span>${T('hp')} <b>${u.hp}</b></span><span>${T('sv')} <b>${plus(u.sv)}</b></span><span>${T('cv')} <b>${u.cv}</b></span>${u.wd?`<span>${T('wd')} <b>${u.wd}+</b></span>`:''}<span>${T('mo')} <b>${u.m}</b></span></div>${u.rw.map(w=>wl(w,true)).join('')}${u.mw.map(w=>wl(w,false)).join('')}${u.ab.length?`<div class="abn">${u.ab.map(x=>esc(P(x.n))).join(' · ')}</div>`:''}</summary><div class="ub">`;
  h+=`<div class="kws">${u.kw.map(w=>`<span class="chip">${esc(P(w))}</span>`).join('')}${u.b?`<span class="chip">${fmtBase(u.b)}</span>`:''}</div>`;
  if(u.note)h+=`<p class="note">${linkify(P(u.note),ai,null)}</p>`;
  const wt=(ws,ranged)=>{
   let t=`<div class="tw"><table class="w"><tr><th></th>${ranged?`<th>${T('rng')}</th>`:''}<th>${T('att')}</th><th>${T('hit')}</th><th>${T('wnd')}</th><th>${T('rend')}</th><th>${T('dmg')}</th></tr>`;
   ws.forEach(w=>{const fl=flagsOf(w.f);t+=`<tr><td>${esc(P(w.n))}${fl.length?`<span class="fl">${fl.map(esc).join(' · ')}</span>`:''}</td>${ranged?`<td>${w.r}"</td>`:''}<td>${esc(P(w.a))}</td><td>${plus(w.h)}</td><td>${plus(w.w)}</td><td>${rend(w.rd)}</td><td>${esc(P(w.d))}</td></tr>`});
   return t+'</table></div>'};
  if(u.rw.length)h+=`<div class="sub">${T('rw')}</div>`+wt(u.rw,true);
  if(u.mw.length)h+=`<div class="sub">${T('mw')}</div>`+wt(u.mw,false);
  if(u.ab.length){h+=`<div class="sub">${T('ab')}</div>`;u.ab.forEach((x,j)=>h+=abil(ai,'u'+k+'a'+j,x))}
  h+='</div></details>';
 });
 return h;
}
const ALLI={'Städte Sigmars':0,'Sturmgeschmiedete Ewige':0,'Khazalid':0,'Seraphon':0,'Himmelsherrscher der Kharadron':0,'Lichtfürsten der Lumineth':0,'Töchter des Khaine':0,
 'Klingen des Khorne':1,'Jünger des Tzeentch':1,'Maggotkin des Nurgle':1,'Hedoniten des Slaanesh':1,'Skaven':1,'Helschmiede des Hashut':1,
 'Nachtspuk':2,'Seelenbrand-Grabesfürsten':2,
 'Orruk-Kriegsclans':3,'Ogor-Schlundstämme':3,'Mondwahn-Gits':3,'Behemats Söhne':3};
const ALN=[['Ordnung','Order'],['Chaos','Chaos'],['Tod','Death'],['Zerstörung','Destruction']];
function spOverview(){
 let h=`<div class="crumb"><a href="#/">${T('home')}</a></div><h1 class="ser" style="font-size:26px;margin:4px 0">${T('t1')}</h1><p class="hint">${T('d1')}</p>`;
 for(let g=0;g<4;g++){
  const list=A.filter(a=>(ALLI[a.f[0]]??0)==g);if(!list.length)continue;
  h+=`<div class="grp" data-k="al${g}">${ALN[g][li()]} · ${list.length}</div>`;
  const by={};list.forEach(a=>{(by[a.f[li()]]=by[a.f[li()]]||[]).push(a)});
  Object.keys(by).sort((x,y)=>x.localeCompare(y,L)).forEach(f=>{
   h+=`<div class="fac" style="margin:10px 0 6px" data-k="f-${esc(f)}">${esc(f)}</div><div class="grid">`;
   by[f].forEach(a=>h+=`<a class="card army" href="#/sp/${a.i}" data-k="a${a.i}"><b>${esc(P(a.n))}</b><span>${a.units.length} ${T('units')}</span></a>`);
   h+='</div>';
  });
 }
 return h;
}
const GRP=[['ablauf','messen','sicht','schriftrolle','faehigkeiten','befehle'],['vorbereitung','aufstellung','rundenbeginn','zugablauf'],['heldenphase','bewegung','fernkampf','angriff','kampf'],['angriffsfolge','modifikatoren','schaden','waffenf'],['gelaende','ziele','heilen','verstaerkung','sp','taktik','armee','ende']];
function rulesPage(){
 let h=`<div class="crumb"><a href="#/">${T('home')}</a></div><h1 class="ser" style="font-size:26px;margin:4px 0">${T('t2')}</h1><p class="hint">${T('d2')}</p>`;
 const chain=[['h','heldenphase'],['b','bewegung'],['f','fernkampf'],['a','angriff'],['k','kampf']];
 h+=`<div class="card cheat"><b class="ser">${T('cheat')}</b><div class="fl2">${chain.map(([c,id])=>`<a href="#" data-j="${id}" style="background:var(--c-${c})">${esc(P(rById[id].t))}</a>`).join('')}</div><div class="nums">${UI.nums[li()].map(n=>`<div><b>${esc(n[0])}</b>${esc(n[1])}</div>`).join('')}</div></div>`;
 h+=`<div class="tools"><button class="btn" data-act="all">${T('openall')}</button><button class="btn" data-act="none">${T('closeall')}</button></div>`;
 let n=0;
 GRP.forEach((g,gi)=>{
  h+=`<div class="grp" data-k="g${gi}">${UI.grp[li()][gi]}</div>`;
  g.forEach(id=>{const r=rById[id];n++;
   h+=`<details class="rl" data-ph="${r.ph}" data-k="${r.id}" id="k-${r.id}" ${open.has(route+'|'+r.id)?'open':''}><summary><h3><span class="num">${n}</span>${esc(P(r.t))}</h3><div class="s">${esc(P(r.s))}</div></summary><ul>${r.d.map(d=>`<li>${linkify(P(d),-1)}</li>`).join('')}</ul>${r.sp?`<div class="spn"><b>${T('sp')}:</b> ${linkify(P(r.sp),-1)}</div>`:''}</details>`;
  });
 });
 return h+`<footer>${T('ver')}</footer>`;
}
function glossPage(){
 let h=`<div class="crumb"><a href="#/">${T('home')}</a></div><h1 class="ser" style="font-size:26px;margin:4px 0">${T('t3')}</h1><p class="hint">${T('d3')}</p>`;
 h+=`<input class="inp" id="gf" type="search" placeholder="${T('filter')}" autocomplete="off">`;
 const list=[...G].sort((a,b)=>P(a.t).localeCompare(P(b.t),L));
 const letters=[...new Set(list.map(g=>norm(P(g.t))[0].toUpperCase()))];
 h+=`<div class="alpha">${letters.map(l=>`<a href="#" data-letter="${l}">${l}</a>`).join('')}</div><div id="gl">`;
 list.forEach(g=>{
  const other=g.t[1-li()];
  h+=`<div class="card gl" data-k="${g.id}" id="k-${g.id}" data-l="${norm(P(g.t))[0].toUpperCase()}" data-h="${esc(norm(g.k[0].join(' ')+' '+g.k[1].join(' ')+' '+g.d.join(' ')))}"><h3>${esc(P(g.t))}<span class="alt">${esc(other)}</span></h3><p>${linkify(P(g.d),-1)}</p><a class="rr" href="#/rules/${g.s}">${T('toRule')} → ${esc(P(rById[g.s].t))}</a></div>`;
 });
 return h+'</div>';
}
/* ---------- Suche ---------- */
let INDEX=null;
function buildIndex(){
 INDEX=[];
 R.forEach(r=>INDEX.push({c:'R',href:'#/rules/'+r.id,t:r.t,x:[r.s,...r.d.map(d=>d),...(r.sp?[r.sp]:[])]}));
 G.forEach(g=>INDEX.push({c:'G',href:'#/gloss/'+g.id,t:g.t,x:[g.d],alt:g.k}));
 A.forEach(a=>{
  INDEX.push({c:'S',href:'#/sp/'+a.i,t:a.n,x:[a.f]});
  const ab=(arr,pre)=>arr.forEach((x,j)=>INDEX.push({c:'A',href:`#/sp/${a.i}/${pre}${j}`,t:x.n,x:[x.t],ctx:a.n}));
  ab(a.traits,'t');ab(a.reg,'r');ab(a.enh,'e');
  a.units.forEach((u,k)=>{
   INDEX.push({c:'U',href:`#/sp/${a.i}/u${k}`,t:u.n,x:[u.kw.map(w=>w)].flat().map(w=>w),ctx:a.n});
   [...u.rw,...u.mw].forEach(w=>INDEX.push({c:'W',href:`#/sp/${a.i}/u${k}`,t:w.n,x:[],ctx:[u.n[0]+' · '+a.n[0],u.n[1]+' · '+a.n[1]]}));
   u.ab.forEach((x,j)=>INDEX.push({c:'A',href:`#/sp/${a.i}/u${k}a${j}`,t:x.n,x:[x.t],ctx:[u.n[0]+' · '+a.n[0],u.n[1]+' · '+a.n[1]]}));
  });
 });
 INDEX.forEach(it=>{const parts=[it.t[0],it.t[1],...it.x.map(v=>Array.isArray(v)?v.join(' '):v)];if(it.alt)parts.push(...it.alt.flat());it.h=norm(parts.join(' '))});
}
const CAT={R:['cRules'],G:['cGloss'],S:['cSp'],U:['cUnit'],A:['cAb'],W:['cWpn']};
function hlRe(q){const ws=q.trim().split(/\s+/).filter(w=>w.length>0).map(reEsc);return ws.length?new RegExp('('+ws.join('|')+')','gi'):null}
function snippet(txt,q){
 const re=hlRe(q);let s=txt;
 if(re){const m=re.exec(txt);re.lastIndex=0;if(m){const st=Math.max(0,m.index-40);s=(st>0?'… ':'')+txt.slice(st,m.index+110)+(m.index+110<txt.length?' …':'')}else s=txt.slice(0,140)}
 else s=txt.slice(0,140);
 let o=esc(s);if(re)o=o.replace(new RegExp('('+q.trim().split(/\s+/).map(w=>reEsc(esc(w))).join('|')+')','gi'),'<mark>$1</mark>');
 return o;
}
function runSearch(q){
 if(!INDEX)buildIndex();
 const ws=norm(q).split(/\s+/).filter(Boolean);if(!ws.length)return '';
 const hits=[];
 INDEX.forEach(it=>{if(ws.every(w=>it.h.includes(w))){const tn=norm(it.t.join(' '));hits.push({it,sc:(ws.every(w=>tn.includes(w))?0:1)+(tn.startsWith(ws[0])?0:.5)})}});
 hits.sort((a,b)=>a.sc-b.sc);
 if(!hits.length)return `<p class="hint">${T('noRes')}</p>`;
 const order=['R','G','S','U','A','W'];let h='';
 order.forEach(c=>{
  const arr=hits.filter(x=>x.it.c==c);if(!arr.length)return;
  h+=`<div class="cnt">${T(CAT[c][0])} · ${arr.length}</div>`;
  arr.slice(0,40).forEach(({it})=>{
   const body=it.x.map(v=>Array.isArray(v)?P(v):v).filter(Boolean).join(' · ');
   const ctx=it.ctx?(Array.isArray(it.ctx)?P(it.ctx):P(it.ctx)):'';
   h+=`<a class="card res" href="${it.href}"><b>${snippet(P(it.t),q)}</b>${ctx?`<small>${esc(ctx)}</small>`:''}${body?`<small>${snippet(body,q)}</small>`:''}</a>`;
  });
 });
 return h;
}
function searchPage(){
 return `<div class="crumb"><a href="#/">${T('home')}</a></div><h1 class="ser" style="font-size:26px;margin:4px 0">${T('t4')}</h1><p class="hint">${T('d4')}</p><input class="inp" id="q" type="search" placeholder="${T('search')}" value="${esc(searchQ)}" autocomplete="off" enterkeyhint="search"><div id="sr">${runSearch(searchQ)}</div>`;
}
function homePage(){
 return `<div class="hero"><h1 class="ser">${T('title')}</h1><p class="hint">${T('intro')}</p></div>
 <div class="tiles">
 <a class="tile" href="#/sp"><span class="no">1</span><div><b>${T('t1')}</b><span>${T('d1')}</span></div></a>
 <a class="tile" href="#/rules"><span class="no">2</span><div><b>${T('t2')}</b><span>${T('d2')}</span></div></a>
 <a class="tile" href="#/gloss"><span class="no">3</span><div><b>${T('t3')}</b><span>${T('d3')}</span></div></a>
 <a class="tile" href="#/search"><span class="no">4</span><div><b>${T('t4')}</b><span>${T('d4')}</span></div></a>
 </div><p class="hint" style="margin-top:16px">${T('cmdhint')}</p><footer>${EMB?'':`<a href="./">${T('game')} →</a><br>`}${T('ver')}</footer>`;
}

/* ---------- Router ---------- */
function parse(){const h=(location.hash||'#/').slice(1);const p=h.split('/').filter(Boolean).map(decodeURIComponent);return p}
function title(p){
 if(!p.length)return T('title');
 if(p[0]=='sp'){return p[1]!=null&&A[p[1]]?P(A[p[1]].n):T('t1')}
 return {rules:T('t2'),gloss:T('t3'),search:T('t4')}[p[0]]||T('title');
}
function topbar(p){
 top.innerHTML=`<button class="ib" id="bk" aria-label="${T('back')}">←</button><button class="ib" id="hm" aria-label="${T('home')}">⌂</button><div class="ttl ser">${esc(title(p))}</div><div class="lang"><button data-l="de" class="${L=='de'?'on':''}">DE</button><button data-l="en" class="${L=='en'?'on':''}">EN</button></div>${EMB?`<button class="ib" id="cl" aria-label="${T('close')}">✕</button>`:''}`;
 document.title=title(p)+' – '+T('title');document.documentElement.lang=L;
}
function captureAnchor(){
 const els=[...main.querySelectorAll('[data-k]')];const y=top.getBoundingClientRect().bottom+4;
 let best=null;
 for(const e of els){const r=e.getBoundingClientRect();if(r.top<=y&&r.bottom>y)best=e;}
 if(!best){for(const e of els){if(e.getBoundingClientRect().top>y){best=e;break}}}
 if(!best)return null;
 return {k:best.dataset.k,off:best.getBoundingClientRect().top,sy:window.scrollY};
}
function restoreAnchor(a){
 if(!a)return;const e=main.querySelector(`[data-k="${CSS.escape(a.k)}"]`);
 if(e){window.scrollBy(0,e.getBoundingClientRect().top-a.off)}else window.scrollTo(0,a.sy);
}
let lastRouteKey='',lastArmy=null;
function render(opts={}){
 const p=parse();const base='/'+p.slice(0,2).join('/');
 const keepScroll=opts.keep;const anc=keepScroll?captureAnchor():null;
 route=p[0]=='sp'&&p[1]!=null?'sp/'+p[1]:(p[0]||'home');
 let html='';
 const deep=p[0]=='sp'&&p[1]!=null?p[2]:(p[0]=='rules'||p[0]=='gloss'?p[1]:null);
 if(!p.length)html=homePage();
 else if(p[0]=='sp'){if(A[p[1]]){if(p[2])armyTab=tabOf(p[2]);else if(!opts.keep&&lastArmy!=p[1])armyTab='a';lastArmy=p[1];html=armyPage(+p[1])}else html=spOverview()}
 else if(p[0]=='rules')html=rulesPage();
 else if(p[0]=='gloss')html=glossPage();
 else if(p[0]=='search'){if(p[1]!=null)searchQ=p[1];html=searchPage()}
 else html=homePage();
 topbar(p);main.innerHTML=html;
 wire();
 if(keepScroll){restoreAnchor(anc)}
 else if(deep)jumpTo(deep,true);
 else window.scrollTo(0,0);
 renderSheet();
}
function jumpTo(key,openIt){
 const e=main.querySelector(`[data-k="${CSS.escape(key)}"]`)||document.getElementById('k-'+key);if(!e)return;
 if(openIt){if(e.tagName=='DETAILS'){e.open=true;open.add(route+'|'+key)}
  // Unit-Karte oder Fähigkeit in Einheit: übergeordnete Details öffnen
  let q=e.parentElement;while(q&&q!==main){if(q.tagName=='DETAILS'){q.open=true;open.add(route+'|'+q.dataset.k)}q=q.parentElement}}
 const y=e.getBoundingClientRect().top+window.scrollY-top.offsetHeight-8;
 window.scrollTo({top:y,behavior:'smooth'});
 e.classList.add('hl');setTimeout(()=>e.classList.remove('hl'),1800);
}
function wire(){
 main.querySelectorAll('details[data-k]').forEach(d=>d.addEventListener('toggle',()=>{const k=route+'|'+d.dataset.k;d.open?open.add(k):open.delete(k)}));
 main.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>{const all=b.dataset.act=='all';main.querySelectorAll('details[data-k]').forEach(d=>{d.open=all;const k=route+'|'+d.dataset.k;all?open.add(k):open.delete(k)})});
 const q=document.getElementById('q');
 if(q){q.oninput=()=>{searchQ=q.value;document.getElementById('sr').innerHTML=runSearch(searchQ);history.replaceState(null,'','#/search/'+encodeURIComponent(searchQ))};if(!searchQ&&!opts_noFocus)setTimeout(()=>q.focus(),50)}
 const gf=document.getElementById('gf');
 if(gf){gf.oninput=()=>{const w=norm(gf.value).split(/\s+/).filter(Boolean);document.querySelectorAll('#gl .gl').forEach(e=>{e.hidden=!w.every(x=>e.dataset.h.includes(x))})}}
 main.querySelectorAll('[data-letter]').forEach(a=>a.onclick=ev=>{ev.preventDefault();const t=main.querySelector(`.gl[data-l="${a.dataset.letter}"]`);if(t){window.scrollTo({top:t.getBoundingClientRect().top+window.scrollY-top.offsetHeight-8,behavior:'smooth'})}});
}
let opts_noFocus=false;
document.addEventListener('click',ev=>{
 const dj=ev.target.closest('[data-j]');if(dj){ev.preventDefault();jumpTo(dj.dataset.j,dj.closest('.cheat')!=null);return}
 const tb=ev.target.closest('[data-tab]');if(tb){armyTab=tb.dataset.tab;window.scrollTo(0,0);open.size;render({keep:true});return}
 const t=ev.target.closest('a.lk,.lang button,#bk,#hm,#cl,.sheet [data-s],.sheet .x,.back');if(!t)return;
 if(t.matches('a.lk')){ev.preventDefault();
  if(t.dataset.g){sheetId=t.dataset.g;renderSheet()}
  else if(t.dataset.a){const [ai,key]=t.dataset.a.split('|');if(parse()[1]!=ai||parse()[0]!='sp'){location.hash='#/sp/'+ai+'/'+key}else{if(tabOf(key)!=armyTab){armyTab=tabOf(key);render({keep:true})}jumpTo(key,true)}}
  return}
 if(t.id=='bk'){if(history.length>1)history.back();else location.hash='#/';return}
 if(t.id=='hm'){location.hash='#/';return}
 if(t.id=='cl'){try{parent.postMessage('close-rules',location.origin)}catch(e){}return}
 if(t.closest('.lang')){setLang(t.dataset.l);return}
 if(t.matches('.x,.back')){sheetId=null;renderSheet();return}
 if(t.dataset.s){sheetId=null;renderSheet();location.hash=t.dataset.s}
});
function renderSheet(){
 if(!sheetId){sheetEl.innerHTML='';return}
 const g=gById[sheetId];if(!g){sheetEl.innerHTML='';return}
 sheetEl.innerHTML=`<div class="back"></div><div class="sheet" role="dialog" aria-label="${esc(P(g.t))}"><button class="ib x" aria-label="${T('close')}">✕</button><h3>${esc(P(g.t))}</h3><div class="hint">${esc(g.t[1-li()])}</div><p>${linkify(P(g.d),-1)}</p><div class="acts"><button class="btn" data-s="#/rules/${g.s}">${T('toRule')} → ${esc(P(rById[g.s].t))}</button><button class="btn" data-s="#/gloss/${g.id}">${T('toGloss')}</button></div></div>`;
}
function setLang(l){
 if(l==L)return;L=l;try{localStorage.setItem('regeln.lang',L)}catch(e){}
 opts_noFocus=true;INDEX=null;render({keep:true});opts_noFocus=false;
}
window.addEventListener('hashchange',()=>{sheetId=null;render()});
render();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
