chlachtrunde.","The underdog (else roll-off winner) chooses: Precision Strike (a friendly unit has STRIKE-FIRST while wholly in friendly territory) or Dissent in the Ranks (an enemy unit has STRIKE-LAST while wholly in friendly territory), both for the rest of the battle round."]},{"n":"Co-ordinated Bombardment","t":["Der Außenseiter (sonst Gewinner des Würfelduells) wählt 1 Ziel. Für den Rest der Schlachtrunde subtrahieren feindliche Einheiten, die es umkämpfen, 1 von ihren Trefferwürfen.","The underdog (else roll-off winner) picks 1 objective. For the rest of the battle round enemy units contesting it subtract 1 from their hit rolls."]},{"n":"Secured Supply Lines","t":["Der Außenseiter wählt 2 Geländestücke (kein Außenseiter: Jeder Spieler wählt ein anderes). Jeder Spieler erhält am Ende seines Zugs 1 zusätzlichen SP, wenn er beide kontrolliert. Der Außenseiter wählt außerdem 1 befreundete Einheit: Rettung (5+), solange sie eines der beiden Geländestücke umkämpft (diese Schlachtrunde).","The underdog picks 2 terrain features (no underdog: each player picks a different one). Each player scores 1 extra VP at the end of their turn if they control both. The underdog also picks 1 friendly unit: WARD (5+) while it contests either feature this battle round."]},{"n":"Will of the Necropolis","t":["Der Außenseiter (sonst Gewinner des Würfelduells) wählt: Anpassungsfähige Verteidigung (eine befreundete Einheit ignoriert alle Modifikatoren auf ihre Schutzwürfe) oder Gebrochener Wille (eine feindliche Einheit hat einen Kontrollwert von höchstens 1), jeweils für den Rest der Schlachtrunde.","The underdog (else roll-off winner) chooses: Adaptable Defence (a friendly unit ignores all modifiers to its save rolls) or Broken Will (an enemy unit has a maximum control score of 1), for the rest of the battle round."]},{"n":"Uncompromising Invasion","t":["Jeder Spieler erhält am Ende seines Zugs 1 zusätzlichen SP für jedes Ziel, das er kontrolliert, das nicht vollständig im eigenen Gebiet liegt und von keiner feindlichen Einheit umkämpft wird. Der Außenseiter wählt 1 befreundete Einheit und würfelt einen W6: Addiere das Ergebnis für den Rest der Schlachtrunde zu ihrem Kontrollwert.","Each player scores 1 extra VP at the end of their turn for each objective they control that is not wholly in their own territory and not contested by an enemy unit. The underdog picks 1 friendly unit and rolls a D6: add the result to its control score for the rest of the battle round."]}]}]},{"id":"ca","n":["City of Ash","City of Ash"],"sub":["Schlachtfelder Ashen Bastion und Shattered Crossroads","Battlefields Ashen Bastion and Shattered Crossroads"],"intro":["Ein zerstörtes Stadtviertel: Reliquien, die man kontrollieren und verteidigen muss, Ruined Manors auf befestigten Zielen und – auf den Shattered Crossroads – Straßen.","A ruined city district: relics to control and defend, Ruined Manors on fortified objectives and – on Shattered Crossroads – roads."],"setup":[["Würfelduell: Der Gewinner wird Angreifer oder Verteidiger.","Roll-off: the winner chooses to be attacker or defender."],["Beide Spieler wählen Regimentsfähigkeit und Verbesserung.","Both players pick a regiment ability and an enhancement."],["Der Verteidiger wählt das Schlachtfeld (Seite der Matte).","The defender picks the battlefield (side of the mat)."],["Der Verteidiger wählt die Aufstellungskarte (horizontal oder diagonal) und sein Gebiet.","The defender picks the deployment map (horizontal or diagonal) and their territory."],["Gelände wird aufgestellt (siehe unten).","Terrain is set up (see below)."],["Start-Reliquien: Der Verteidiger wählt eine der zwei Start-Reliquien des Schlachtfelds, der Angreifer erhält die andere. Beide stellen sie ganz im eigenen Gebiet auf.","Starting relics: the defender picks one of the two starting relics of the battlefield, the attacker takes the other. Both set them up wholly in own territory."],["Aufstellung: Der Angreifer beginnt, dann der Verteidiger – ganz im eigenen Gebiet, mehr als 6 Zoll vom Feindgebiet.","Deployment: the attacker goes first, then the defender – wholly in own territory, more than 6\" from enemy territory."]],"maps":[["Horizontal: Teilung an der Mittellinie der langen Kante.","Horizontal: split along the middle line."],["Diagonal: Teilung von Ecke zu Ecke.","Diagonal: split corner to corner."]],"bf":[{"n":["Ashen Bastion","Ashen Bastion"],"obj":[{"n":"Great Wheel","x":2.5,"y":2.34,"r":2.1,"w":null,"h":null,"a":0},{"n":"Ghal Maraz","x":22.6,"y":5.8,"r":2.1,"w":null,"h":null,"a":0},{"n":"The Ruin","x":15,"y":11.2,"r":6.5,"w":11,"h":7.2,"a":0},{"n":"Twin-Tailed Comet","x":7.4,"y":16.6,"r":2.1,"w":null,"h":null,"a":0},{"n":"High Star","x":27.5,"y":20.06,"r":2.1,"w":null,"h":null,"a":0}],"start":["Battered Barricade","Inconspicuous Manhole"]},{"n":["Shattered Crossroads","Shattered Crossroads"],"obj":[{"n":"Great Wheel","x":5.61,"y":6.21,"r":3.3,"w":4.15,"h":5.5,"a":-0.305},{"n":"Ghal Maraz","x":20.35,"y":2.9,"r":3.3,"w":4.3,"h":5.45,"a":1.2392},{"n":"The Junction","x":15,"y":11.2,"r":3.5,"w":null,"h":null,"a":0},{"n":"Twin-Tailed Comet","x":9.8,"y":19.6,"r":3.3,"w":4.25,"h":5.6,"a":1.2392},{"n":"High Star","x":24.1,"y":15.88,"r":3.3,"w":4.25,"h":5.4,"a":-0.3316}],"roads":[{"x":15,"y":11.2,"w":44,"h":4,"a":-0.2793},{"x":15,"y":11.2,"w":34,"h":4,"a":1.3614},{"x":15,"y":11.2,"r":3.7}],"start":["Barrel of Emberstone","Crate of Aqua Ghyranis"]}],"objNote":["Ziele mit Gelände darauf sind befestigt: Einheiten, deren Modelle alle auf einem solchen Ziel stehen, haben Deckung. Rechteckige Ziele (z. B. The Ruin) tragen ein Ruined Manor.","Objectives with terrain on them are fortified: units whose models are all on such an objective have cover. Rectangular objectives (e.g. The Ruin) carry a Ruined Manor."],"terr":[{"n":["Ruined Manor","Ruined Manor"],"d":["L-Form · 2 × 4\" · Höhe 5\"","L-shape · 2 × 4\" · height 5\""],"k":["Großes Geländestück: Deckung, instabil","Large terrain feature: cover, unstable"],"t":["Jeder Spieler stellt 1 ganz im eigenen Gebiet auf eine Ecke eines rechteckigen Ziels (Verteidiger zuerst).","Each player sets up 1 wholly in own territory on a corner of a rectangular objective (defender first)."]},{"n":["Barrel of Emberstone","Barrel of Emberstone"],"d":["2,4\" × 2\"","2.4\" × 2\""],"k":["Reliquie","Relic"],"t":["Einmal pro Zug, deine Heldenphase: Wähle eine befreundete Einheit innerhalb von 3 Zoll: Sie addiert in diesem Zug 1 auf die Verwundungswürfe ihrer Attacken.","Once per turn, your Hero Phase: pick a friendly unit within 3\": it adds 1 to the wound rolls of its attacks this turn."]},{"n":["Crate of Aqua Ghyranis","Crate of Aqua Ghyranis"],"d":["2,6\" × 1,6\"","2.6\" × 1.6\""],"k":["Reliquie","Relic"],"t":["Passiv: Einheiten vollständig innerhalb von 6 Zoll haben Rettung (5+).","Passive: units wholly within 6\" have WARD (5+)."]},{"n":["Ulguan Steel Caltrops","Ulguan Steel Caltrops"],"d":["3,5\" × 1,2\"","3.5\" × 1.2\""],"k":["Reliquie","Relic"],"t":["Einmal pro Zug, deine Nahkampfphase: Wirf für jede Einheit innerhalb von 3 Zoll, die in diesem Zug angegriffen hat, einen W3; bei 2+ erleidet sie entsprechend viel tödlichen Schaden.","Once per turn, your Combat Phase: roll a D3 for each unit within 3\" that charged this turn; on a 2+ it suffers that much mortal damage."]},{"n":["Battered Barricade","Battered Barricade"],"d":["4\" × 1,2\"","4\" × 1.2\""],"k":["Reliquie","Relic"],"t":["Passiv: Einheiten vollständig innerhalb von 3 Zoll können nicht beschossen werden, außer der Schütze ist innerhalb ihrer Kampfreichweite (3 Zoll).","Passive: units wholly within 3\" cannot be shot unless the shooter is within their combat range (3\")."]},{"n":["Inconspicuous Manhole","Inconspicuous Manhole"],"d":["2,2\" × 2\"","2.2\" × 2\""],"k":["Reliquie","Relic"],"t":["Einmal pro Zug, deine Bewegungsphase: Nimm eine befreundete Einheit vollständig innerhalb von 3 Zoll vom Schlachtfeld und stelle sie vollständig im eigenen Gebiet, mehr als 6 Zoll von feindlichen Einheiten, wieder auf.","Once per turn, your Movement Phase: remove a friendly unit wholly within 3\" and set it up again wholly in friendly territory, more than 6\" from enemy units."]}],"terrNote":["Reliquien werden im Lauf der Schlacht durch Wendungen und Taktikkarten aufgestellt (mehr als 3 Zoll von Feinden, mehr als 6 Zoll von anderen Reliquien). Wer eine Reliquie kontrolliert, nutzt ihre Fähigkeit. Manor-Grundriss und Reliquienmaße sind nach Fotos geschätzt.","Relics are set up during the battle by twists and tactic cards (more than 3\" from enemies, more than 6\" from other relics). Whoever controls a relic uses its ability. The manor layout and relic sizes are estimated from photos."],"tac":[{"n":"Take What's Theirs","c":["Erfüllt am Ende deines Zugs, wenn du eine Reliquie im Feindgebiet kontrollierst.","Complete at the end of your turn if you control a relic within enemy territory."],"k":"Prepared Riposte","t":["Gegnerische Bewegungsphase. Ansage: Wähle eine befreundete Einheit. Bis zum Ende des Zugs kämpft sie zuerst, solange sie mit einer feindlichen Einheit im Nahkampf ist, die in diesem Zug angegriffen hat.","Enemy Movement Phase. Declare: pick a friendly unit. Until the end of the turn, while in combat with an enemy unit that charged this turn, it has STRIKE-FIRST."]},{"n":"Pitiless Murder","c":["Erfüllt am Ende deines Zugs, wenn eine feindliche Einheit in diesem Zug das gewählte Ziel von Nahkampfattacken zweier oder mehrerer verschiedener befreundeter Einheiten war.","Complete at the end of your turn if an enemy unit was the chosen target of combat attacks from two or more different friendly units this turn."],"k":"Motivated by Greed","t":["Beliebige Heldenphase. Ansage: Wähle eine befreundete Einheit innerhalb von 6 Zoll um eine Reliquie. Addiere bis zum Beginn deines nächsten Zugs W6 auf ihren Kontrollwert.","Any Hero Phase. Declare: pick a friendly unit within 6\" of a relic. Add D6 to its control score until the start of your next turn."]},{"n":"Take the Flanks","c":["Erfüllt am Ende deines Zugs, wenn sich eine befreundete Einheit innerhalb von 3 Zoll um jede kurze Schlachtfeldkante befindet.","Complete at the end of your turn if there is a friendly unit within 3\" of each short battlefield edge."],"k":"Rigged Explosions","t":["Ende eines beliebigen Zugs. Ansage: Wähle eine Reliquie. Wirf für jede befreundete und feindliche Einheit innerhalb von 3 Zoll um sie einen W3 und füge der Einheit entsprechend viel tödlichen Schaden zu.","End of any turn. Declare: pick a relic. Roll a D3 for each friendly and enemy unit within 3\" of it and inflict that much mortal damage on it."]},{"n":"Cut Off the Head","c":["Erfüllt am Ende deines Zugs, wenn der feindliche General in diesem Zug erschlagen wurde oder früher erschlagen wurde und in diesem Zug feindliche Einheiten zerstört wurden.","Complete at the end of your turn if the enemy general was slain this turn, or was slain earlier and any enemy units were destroyed this turn."],"k":"Counter-Charge","t":["Gegnerische Angriffsphase. Ansage: Wähle eine befreundete Einheit, die nicht im Nahkampf ist. Sie darf eine Angriff-Fähigkeit einsetzen, als wäre es deine Angriffsphase.","Enemy Charge Phase. Declare: pick a friendly unit not in combat. It can use a CHARGE ability as if it were your Charge phase."]},{"n":"Raid","c":["Erfüllt am Ende deines Zugs, wenn sich befreundete Einheiten vollständig im Feindgebiet und nicht im Nahkampf befinden.","Complete at the end of your turn if any friendly units are wholly within enemy territory and not in combat."],"k":"Race for the Loot","t":["Beliebige Angriffsphase. Ansage: Wähle eine Reliquie. Für den Rest des Zugs dürfen befreundete Einheiten Angriffsbewegungen bis ½ Zoll an dieser Reliquie beenden, als wäre sie eine feindliche Einheit.","Any Charge Phase. Declare: pick a relic. For the rest of the turn friendly units can finish charge moves within 1/2\" of that relic as if it were an enemy unit."]},{"n":"Protect the Loot","c":["Erfüllt am Ende deines Zugs, wenn eine feindliche Einheit von einer befreundeten Einheit zerstört wurde, die sich zu diesem Zeitpunkt innerhalb von 3 Zoll um eine Reliquie befand.","Complete at the end of your turn if an enemy unit was destroyed by a friendly unit that was within 3\" of a relic at the time."],"k":"Last-Ditch Effort","t":["Deine Heldenphase. Ansage: Wähle eine zerstörte befreundete Einheit, die noch nicht ersetzt wurde. Stelle einen Ersatz mit einem Ausdauerwert von insgesamt bis zu 4 (oder ein einzelnes Modell mit Schaden = Ausdauer minus 4) mehr als 6 Zoll von allen feindlichen Einheiten entfernt auf.","Your Hero Phase. Declare: pick a destroyed friendly unit not yet replaced. Set up a replacement with combined Health up to 4 (or a single model with damage = Health minus 4) more than 6\" from all enemy units."]},{"n":"Hold the Centre","c":["Erfüllt am Ende deines Zugs, wenn sich 2 oder mehr befreundete Einheiten innerhalb von 3 Zoll um die Mitte des Schlachtfelds befinden.","Complete at the end of your turn if 2 or more friendly units are within 3\" of the centre of the battlefield."],"k":"Slip Away","t":["Beliebige Nahkampfphase. Ansage: Wähle eine befreundete Einheit im Nahkampf. Sie darf sich bis zu 5 Zoll bewegen, auch durch feindliche Kampfreichweiten, darf aber nicht im Nahkampf enden.","Any Combat Phase. Declare: pick a friendly unit in combat. It can move up to 5\", through enemy combat ranges, but cannot end in combat."]},{"n":"Raze","c":["Erfüllt am Ende deines Zugs, wenn sich befreundete Einheiten innerhalb von 3 Zoll um die lange Schlachtfeldkante im Feindgebiet befinden.","Complete at the end of your turn if any friendly units are within 3\" of the long battlefield edge in enemy territory."],"k":"Covetous Frenzy","t":["Beliebige Nahkampfphase. Ansage: Wähle eine Reliquie. Für den Rest des Zugs addieren befreundete Einheiten innerhalb von 3 Zoll um sie 1 auf ihre Trefferwürfe.","Any Combat Phase. Declare: pick a relic. For the rest of the turn friendly units within 3\" of it add 1 to their hit rolls."]},{"n":"Dais of the Comet","c":["Erfüllt am Ende deines Zugs, wenn du das Ziel Twin-Tailed Comet kontrollierst.","Complete at the end of your turn if you control the Twin-Tailed Comet objective."],"k":"Go Down Fighting","t":["Beliebige Heldenphase. Ansage: Wähle eine befreundete Einheit. Für den Rest des Zugs gilt: Jedes Mal, wenn gegen eine Nahkampfattacke auf sie ein unmodifizierter Schutzwurf von 5+ gemacht wird, erleidet der Angreifer nach Abschluss seiner Kämpfen-Fähigkeit 1 tödlichen Schaden.","Any Hero Phase. Declare: pick a friendly unit. For the rest of the turn, each time an unmodified save roll of 5+ is made against a combat attack on it, inflict 1 mortal damage on the attacker after its FIGHT ability resolves."]},{"n":"Dais of the Hammer","c":["Erfüllt am Ende deines Zugs, wenn du das Ziel Ghal Maraz kontrollierst.","Complete at the end of your turn if you control the Ghal Maraz objective."],"k":"Fool's Gold","t":["Ende eines beliebigen Zugs. Ansage: Wähle eine Reliquie. Nimm sie vom Schlachtfeld und stelle sie mehr als 3 Zoll von allen feindlichen Einheiten und mehr als 6 Zoll von anderen Reliquien wieder auf.","End of any turn. Declare: pick a relic. Remove it and set it up again more than 3\" from all enemy units and more than 6\" from other relics."]},{"n":"Comb the Area","c":["Erfüllt am Ende deines Zugs, wenn sich alle befreundeten Einheiten innerhalb von 3 Zoll um eine Reliquie befinden (nicht zwingend dieselbe).","Complete at the end of your turn if all friendly units are within 3\" of a relic (not necessarily the same one)."],"k":"Redeploy","t":["Gegnerische Bewegungsphase. Ansage: Wähle eine befreundete Einheit, die nicht im Nahkampf ist. Sie darf sich W6 Zoll bewegen, aber nicht durch oder in eine feindliche Kampfreichweite.","Enemy Movement Phase. Declare: pick a friendly unit not in combat. It can move D6\" but not through or into an enemy combat range."]},{"n":"Material Gains","c":["Erfüllt am Ende deines Zugs, wenn du mehr Reliquien kontrollierst als dein Gegner.","Complete at the end of your turn if you control more relics than your opponent."],"k":"Grind Them to Dust","t":["Beliebige Nahkampfphase. Ansage: Wähle eine befreundete Einheit. Sie darf in dieser Phase 2 Kämpfen-Fähigkeiten einsetzen; nach der ersten erleidet sie W3 tödlichen Schaden und kämpft für den Rest des Zugs zuletzt.","Any Combat Phase. Declare: pick a friendly unit. It can use 2 FIGHT abilities this phase; after the first it suffers D3 mortal damage and has STRIKE-LAST for the rest of the turn."]}],"tw":[{"n":["Ashen Bastion","Ashen Bastion"],"l":[{"n":"Staging Posts","t":["Beginnend mit dem aktiven Spieler wählt jeder Spieler ein Ziel. Am Ende seines Zugs erhält jeder Spieler 1 zusätzlichen SP für jedes dieser Ziele, das er kontrolliert. Der Außenseiter darf würfeln: Bei 3+ muss der Gegner ein anderes Ziel wählen.","Starting with the active player each player picks an objective. At the end of their turn each player scores 1 extra VP for each of those objectives they control. The underdog may roll a dice: on a 3+ the opponent must pick a different objective."]},{"n":"Cursed Treasure","t":["Beginnend mit dem aktiven Spieler wählt jeder Spieler eine feindliche Einheit innerhalb von 3 Zoll um eine Reliquie. Ihr Kontrollwert ist für den Rest der Schlachtrunde höchstens 1. Der Außenseiter (sonst Gewinner des Würfelduells) stellt die Ulguan-Stahlfußangeln auf.","Starting with the active player each player picks an enemy unit within 3\" of a relic. For the rest of the battle round its maximum control score is 1. The underdog (else roll-off winner) places the Ulguan Steel Caltrops."]},{"n":"Equivalent Escalades","t":["Am Ende seines Zugs erhält jeder Spieler 1 zusätzlichen SP, wenn er das große Geländestück im Feindgebiet kontrolliert. Der Außenseiter (sonst Gewinner des Würfelduells) stellt das Fass Glutstein auf.","At the end of their turn each player scores 1 extra VP if they control the large terrain feature in enemy territory. The underdog (else roll-off winner) places the Barrel of Emberstone."]},{"n":"A Timely Exit","t":["Der Außenseiter darf eine Schlachtfeldkante wählen, die versperrt ist. Am Ende seines Zugs erhält jeder Spieler 1 zusätzlichen SP für jede nicht versperrte Schlachtfeldkante, an der sich innerhalb von 3 Zoll keine feindliche Einheit befindet.","The underdog may pick one battlefield edge to be obstructed. At the end of their turn each player scores 1 extra VP for each battlefield edge that is not obstructed and has no enemy unit within 3\" of it."]},{"n":"Got Your Back","t":["Für den Rest der Schlachtrunde addieren befreundete Einheiten 1 auf ihre Schutzwürfe, solange sie sich innerhalb von 3 Zoll um eine andere befreundete Einheit befinden. Der Außenseiter (sonst Gewinner des Würfelduells) stellt die Kiste Aqua Ghyranis auf.","For the rest of the battle round friendly units add 1 to their save rolls while within 3\" of another friendly unit. The underdog (else roll-off winner) places the Crate of Aqua Ghyranis."]},{"n":"We'll Have That!","t":["Am Ende seines Zugs erhält jeder Spieler 1 zusätzlichen SP, wenn er die Reliquie kontrolliert, die zu Beginn der Schlacht im Feindgebiet aufgestellt wurde. Der Außenseiter darf eine befreundete Einheit wählen: Sie addiert in dieser Schlachtrunde 2 auf ihre Angriffswürfe.","At the end of their turn each player scores 1 extra VP if they control the relic that was placed in enemy territory at the start of the battle. The underdog may pick a friendly unit: it adds 2 to its charge rolls this battle round."]}]},{"n":["Shattered Crossroads","Shattered Crossroads"],"l":[{"n":"Assassinate","t":["Beginnend mit dem aktiven Spieler wählt jeder Spieler eine feindliche Einheit als Zielperson. Jeder Spieler erhält am Ende der Schlachtrunde 1 zusätzlichen SP, wenn seine Zielperson in dieser Runde zerstört wurde. Der Außenseiter (sonst Gewinner des Würfelduells) stellt das unauffällige Kanalloch auf.","Starting with the active player each player picks an enemy unit as the mark. Each player scores 1 extra VP at the end of the battle round if their mark was destroyed that round. The underdog (else roll-off winner) places the Inconspicuous Manhole."]},{"n":"Aggressive Valuation","t":["Beginnend mit dem aktiven Spieler wählt jeder Spieler eine befreundete Einheit, die die bewachte Beute trägt. Jeder Spieler erhält am Ende der Schlachtrunde 1 zusätzlichen SP, wenn die feindliche Einheit mit der Beute in dieser Runde zerstört wurde. Der Außenseiter darf würfeln: Bei 3+ muss der Gegner eine andere Einheit wählen.","Starting with the active player each player picks a friendly unit to hold the guarded loot. Each player scores 1 extra VP at the end of the battle round if the enemy unit holding the loot was destroyed that round. The underdog may roll a dice: on a 3+ the opponent must pick a different unit."]},{"n":"Stockpiling Drive","t":["Am Ende seines Zugs erhält jeder Spieler 1 zusätzlichen SP für jede Reliquie, die er kontrolliert und zu Beginn seines Zugs nicht kontrolliert hat. Der Außenseiter (sonst Gewinner des Würfelduells) stellt die demolierte Barrikade auf.","At the end of their turn each player scores 1 extra VP for each relic they control that they did not control at the start of their turn. The underdog (else roll-off winner) places the Battered Barricade."]},{"n":"Crux Point","t":["Am Ende seines Zugs erhält jeder Spieler 1 zusätzlichen SP, wenn er die Kreuzung kontrolliert. Der Außenseiter (sonst Gewinner des Würfelduells) stellt die Ulguan-Stahlfußangeln auf.","At the end of their turn each player scores 1 extra VP if they control the junction. The underdog (else roll-off winner) places the Ulguan Steel Caltrops."]},{"n":"Adrenaline Rush","t":["Beginnend mit dem Außenseiter (sonst dem aktiven Spieler) darf jeder Spieler bis zu 2 befreundete Einheiten wählen, die nicht im Nahkampf sind, und jede sofort bis zu 3 Zoll bewegen. Die Einheiten des Außenseiters dürfen diese Bewegung im Nahkampf beenden.","Starting with the underdog (else active player) each player may pick up to 2 friendly units not in combat and move each up to 3\" immediately. The underdog's units may end this move in combat."]},{"n":"Rapid Manoeuvres","t":["Solange eine Einheit vollständig auf den Straßen steht, darf sie auch angreifen, wenn sie im selben Zug gerannt ist. Der Außenseiter darf eine befreundete Einheit wählen: Ihre Nahkampfwaffen haben in dieser Schlachtrunde Anti-Angriff (+1 Wucht).","While wholly on the roads a unit can charge even if it ran in the same turn. The underdog may pick a friendly unit: its melee weapons have Anti-charge (+1 Rend) this battle round."]}]}]}]};

 t1:['Spearhead on a Page','Spearhead on a Page'],d1:['Alle 31 Spearhead-Armeen, jeweils auf einer Seite','All 31 Spearhead armies, one page each'],
 t2:['Regelübersicht','Rules overview'],d2:['Die wichtigsten Regeln in Spielreihenfolge','The key rules in the order of play'],

/* ---------- Verlinkung ---------- */
const reEsc=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
const linkerCache={};
function mkLinker(ai){
 const ck=L+':'+ai;if(linkerCache[ck])return linkerCache[ck];
 const items=[];
 G.forEach(g=>g.k[li()].forEach(lab=>{if(lab.length>=2&&!lab.endsWith('-'))items.push({lab,t:'g',id:g.id})}));
 if(ai>=0){const a=A[ai];
  const add=(arr,pre)=>arr.forEach((x,j)=>items.push({lab:P(x.n),t:'a',id:pre+j}));
  add(a.traits,'t');add(a.reg,'r');add(a.enh,'e');a.units.forEach((u,k)=>u.ab.forEach((x,j)=>items.push({lab:P(x.n),t:'a',id:'u'+k+'a'+j})));}
 items.sort((x,y)=>(x.t=='a'?0:1)-(y.t=='a'?0:1)||y.lab.length-x.lab.length);
 const map=new Map();items.forEach(it=>{const k=it.lab.toLowerCase();if(!map.has(k))map.set(k,it)});
 const labs=[...map.values()].map(i=>i.lab).sort((a,b)=>b.length-a.length);
 const re=new RegExp('(^|[^\\p{L}\\p{N}])('+labs.map(reEsc).join('|')+')(?![\\p{L}\\p{N}])','giu');
 return linkerCache[ck]={re,map};
}
// text: Rohtext; ai: Armee-Index oder -1; self: Schlüssel der eigenen Fähigkeit (nicht verlinken)
function linkify(text,ai,self){
 const {re,map}=mkLinker(ai);const seen=new Set();let out='',last=0,m;
 re.lastIndex=0;
 while((m=re.exec(text))){
  const pre=m[1],lab=m[2],at=m.index+pre.length;
  const it=map.get(lab.toLowerCase());if(!it){continue}
  if(lab.length<=3&&lab!==it.lab){continue}
  if(it.t=='a'&&it.id===self)continue;
  const sk=it.t+it.id;if(seen.has(sk))continue;seen.add(sk);
  out+=esc(text.slice(last,at));
  out+=it.t=='g'?`<a class="lk" data-g="${it.id}" role="button" tabindex="0">${esc(lab)}</a>`:`<a class="lk ab" data-a="${ai}|${it.id}" role="button" tabindex="0">${esc(lab)}</a>`;
  last=at+lab.length;
 }
 return out+esc(text.slice(last));
}

 const num=v=>Math.round(v*100)/100;
 let s=`<svg class="pmap" viewBox="-0.3 -0.3 ${W+0.6} ${H+0.6}" role="img" aria-label="${esc(P(b.n))}"><rect x="0" y="0" width="${W}" height="${H}" fill="var(--card2)" stroke="var(--line)" stroke-width=".15"/>`;
 (b.roads||[]).forEach(r=>{s+=r.r?`<circle cx="${r.x}" cy="${r.y}" r="${r.r}" fill="var(--line)" opacity=".7"/>`:`<rect x="${num(r.x-r.w/2)}" y="${num(r.y-r.h/2)}" width="${r.w}" height="${r.h}" transform="rotate(${num(r.a*180/Math.PI)} ${r.x} ${r.y})" fill="var(--line)" opacity=".7" clip-path="url(#cl)"/>`});
 if(b.roads)s=s.replace('<rect x="0" y="0"',`<defs><clipPath id="cl"><rect x="0" y="0" width="${W}" height="${H}"/></clipPath></defs><rect x="0" y="0"`);
 s+= pmap==0?`<line x1="0" y1="${H/2}" x2="${W}" y2="${H/2}" stroke="var(--acc)" stroke-width=".18" stroke-dasharray=".6 .4"/>`:(dg?`<line x1="0" y1="0" x2="${W}" y2="${H}"`:`<line x1="${W}" y1="0" x2="0" y2="${H}"`)+` stroke="var(--acc)" stroke-width=".18" stroke-dasharray=".6 .4"/>`;
 if(b.my=='crypt')s+=`<rect x="${W/2-2.25}" y="${H/2-.8}" width="4.5" height="1.6" transform="rotate(${num(Math.atan2(H,W)*180/Math.PI)} ${W/2} ${H/2})" fill="var(--chip)" stroke="var(--mut)" stroke-width=".12"/>`;
 b.obj.forEach((o,i)=>{
  if(o.w)s+=`<rect x="${num(o.x-o.w/2)}" y="${num(o.y-o.h/2)}" width="${o.w}" height="${o.h}" transform="rotate(${num(o.a*180/Math.PI)} ${o.x} ${o.y})" fill="var(--acc)" fill-opacity=".18" stroke="var(--acc)" stroke-width=".18"/>`;
  else s+=`<circle cx="${o.x}" cy="${o.y}" r="${o.r}" fill="var(--acc)" fill-opacity=".18" stroke="var(--acc)" stroke-width=".18"/>`;
  s+=`<text x="${Math.min(W-1.5,Math.max(1.5,o.x))}" y="${o.y+.3}" text-anchor="middle" font-size=".95" fill="var(--fg)" stroke="var(--card2)" stroke-width=".25" paint-order="stroke" font-weight="700">${esc(P(o.n))}</text>`;
 });
 return s+'</svg>';
}
function packCard(key,title,inner,k){return `<details class="ab" data-k="${key}" id="k-${key}" ${open.has(route+'|'+key)?'open':''}><summary><span class="nm">${title}</span></summary><div class="body">${inner}</div></details>`}
function packPage(i){
 const k=PK[i];
 let h=`<div class="crumb"><a href="#/packs">${T('t5')}</a></div>`;
 h+=`<div class="tabs"><button data-ptab="m" class="${packTab=='m'?'on':''}">${T('pkMap')}</button><button data-ptab="t" class="${packTab=='t'?'on':''}">${T('pkTac')} <small>${k.tac.length}</small></button><button data-ptab="w" class="${packTab=='w'?'on':''}">${T('pkTw')} <small>${k.tw.reduce((a,b)=>a+b.l.length,0)}</small></button></div>`;
 const sec=(kk,title,hint)=>`<div class="sec" data-k="s-${kk}"><h2>${title}</h2>${hint?`<small>${hint}</small>`:''}</div>`;
 if(packTab=='m'){
  h+=`<p class="hint">${linkify(P(k.intro),-1,null)}</p><p class="hint"><b>${T('pkBoard')}</b></p>`;
  h+=sec('setup',T('pkSetup'));h+='<ol class="pkl">'+k.setup.map(x=>`<li>${linkify(P(x),-1,null)}</li>`).join('')+'</ol>';
  h+=sec('field',T('pkField'));
  h+=`<div class="pseg"><button data-pmap="0" class="${pmap==0?'on':''}">${T('pkHor')}</button><button data-pmap="1" class="${pmap==1?'on':''}">${T('pkDia')}</button></div><p class="hint">${linkify(P(k.maps[pmap]),-1,null)}</p>`;
  k.bf.forEach((b,bi)=>{
   h+=`<div class="pbf" data-k="bf${bi}" id="k-bf${bi}"><h3>${esc(P(b.n))}</h3>${mapSvg(k,b)}<ul class="pkl">`+b.obj.map(o=>`<li><b>${esc(P(o.n))}</b> · ${o.w?`${o.w}" × ${o.h}"`:`⌀ ${o.r*2}"`} · (${o.x}" / ${o.y}")</li>`).join('')+'</ul>';
   if(b.start)h+=`<p class="hint"><b>${T('pkStart')}:</b> ${b.start.map(esc).join(' · ')}</p>`;
   if(b.roads)h+=`<p class="hint">${T('pkRoads')}: ${P(B2('Zwei Straßen (4" breit) kreuzen sich in der Mitte; dort liegt ein runder Platz (⌀ 7").','Two roads (4" wide) cross in the centre with a round plaza (7" across).'))}</p>`;
   h+='</div>';
  });
  h+=`<p class="hint">${linkify(P(k.objNote),-1,null)}</p>`;
  h+=sec('terr',T('pkTerrH'));
  if(k.groups)h+=`<p class="hint">`+k.groups.map(g=>`<b>${esc(P(g.n))}:</b> ${g.l.map(esc).join(' + ')}`).join(' · ')+'</p>';
  k.terr.forEach((w,j)=>h+=packCard('terr'+j,`${esc(P(w.n))}<span class="chip">${esc(P(w.d))}</span>`,`<p><b>${esc(P(w.k))}</b></p><p>${linkify(P(w.t),-1,null)}</p>`));
  h+=`<p class="hint">${linkify(P(k.terrNote),-1,null)}</p>`;
 } else if(packTab=='t'){
  h+=sec('tac',T('pkTac'),T('pkTacH'));
  k.tac.forEach((c,j)=>h+=packCard('tac'+j,esc(c.n),`<p><b>${T('pkCond')}:</b> ${linkify(P(c.c),-1,null)}</p><p><b>${T('pkCmd')}: ${esc(c.k)}</b><br>${linkify(P(c.t),-1,null)}</p>`));
 } else {
  h+=sec('tw',T('pkTw'),T('pkTwH'));
  k.tw.forEach((b,bi)=>{h+=`<div class="fac" style="margin:12px 0 4px">${esc(P(b.n))}</div>`;b.l.forEach((w,j)=>h+=packCard(`tw${bi}_${j}`,esc(w.n),`<p>${linkify(P(w.t),-1,null)}</p>`))});
 }
 return h+`<footer>${T('ver')}</footer>`;
}
const B2=(a,b)=>[a,b];
function runSearch(q){
 if(!INDEX)buildIndex();
 const ws=norm(q).split(/\s+/).filter(Boolean);if(!ws.length)return '';
 const hits=[];
 INDEX.forEach(it=>{if(ws.every(w=>it.h.includes(w))){const tn=norm(it.t.join(' '));hits.push({it,sc:(ws.every(w=>tn.includes(w))?0:1)+(tn.startsWith(ws[0])?0:.5)})}});
 hits.sort((a,b)=>a.sc-b.sc);
 if(!hits.length)return `<p class="hint">${T('noRes')}</p>`;
 const order=['R','G','P','S','U','A','W'];let h='';
 order.forEach(c=>{
  const arr=hits.filter(x=>x.it.c==c);if(!arr.length)return;
  h+=`<div class="cnt">${T(CAT[c][0])} · ${arr.length}</div>`;
  arr.slice(0,40).forEach(({it})=>{
   const body=it.x.map(v=>Array.isArray(v)?P(v):v).filter(Boolean).join(' · ');
   const ctx=it.ctx?(Array.isArray(it.ctx)?P(it.ctx):P(it.ctx)):'';
   h+=`<a class="card res" href="${it.href}"><b>${snippet(P(it.t),q)}</b>${ctx?`<small>${esc(ctx)}</small>`:''}${body?`<small>${snippet(body,q)}</small>`:''}</a>`;
  });
 });
 return h;
}
function searchPage(){
 return `<div class="crumb"><a href="#/">${T('home')}</a></div><h1 class="ser" style="font-size:26px;margin:4px 0">${T('t4')}</h1><p class="hint">${T('d4')}</p><input class="inp" id="q" type="search" placeholder="${T('search')}" value="${esc(searchQ)}" autocomplete="off" enterkeyhint="search"><div id="sr">${runSearch(searchQ)}</div>`;
}
function homePage(){
 return `<div class="hero"><h1 class="ser">${T('title')}</h1><p class="hint">${T('intro')}</p></div>
 <div class="tiles">
 <a class="tile" href="#/sp"><span class="no">1</span><div><b>${T('t1')}</b><span>${T('d1')}</span></div></a>
 <a class="tile" href="#/rules"><span class="no">2</span><div><b>${T('t2')}</b><span>${T('d2')}</span></div></a>
 <a class="tile" href="#/gloss"><span class="no">3</span><div><b>${T('t3')}</b><span>${T('d3')}</span></div></a>
 <a class="tile" href="#/packs"><span class="no">5</span><div><b>${T('t5')}</b><span>${T('d5')}</span></div></a>
 <a class="tile" href="#/search"><span class="no">4</span><div><b>${T('t4')}</b><span>${T('d4')}</span></div></a>
 </div><p class="hint" style="margin-top:16px">${T('cmdhint')}</p><footer>${EMB?'':`<a href="./">${T('game')} →</a><br>`}${T('ver')}</footer>`;
}

/* ---------- Router ---------- */
function parse(){const h=(location.hash||'#/').slice(1);const p=h.split('/').filter(Boolean).map(decodeURIComponent);return p}
function title(p){
 if(!p.length)return T('title');
 if(p[0]=='sp'){return p[1]!=null&&A[p[1]]?P(A[p[1]].n):T('t1')}
 if(p[0]=='packs')return p[1]!=null&&PK[p[1]]?P(PK[p[1]].n):T('t5');
 return {rules:T('t2'),gloss:T('t3'),search:T('t4')}[p[0]]||T('title');
}
function topbar(p){
 top.innerHTML=`<button class="ib" id="bk" aria-label="${T('back')}">←</button><button class="ib" id="hm" aria-label="${T('home')}">⌂</button><div class="ttl ser">${esc(title(p))}</div><div class="lang"><button data-l="de" class="${L=='de'?'on':''}">DE</button><button data-l="en" class="${L=='en'?'on':''}">EN</button></div>${EMB?`<button class="ib" id="cl" aria-label="${T('close')}">✕</button>`:''}`;
 document.title=title(p)+' – '+T('title');document.documentElement.lang=L;
}
function captureAnchor(){
 const els=[...main.querySelectorAll('[data-k]')];const y=top.getBoundingClientRect().bottom+4;
 let best=null;
 for(const e of els){const r=e.getBoundingClientRect();if(r.top<=y&&r.bottom>y)best=e;}
 if(!best){for(const e of els){if(e.getBoundingClientRect().top>y){best=e;break}}}
 if(!best)return null;
 return {k:best.dataset.k,off:best.getBoundingClientRect().top,sy:window.scrollY};
}
function restoreAnchor(a){
 if(!a)return;const e=main.querySelector(`[data-k="${CSS.escape(a.k)}"]`);
 if(e){window.scrollBy(0,e.getBoundingClientRect().top-a.off)}else window.scrollTo(0,a.sy);
}
let lastRouteKey='',lastArmy=null,lastPack=null;
function render(opts={}){
 const p=parse();const base='/'+p.slice(0,2).join('/');
 const keepScroll=opts.keep;const anc=keepScroll?captureAnchor():null;
 route=p[0]=='sp'&&p[1]!=null?'sp/'+p[1]:p[0]=='packs'&&p[1]!=null?'packs/'+p[1]:(p[0]||'home');
 let html='';
 const deep=(p[0]=='sp'||p[0]=='packs')&&p[1]!=null?p[2]:(p[0]=='rules'||p[0]=='gloss'?p[1]:null);
 if(!p.length)html=homePage();
 else if(p[0]=='sp'){if(A[p[1]]){if(p[2])armyTab=tabOf(p[2]);else if(!opts.keep&&lastArmy!=p[1])armyTab='a';lastArmy=p[1];html=armyPage(+p[1])}else html=spOverview()}
 else if(p[0]=='packs'){if(PK[p[1]]){if(p[2])packTab=ptabOf(p[2]);else if(!opts.keep&&lastPack!=p[1])packTab='m';lastPack=p[1];html=packPage(+p[1])}else html=packsOverview()}
 else if(p[0]=='rules')html=rulesPage();
 else if(p[0]=='gloss')html=glossPage();
 else if(p[0]=='search'){if(p[1]!=null)searchQ=p[1];html=searchPage()}
 else html=homePage();
 topbar(p);main.innerHTML=html;
 wire();
 if(keepScroll){restoreAnchor(anc)}
 else if(deep)jumpTo(deep,true);
 else window.scrollTo(0,0);
 renderSheet();
}
function jumpTo(key,openIt){
 const e=main.querySelector(`[data-k="${CSS.escape(key)}"]`)||document.getElementById('k-'+key);if(!e)return;
 if(openIt){if(e.tagName=='DETAILS'){e.open=true;open.add(route+'|'+key)}
  // Unit-Karte oder Fähigkeit in Einheit: übergeordnete Details öffnen
  let q=e.parentElement;while(q&&q!==main){if(q.tagName=='DETAILS'){q.open=true;open.add(route+'|'+q.dataset.k)}q=q.parentElement}}
 const y=e.getBoundingClientRect().top+window.scrollY-top.offsetHeight-8;
 window.scrollTo({top:y,behavior:'smooth'});
 e.classList.add('hl');setTimeout(()=>e.classList.remove('hl'),1800);
}
function wire(){
 main.querySelectorAll('details[data-k]').forEach(d=>d.addEventListener('toggle',()=>{const k=route+'|'+d.dataset.k;d.open?open.add(k):open.delete(k)}));
 main.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>{const all=b.dataset.act=='all';main.querySelectorAll('details[data-k]').forEach(d=>{d.open=all;const k=route+'|'+d.dataset.k;all?open.add(k):open.delete(k)})});
 const q=document.getElementById('q');
 if(q){q.oninput=()=>{searchQ=q.value;document.getElementById('sr').innerHTML=runSearch(searchQ);history.replaceState(null,'','#/search/'+encodeURIComponent(searchQ))};if(!searchQ&&!opts_noFocus)setTimeout(()=>q.focus(),50)}
 const gf=document.getElementById('gf');
 if(gf){gf.oninput=()=>{const w=norm(gf.value).split(/\s+/).filter(Boolean);document.querySelectorAll('#gl .gl').forEach(e=>{e.hidden=!w.every(x=>e.dataset.h.includes(x))})}}
 main.querySelectorAll('[data-letter]').forEach(a=>a.onclick=ev=>{ev.preventDefault();const t=main.querySelector(`.gl[data-l="${a.dataset.letter}"]`);if(t){window.scrollTo({top:t.getBoundingClientRect().top+window.scrollY-top.offsetHeight-8,behavior:'smooth'})}});
}
let opts_noFocus=false;
document.addEventListener('click',ev=>{
 const dj=ev.target.closest('[data-j]');if(dj){ev.preventDefault();jumpTo(dj.dataset.j,dj.closest('.cheat')!=null);return}
 const pt=ev.target.closest('[data-ptab]');if(pt){packTab=pt.dataset.ptab;window.scrollTo(0,0);render({keep:true});return}
 const pm=ev.target.closest('[data-pmap]');if(pm){pmap=+pm.dataset.pmap;render({keep:true});return}
 const tb=ev.target.closest('[data-tab]');if(tb){armyTab=tb.dataset.tab;window.scrollTo(0,0);open.size;render({keep:true});return}
 const t=ev.target.closest('a.lk,.lang button,#bk,#hm,#cl,.sheet [data-s],.sheet .x,.back');if(!t)return;
 if(t.matches('a.lk')){ev.preventDefault();
  if(t.dataset.g){sheetId=t.dataset.g;renderSheet()}
  else if(t.dataset.a){const [ai,key]=t.dataset.a.split('|');if(parse()[1]!=ai||parse()[0]!='sp'){location.hash='#/sp/'+ai+'/'+key}else{if(tabOf(key)!=armyTab){armyTab=tabOf(key);render({keep:true})}jumpTo(key,true)}}
  return}
 if(t.id=='bk'){if(history.length>1)history.back();else location.hash='#/';return}
 if(t.id=='hm'){location.hash='#/';return}
 if(t.id=='cl'){try{parent.postMessage('close-rules',location.origin)}catch(e){}return}
 if(t.closest('.lang')){setLang(t.dataset.l);return}
 if(t.matches('.x,.back')){sheetId=null;renderSheet();return}
 if(t.dataset.s){sheetId=null;renderSheet();location.hash=t.dataset.s}
});
function renderSheet(){
 if(!sheetId){sheetEl.innerHTML='';return}
 const g=gById[sheetId];if(!g){sheetEl.innerHTML='';return}
 sheetEl.innerHTML=`<div class="back"></div><div class="sheet" role="dialog" aria-label="${esc(P(g.t))}"><button class="ib x" aria-label="${T('close')}">✕</button><h3>${esc(P(g.t))}</h3><div class="hint">${esc(g.t[1-li()])}</div><p>${linkify(P(g.d),-1)}</p><div class="acts"><button class="btn" data-s="#/rules/${g.s}">${T('toRule')} → ${esc(P(rById[g.s].t))}</button><button class="btn" data-s="#/gloss/${g.id}">${T('toGloss')}</button></div></div>`;
}
function setLang(l){
 if(l==L)return;L=l;try{localStorage.setItem('regeln.lang',L)}catch(e){}
 opts_noFocus=true;INDEX=null;render({keep:true});opts_noFocus=false;
}
window.addEventListener('hashchange',()=>{sheetId=null;render()});
render();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
</body>
</html>
