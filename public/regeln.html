const DATA={"A":[{"i":0,"f":["Städte Sigmars","Cities of Sigmar"],"n":["Zenestras Zeloten","Zenestra's Zealots"],"traits":[{"n":["Schattenhafter Meisterspion","Shadowy Master Spy"],"t":["Die Flüsterklinge wird nicht aufgestellt. Ab Runde 2 darf sie in deiner Bewegungsphase („Plötzlicher Hinterhalt“) innerhalb 6\" um eine feindliche Einheit aufgestellt werden, nicht im Nahkampf.","The Whisperblade is not deployed. From round 2, in your Movement phase (\"Sudden Ambush\"), it can be set up within 6\" of an enemy unit, not in combat."]},{"n":["Fürstin des Rads","Lady of the Wheel"],"t":["Fällt ein befreundetes Modell durch eine Nahkampfattacke, wirf so viele Würfel wie sein Ausdauerwert; je 5+ erleidet die angreifende Einheit 1 tödlichen Schaden (nach dem Kämpfen).","When a friendly model is slain by a melee attack, roll dice equal to its Health; each 5+ inflicts 1 mortal damage on the attacking unit (after the Fight)."]}],"reg":[{"n":["Inbrünstiger Ansturm","Fervent Charge"],"t":["Einmal pro Zug (Armee), Bewegungsphase: Eine Einheit darf Angriff einsetzen, auch wenn sie in diesem Zug gerannt ist.","Once per turn (army), your Movement phase: a friendly unit can use Charge abilities this turn even if it ran."]},{"n":["Wilde Zeloten","Wild Zealots"],"t":["Passiv: +3 auf den Kontrollwert der Freigilden-Stahlhelme.","Passive: +3 to the control score of Freeguild Steelhelms units."]}],"enh":[{"n":["Frommer Befehlshaber","Pious Commander"],"t":["Passiv: +1 Attacken und +1 Wucht der Meisterhaften Waffe des Generals.","Passive: +1 Attacks and +1 Rend on your general's Masterwork Weapon."]},{"n":["Vorwärts!","Forward!"],"t":["Einmal pro Zug, Reaktion auf Rennen einer Nicht-Helden-Einheit nahe dem General: kein Rennenwurf, stattdessen +6 Zoll.","Once per turn, reaction to a Run by a non-Hero unit near the general: no run roll, instead +6\" Move."]},{"n":["Bleibt standhaft, Kameraden","Stand Firm, Comrades"],"t":["Einmal pro Schlacht, Heldenphase: Sichtbare Nicht-Helden-Einheit ga m Zug auch nach einem Rückzug Angriff-Fähigkeiten einsetzen.","Once per battle, your Movement phase: friendly units can use Charge abilities this turn even after retreating."]},{"n":["Verstärkte Konstrukte","Reinforced Constructs"],"t":["Einmal pro Schlacht, beliebige Nahkampfphase: Befreundete Einheit hat bis Zugende Rettung 5+.","Once per battle, any Combat phase: a friendly unit has Ward 5+ until the end of the turn."]}],"enh":[{"n":["Mächtiger Archaeossianer","Mighty Archaeossian"],"t":["Passiv: Der General hat Rettung 5+.","Passive: the general has Ward 5+."]},{"n":["Mörderische Klinge","Murderous Blade"],"t":["Passiv: Die Klinge des Befehlshabers des Generals hat Krit. (2 Treffer).","Passive: the general's Commander's Blade has Crit (2 Hits)."]},{"n":["Herrischer Befehlshaber","Imperious Commander"],"t":["Deine Bewegungsphase: Sichtbare befreundete Einheit ganz innerhalb 12 Zoll um den General: 3+ → +2 Zoll Bewegung bis Zugende.","Your Movement phase: a visible friendly unit wholly within 12\" of the general: on 3+, +2\" Move until the end of the turn."]},{"n":["Kalte Grausamkeit","Cold Cruelty"],"t":["Beliebige Nahkampfphase: Hat der General in diesem Zug nicht angegriffen und ist im Nahkampf: Sichtbare befreundete Einheit ganz innerhalb 12 Zoll: 3+ → +1 Wucht auf Nahkampfwaffen bis Zugende.","Any Combat phase: if the general did not charge this turn and is in combat, a visible friendly unit wholly within 12\": on 3+, +1 Rend on its melee weapons until the end of the turn."]}],"units":[{"n":["Kavalos-Fürst","Kavalos Lord"],"kw":[["Held","Hero"],["Kavallerie","Cavalry"]],"mv":10,"hp":7,"m":1,"sv":3,"cv":2,"wd":6,"b":"80","g":1,"note":null,"rw":[],"mw":[{"n":["Klinge des Befehlshabers","Commander's Blade"],"a":5,"h":3,"w":4,"rd":1,"d":2,"f":"C"},{"n":["Hufe, Zähne und Stachelschwänze des Kavalos-Rosses","Kavalos Steed's Hooves, Teeth and Spiked Tails"],"a":4,"h":5,"w":3,"rd":0,"d":1,"f":"G"}],"ab":[{"n":["Signal zum Angriff","Signal to Charge"],"t":["Heldenphase: Sichtbare befreundete Einheit ganz innerhalb 12 Zoll: 3+ → +1 auf Angriffswürfe bis Zugende.","Hero phase: a visible friendly unit wholly within 12\": on 3+, +1 to charge rolls until the end of the turn."]}]},{"n":["Kavalos-Todesreiter","Kavalos Deathriders"],"kw":[["Kavallerie","Cavalry"]],"mv":10,"hp":3,"m":5,"sv":4,"cv":1,"wd":6,"b":"60x35","g":0,"note":null,"rw":[],"mw":[{"n":["Kavalos-Klinge","Kavalos Blade"],"a":3,"h":3,"w":4,"rd":1,"d":1,"f":""},{"n":["Hufe und Zähne","Hooves and Teeth"],"a":2,"h":5,"w":3,"rd":0,"d":1,"f":"G"}],"ab":[{"n":["Kehrtwende","About Face"],"t":["Nahkampfphase: Hat die Einheit in diesem Zug angegriffen: 3+ → sie bewegt sich bis zu ihrer Bewegung (auch durch feindliche Nahkampfreichweite), darf aber nicht im Nahkampf enden.","Combat phase: if the unit charged this turn, on 3+ it moves up to its Move, through enemy engagement range, but must not end in combat."]}]},{"n":["Teratische Kohorte","Teratic Cohort"],"kw":[["Bestie","Beast"],["Verstärkung","Reinforcements"]],"mv":7,"hp":1,"m":8,"sv":5,"cv":1,"wd":6,"b":"32","g":0,"note":null,"rw":[],"mw":[{"n":["Kohortenwaffen","Cohort Weapons"],"a":2,"h":3,"w":4,"rd":1,"d":1,"f":""}],"ab":[{"n":["Wild bis in die Knochen","Wild to the Bone"],"t":["Bewegungsphase: Die Einheit darf sich 3 Zoll bewegen, auch in den Nahkampf.","Movement phase: the unit may move 3\", including into combat."]}]}]},{"i":32,"f":["Knochenlegionen der Ossiarch","Ossiarch Bonereapers"],"n":["Zwangsvollstrecker-Echelon","Enforcer Echelon"],"traits":[{"n":["Ossiarch-Befehle","Ossiarch Commands"],"t":["Zu Beginn der Schlachtrunde erhältst du 2 Ossiarch-Befehlspunkte. Jeder Einsatz eines Ossiarch-Befehls kostet 1 Punkt; jede Einheit kann pro Phase höchstens einen Ossiarch-Befehl einsetzen. Am Ende der Schlachtrunde verfallen übrige Punkte.","At the start of the battle round you receive 2 Ossiarch Command points. Each use of an Ossiarch Command costs 1 point; each unit can use no more than one Ossiarch Command per phase. Unused points are lost at the end of the battle round."]},{"n":["Reservekontingent","Reserve Contingent"],"t":["Eine deiner Mortek-Garde-Einheiten wird nicht aufgestellt. Ab der dritten Schlachtrunde: Deine Bewegungsphase, Ankunft des Kontingents: Stelle sie vollständig innerhalb von 3 Zoll um eine Schlachtfeldkante und weiter als 6 Zoll von allen Feinden auf.","One of your Mortek Guard units is not set up. From the third battle round, your Movement phase, Arrival of the Contingent: set it up wholly within 3\" of a battlefield edge and more than 6\" from all enemy units."]}],"reg":[{"n":["Undurchdringliche Reihen","Impenetrable Ranks"],"t":["Einmal pro Schlacht, beliebige Nahkampfphase, Ossiarch-Befehl: Befreundete Einheit: Addiere bis zum Ende der Phase 1 zu Rettungswürfen jener Einheit.","Once per battle, any Combat phase, Ossiarch Command: a friendly unit: add 1 to its ward rolls until the end of the phase."]},{"n":["Neuformierung","Reform"],"t":["Einmal pro Schlacht, deine Bewegungsphase, Ossiarch-Befehl: Eine befreundete Mortek-Garde-Einheit im Nahkampf kann in dieser Phase eine Rückzug-Fähigkeit einsetzen, ohne dass ihr tödlicher Schaden zugefügt wird.","Once per battle, your Movement phase, Ossiarch Command: a friendly Mortek Guard unit in combat can use a Retreat ability this phase without suffering mortal damage."]}],"enh":[{"n":["Nadiritwaffen verstärken","Reinforce Nadirite Weapons"],"t":["Deine Heldenphase: Sichtbare befreundete Mortek-Garde-Einheit ganz innerhalb 12 Zoll um den General: 2W6-Zauberwurf; bei 5+ +1 Wucht auf Nahkampfwaffen bis zum Beginn deines nächsten Zuges.","Your Hero phase: a visible friendly Mortek Guard unit wholly within 12\" of the general: 2D6 casting roll; on 5+, +1 Rend on its melee weapons until the start of your next turn."]},{"n":["Unaufhaltbarer Befehlshaber","Unstoppable Commander"],"t":["Deine Bewegungsphase: Befreundete Mortek-Garde-Einheit ganz innerhalb 12 Zoll um den General: W6 2+ → +3 Zoll Bewegung in dieser Phase.","Your Movement phase: a friendly Mortek Guard unit wholly within 12\" of the general: D6 2+: +3\" Move this phase."]},{"n":["Mörderischer Angriff","Murderous Charge"],"t":["Passiv: Die Seelenernter-Sense des Generals hat Krit. (2 Treffer).","Passive: the general's Soulreaper Scythe has Crit (2 Hits)."]},{"n":["Markpakt","Mark Pact"],"t":["Passiv: Heile (X) den General jedes Mal, wenn er eine Kämpfen-Fähigkeit einsetzt, nachdem alle seine Attacken abgehandelt wurden; X = zugewiesene Schadenspunkte.","Passive: heal (X) the general each time it uses a Fight ability after all its attacks are resolved; X = damage points allocated."]}],"units":[{"n":["Mortisan-Seelenernter","Mortisan Soulreaper"],"kw":[["Held","Hero"],["Zauberer","Wizard"],["Infanterie","Infantry"]],"mv":5,"hp":5,"m":1,"sv":4,"cv":2,"wd":6,"b":"32","g":1,"note":null,"rw":[],"mw":[{"n":["Seelenernter-Sense","Soulreaper Scythe"],"a":3,"h":4,"w":3,"rd":2,"d":2,"f":""}],"ab":[{"n":["Lebenskraft absaugen (Ossiarch-Befehl)","Drain Life Force (Ossiarch Command)"],"t":["Heldenphase: Sichtbare feindliche Einheit innerhalb 18 Zoll: 2W6-Zauberwurf; bei 6+ −1 auf Trefferwürfe ihrer Attacken bis zum Beginn deines nächsten Zuges.","Hero phase: a visible enemy unit within 18\": 2D6 casting roll; on 6+, −1 to hit rolls for its attacks until the start of your next turn."]},{"n":["Knochen flicken (Ossiarch-Befehl)","Patch Bones (Ossiarch Command)"],"t":["Deine Bewegungsphase: Befreundete Einheit ganz innerhalb 12 Zoll, nicht im Nahkampf: Heile (W3) das Ziel; hat es keinen Schaden, kehren stattdessen getötete Modelle mit einem kombinierten Ausdauerwert von W3 oder weniger zurück.","Your Movement phase: a friendly unit wholly within 12\" and not in combat: heal (D3) the target; if it has no damage, return slain models with a combined Health of D3 or less instead."]}]},{"n":["Mortek-Garde","Mortek Guard"],"kw":[["Infanterie","Infantry"]],"mv":4,"hp":1,"m":10,"sv":4,"cv":1,"wd":6,"b":"25","g":0,"note":null,"rw":[],"mw":[{"n":[ ombat with this unit is slain, it gains 1 Bone Tithe point (maximum 6)."]},{"n":["Konstrukt reparieren","Repair Construct"],"t":["Ende eines beliebigen Zugs: Wähle eine befreundete Mortek-Garde-Einheit innerhalb 6 Zoll; würfle je Knochentribut-Punkt: Für jede 4+ kehrt 1 getötetes Modell zurück. Setze dann die Knochentribut-Punkte auf 0.","End of any turn: pick a friendly Mortek Guard unit within 6\"; roll a dice per Bone Tithe point: for each 4+, return 1 slain model. Then set the Bone Tithe points to 0."]}]}]},{"i":33,"f":["Knochenlegionen der Ossiarch","Ossiarch Bonereapers"],"n":["Mortisan-Elite","Mortisan Elite"],"traits":[{"n":["Unerbittliche Disziplin","Relentless Discipline"],"t":["Einmal pro Phase (Armee): Wähle eine befreundete Einheit; W6 (+1 wenn ganz innerhalb 12 Zoll um den General): bei 4+ ein Effekt – Bewegungsphase: +2 Zoll Bewegung; Angriffsphase: +1 auf Angriffswürfe; Nahkampfphase: +1 auf Verwundungswürfe im Nahkampf oder Rettung 5+ (für die Phase).","Once per phase (army): pick a friendly unit; D6 (+1 if wholly within 12\" of the general): on 4+ one effect – Movement phase: +2\" Move; Charge phase: +1 to charge rolls; Combat phase: +1 to melee wound rolls or Ward 5+ (for the phase)."]},{"n":["Herolde des Nagasch","Heralds of Nagash"],"t":["Passiv: Addiere 1 zu Disziplin-Würfen für diese Einheit, solange sie nicht ganz innerhalb 12 Zoll um deinen General ist. Die Einheit wird nicht aufgestellt; ab der zweiten Schlachtrunde, einmal pro Zug (Armee), deine Bewegungsphase (Schrecklicher Sinkflug): Stelle sie weiter als 6 Zoll von allen Feinden auf.","Passive: add 1 to Discipline rolls for this unit while it is not wholly within 12\" of your general. The unit is not set up; from the second battle round, once per turn (army), your Movement phase (Terrible Swoop): set it up more than 6\" from all enemy units."]}],"reg":[{"n":["Unvergleichlicher Zusammenhalt","Peerless Cohesion"],"t":["Einmal pro Zug (Armee), Reaktion: Du sagst „Unerbittliche Disziplin“ an: Du kannst die Fähigkeit in dieser Phase ein zweites Mal einsetzen, musst aber ein anderes Ziel wählen.","Once per turn (army), reaction: you declare \"Relentless Discipline\": you can use that ability a second time this phase, but must pick a different target."]},{"n":["Makellose Feldherrenkunst","Flawless Generalship"],"t":["Passiv: Addiere 1 auf Disziplin-Würfe, die du ausführst.","Passive: add 1 to Discipline rolls you make."]}],"enh":[{"n":["Knochensplittersturm","Bone Splinter Storm"],"t":["Deine Heldenphase: Sichtbare feindliche Einheit innerhalb 12 Zoll um den General: 2W6-Zauberwurf; bei 7+ wirf je Modell der Zieleinheit einen Würfel; für jede 5+ 1 tödlicher Schaden.","Your Hero phase: a visible enemy unit within 12\" of the general: 2D6 casting roll; on 7+ roll a dice per model in the target unit; for each 5+ inflict 1 mortal damage."]},{"n":["Konstrukte ausbessern","Mend Constructs"],"t":["Deine Heldenphase: Sichtbare befreundete Einheit ganz innerhalb 12 Zoll um den General: 2W6-Zauberwurf; bei 6+ heile (W3) das Ziel.","Your Hero phase: a visible friendly unit wholly within 12\" of the general: 2D6 casting roll; on 6+ heal (D3) the target."]},{"n":["Erz der Sättigung","Ore of Saturation"],"t":["Passiv: Subtrahiere 1 vom Wuchtwert von Nahkampfwaffen, mit denen Nahkampfattacken gegen den General ausgeführt werden.","Passive: subtract 1 from the Rend of melee weapons used to make attacks against the general."]},{"n":["Helm der Tyrannei","Helm of Tyranny"],"t":["Einmal pro Schlacht, Ende deines Zugs: Feindliche Einheit innerhalb 12 Zoll um den General: W6 3+ → −3 Kontrollwert bis Zugende.","Once per battle, end of your turn: an enemy unit within 12\" of the general: D6 3+: −3 Control until the end of the turn."]}],"units":[{"n":["Mortisan-Knochenbildner","Mortisan Boneshaper"],"kw":[["Held","Hero"],["Zauberer","Wizard"],["Infanterie","Infantry"]],"mv":5,"hp":5,"m":1,"sv":4,"cv":2,"wd":6,"b":"32","g":1,"note":null,"rw":[],"mw":[{"n":["Knöcherne Krallen","Bo nheiten wieder auf.","Once per battle, start of the first battle round: pick up to 2 friendly units. Remove them from the battlefield and set them up again more than 6\" from all enemy units."]},{"n":["Fŷrstahl-Wurfaxt","Fyrsteel Throwing Axe"],"t":["Einmal pro Zug (Armee), deine Fernkampfphase: Wähle beliebig viele befreundete Einheiten, die nicht im Nahkampf und innerhalb von 10 Zoll um mindestens eine feindliche Einheit sind: Wähle je eine sichtbare feindliche Einheit innerhalb von 10 Zoll und wirf einen Würfel; bei 4+ erleidet sie W3 tödlichen Schaden.","Once per turn (Army), your Shooting phase: pick any number of friendly units not in combat and within 10\" of an enemy unit: pick a visible enemy unit within 10\" for each and roll a dice; on a 4+ it suffers D3 mortal damage."]}],"enh":[{"n":["Zu stur zum Sterben","Too Stubborn to Die"],"t":["Beginn eines beliebigen Zuges: Heile (W3) deinen General.","Start of any turn: heal (D3) your general."]},{"n":["Aura der Macht","Aura of Power"],"t":["Passiv: Addiere 3 zum Kontrollwert deines Generals.","Passive: add 3 to your general's Control."]},{"n":["Grimnirhorn","Grimnir's Horn"],"t":["Deine Heldenphase: Dein General (nicht im Nahkampf): Wirf einen Würfel für jede befreundete Einheit, aus der Modelle zerstört sind; bei 3+ kannst du 1 zerstörtes Modell in die Einheit zurückbringen.","Your Hero phase: your general (not in combat): roll a dice for each friendly unit that has lost models; on a 3+ you can return 1 slain model to the unit."]},{"n":["Grimnirs Geist","Spirit of Grimnir"],"t":["Passiv: Du kannst Aktivierungswürfe für „Die Runen erwecken“ wiederholen.","Passive: you can re-roll activation rolls for \"Awaken the Runes\"."]}],"units":[{"n":["Schlachtenschmied","Battlesmith"],"kw":[["Held","Hero"],["Infanterie","Infantry"]],"mv":4,"hp":5,"m":1,"sv":5,"cv":5,"wd":6,"b":"32","g":1,"note":null,"rw":[],"mw":[{"n":["Streitaxt der Ahnen","Ancestral Waraxe"],"a":5,"h":3,"w":3,"rd":1,"d":2,"f":""}],"ab":[{"n":["Ikone de er Finsternis","Slaves to Darkness"],"n":["Bluthauchlegion","Bloodbreath Legion"],"traits":[{"n":["Auge der Götter","Eye of the Gods"],"t":["Einmal pro Zug, Ende eines beliebigen Zuges: Wähle eine befreundete Einheit, die ein Ziel beansprucht, das dein Gegner nicht kontrolliert, und die nicht im Nahkampf ist, oder die in diesem Zug eine feindliche Einheit zerstört hat. Würfle auf der Tabelle: 1 Kein Effekt; 2 Schutz des Tzeentch (Rettung 6+); 3 Anmut des Slaanesh (+1 auf Rennenwürfe); 4 Segen des Nurgle (−1 auf Verwundungswürfe gegen die Einheit); 5 Wut des Khorne (+1 Wucht der Nahkampfwaffen); 6 Champion des Chaos (beliebige Fähigkeit). Die Einheit behält die Fähigkeiten dauerhaft, Effekte sind nicht kumulativ.","Once per turn, end of any turn: Pick a friendly unit that is contesting an objective your opponent does not control and is not in combat, or that destroyed an enemy unit this turn. Roll on the table: 1 No effect; 2 Protection of Tzeentch (Ward 6+); 3 Grace of Slaanesh (+1 to run rolls); 4 Blessing of Nurgle (−1 to wound rolls for attacks targeting the unit); 5 Wrath of Khorne (+1 Rend for the unit's melee weapons); 6 Champion of Chaos (choose any ability). The unit keeps its abilities for the rest of the battle; effects do not stack."]}],"reg":[{"n":["Schreckensbanner","Banner of Terror"],"t":["Einmal pro Schlacht, Beginn der ersten Schlachtrunde: Wähle eine befreundete Chaoskrieger- oder Chaosritter-Einheit: Du kannst sofort einen Wurf auf der „Auge der Götter“-Tabelle für jene Einheit ausführen.","Once per battle, start of the first battle round: Pick a friendly Chaos Warriors or Chaos Knights unit: you can immediately roll on the Eye of the Gods table for that unit."]},{"n":["Dunkle Eroberer","Dark Conquerors"],"t":["Passiv: Addiere 3 auf den Kontrollwert befreundeter Chaoskrieger-Einheiten.","Passive: Add 3 to the control score of friendly Chaos Warriors units."]}],"enh":[{"n":["Mal des Khorne","Mark of Khorne"],"t":["Passiv: Addiere 1 auf den Wuchtwert der Nahkampfwaffen deines Generals, wenn er im selben Zug angegriffen hat.","Passive: Add 1 to the Rend of your general's melee weapons if it charged in the same turn."]},{"n":["Mal des Tzeentch","Mark of Tzeentch"],"t":["Einmal pro Schlacht, deine Bewegungsphase: Wähle eine befreundete Einheit auf dem Schlachtfeld (nicht deinen General). Entferne sie vom Schlachtfeld und stelle sie vollständig innerhalb von 6 Zoll um deinen General und weiter als 6 Zoll von allen feindlichen Einheiten wieder auf. Sie kann für den Rest der Phase keine Bewegung-Fähigkeiten einsetzen.","Once per battle, your movement phase: Pick a friendly unit on the battlefield (not your general). Remove it from the battlefield and set it up again wholly within 6\" of your general and more than 6\" from all enemy units. It cannot use Move abilities for the rest of the phase."]},{"n":["Mal des Nurgle","Mark of Nurgle"],"t":["Passiv: Subtrahiere 1 von Verwundungswürfen für Nahkampfattacken, deren Ziel dein General ist.","Passive: Subtract 1 from wound rolls for melee attacks that target your general."]},{"n":["Mal des Slaanesh","Mark of Slaanesh"],"t":["Passiv: Dein General hat Kämpft zuerst.","Passive: Your general has Strikes First."]}],"units":[{"n":["Kriegsherr des Chaos","Chaos Warlord"],"kw":[["Held","Hero"],["Infanterie","Infantry"]],"mv":5,"hp":6,"m":1,"sv":3,"cv":2,"wd":0,"b":"40","g":1,"note":null,"rw":[],"mw":[{"n":["Schnitterklinge","Reaper Blade"],"a":5,"h":3,"w":3,"rd":1,"d":2,"f":"T"}],"ab":[{"n":["Günstling des Pantheons","Favoured of the Pantheon"],"t":["Deine Heldenphase: Wirf einen Würfel. Bei 4+ kannst du für diese Einheit auf der „Auge der Götter“-Tabelle würfeln.","Your hero phase: Roll a dice. On a 4+, you can roll on the Eye of the Gods table for this unit."]},{"n":["Entschlossener Champion","Determined Champion"],"t":["Beliebige Nahkampfphase: Wähle eine befreundete Einheit ganz innerhalb von 12 Zoll um diese Einheit (nicht diese Einheit) und wirf einen Würfel. Bei 2+ addiere in dieser Phase 1 auf Trefferwürfe für Attacken der Zieleinheit.","Any combat phase: Pick a friendly unit wholly within 12\" of this unit (not this unit) and roll a dice. On a 2+, add 1 to hit rolls for attacks made by the target unit in this phase."]}]},{"n":["Streitwagen des Chaos","Chaos Chariot"],"kw":[["Kriegsmaschine","War Machine"]],"mv":10,"hp":7,"m":1,"sv":4,"cv":2,"wd":0,"b":"120x92","g":0,"note":null,"rw":[],"mw":[{"n":["Chaos-Kriegsflegel","Chaos War Flail"],"a":6,"h":3,"w":3,"rd":0,"d":1,"f":""},{"n":["Geißelnde Peitsche des Fahrers","Driver's Lashing Whip"],"a":2,"h":4,"w":4,"rd":0,"d":1,"f":""},{"n":["Trampelnde Hufe des Streitrosses","Trampling Hooves of the Steed"],"a":4,"h":5,"w":3,"rd":0,"d":1,"f":"G"}],"ab":[{"n":["Schneller Tod","Swift Death"],"t":["Deine Angriffsphase: Hat diese Einheit in dieser Phase angegriffen, wähle eine feindliche Einheit innerhalb von 1 Zoll als Ziel und wirf einen Würfel. Bei 2+ füge dem Ziel W3 tödlichen Schaden zu.","Your charge phase: If this unit charged in this phase, pick an enemy unit within 1\" as the target and roll a dice. On a 2+, inflict D3 mortal damage on the target."]}]},{"n":["Chaoskrieger","Chaos Warriors"],"kw":[["Infanterie","Infantry"]],"mv":5,"hp":2,"m":5,"sv":3,"cv":1,"wd":0,"b":"32","g":0,"note":null,"rw":[],"mw":[{"n":["Runengravierte Hellebarde","Rune-etched Halberd"],"a":2,"h":3,"w":3,"rd":1,"d":1,"f":""}],"ab":[{"n":["Boten der Vernichtung","Heralds of Ruin"],"t":["Passiv: Addiere 1 auf Verwundungswürfe für Nahkampfattacken dieser Einheit gegen eine feindliche Einheit, die ein Ziel beansprucht, das du nicht kontrollierst.","Passive: Add 1 to wound rolls for melee attacks made by this unit against an enemy unit that is contesting an objective you do not control."]}]},{"n":["Chaosritter","Chaos Knights"],"kw":[["Kavallerie","Cavalry"]],"mv":10,"hp":4,"m":5,"sv":3,"cv":1,"wd":0,"b":"75x42","g":0,"note":null,"rw":[],"mw":[{"n":["Verfluchte Lanze","Cursed Lance"],"a":3,"h":3,"w":3,"rd":1,"d":1,"f":"C"},{"n":["Trampelnde Hufe des Chaosrosses","Trampling Hooves of the Chaos Steed"],"a":2,"h":5,"w":3,"rd":0,"d":1,"f":"G"}],"ab":[{"n":["Im Angriff aufgespießt","Impaled on the Charge"],"t":["Passiv: Addiere 1 auf den Wuchtwert der Verfluchten Lanzen dieser Einheit, wenn sie im selben Zug angegriffen hat.","Passive: Add 1 to the Rend of this unit's Cursed Lances if it charged in the same turn."]}]}]},{"i":41,"f":["Sklaven der Finsternis","Slaves to Darkness"],"n":["Finsterschwur-Plünderer","Darkoath Raiders"],"traits":[{"n":["Schwüre der Finsternis","Oaths of Darkness"],"t":["Einmal pro Zug (Armee), deine Heldenphase: Du kannst deinem Gegner 1 Taktikkarte von deiner Hand zeigen. Dann wird sie dein Schwur für den Rest des Zugs. Schließt du ihr Taktisches Vorhaben in diesem Zug ab, ist dein Schwur erfüllt: Statt die Karte abzulegen, legst du sie zur Seite (zählt nicht gegen die 3 Karten auf der Hand) und kannst ihren Befehl weiterhin einsetzen; dann wird sie wie üblich abgelegt. Setzt du den Befehl vor dem Abschluss ein, wird die Karte wie üblich abgelegt.","Once per turn (army), your hero phase: You can show your opponent 1 tactic card from your hand. It becomes your oath for the rest of the turn. If you complete its tactic this turn, your oath is fulfilled: instead of discarding the card, set it aside (it does not count against the 3 cards in your hand) and you can still use its command; then it is discarded as usual. If you use the command before completing it, the card is discarded as usual."]}],"reg":[{"n":["Arkhars Wut","Arkhar's Fury"],"t":["Einmal pro Zug (Armee), beliebige Nahkampfphase: Wähle eine befreundete Einheit im Nahkampf: Addiere für den Rest des Zugs 1 auf den Wuchtwert und den Attackenwert der Nahkampfwaffen des Ziels (nicht Begleiter-Waffen).","Once per turn (army), any combat phase: Pick a friendly unit in combat: add 1 to the Rend and 1 to the Attacks of the target's melee weapons for the rest of the turn (not Companion weapons)."]},{"n":["Furchtlose Invasoren","Fearless Invaders"],"t":["Einmal pro Zug (Armee), deine Bewegungsphase: Wähle eine befreundete Einheit im Nahkampf: Setzt das Ziel in diesem Zug eine Rückzug-Fähigkeit ein, wird ihm kein tödlicher Schaden zugefügt und es kann später in diesem Zug noch Angriff-Fähigkeiten einsetzen.","Once per turn (army), your movement phase: Pick a friendly unit in combat: if the target uses a Retreat ability this turn, no mortal damage is inflicted on it and it can use Charge abilities later this turn."]}],"enh":[{"n":["Blutrünstige Klinge","Bloodthirsty Blade"],"t":["Passiv: Der Wuchtwert der Runengravierten Axt deiner Generalin ist 2.","Passive: The Rend of your general's Rune-etched Axe is 2."]},{"n":["Götterschattentalisman","Godshadow Talisman"],"t":["Passiv: Deine Generalin hat Rettung (4+).","Passive: Your general has Ward (4+)."]},{"n":["Überfallchampion","Champion of the Raid"],"t":["Deine Angriffsphase: Wähle eine andere befreundete Einheit ganz innerhalb von 12 Zoll um deine Generalin: Das Ziel kann für den Rest des Zugs Angriffswürfe wiederholen.","Your charge phase: Pick another friendly unit wholly within 12\" of your general: the target can re-roll charge rolls for the rest of the turn."]},{"n":["Grausamer Ritualist","Cruel Ritualist"],"t":["Passiv: Jedes Mal, wenn du Taktikkarten ziehst, kannst du, sofern deine Generalin auf dem Schlachtfeld ist, 1 zusätzliche Taktikkarte ziehen und dann 1 Taktikkarte deiner Hand unter dein Taktikdeck legen.","Passive: Each time you draw tactic cards, if your general is on the battlefield, you can draw 1 additional tactic card and then put 1 tactic card from your hand on the bottom of your tactic deck."]}],"units":[{"n":["Finsterschwur-Kriegskönigin","Darkoath Warqueen"],"kw":[["Heldin","Hero"],["Infanterie","Infantry"]],"mv":5,"hp":5,"m":1,"sv":5,"cv":2,"wd":5,"b":"32","g":1,"note":null,"rw":[],"mw":[{"n":["Runengravierte Axt","Rune-etched Axe"],"a":5,"h":4,"w":3,"rd":1,"d":2,"f":"T"}],"ab":[{"n":["Schwur der Überlegenheit","Oath of Superiority"],"t":["Deine Heldenphase: Wähle eine befreundete Einheit ganz innerhalb von 12 Zoll um deine Generalin: Addiere bis zum Beginn deines nächsten Zuges 1 auf Trefferwürfe für Attacken des Ziels.","Your hero phase: Pick a friendly unit wholly within 12\" of your general: add 1 to hit rolls for attacks made by the target until the start of your next turn."]}]},{"n":["Finsterschwur-Zerreißer","Darkoath Wrathmongers"],"kw":[["Infanterie","Infantry"]],"mv":5,"hp":1,"m":10,"sv":5,"cv":1,"wd":0,"b":"32","g":0,"note":null,"rw":[],"mw":[{"n":["Finsterschwur-Waffen","Darkoath Weapons"],"a":2,"h":4,"w":3,"rd":0,"d":1,"f":"T"}],"ab":[{"n":["Visionen des Ruhms","Visions of Glory"],"t":["Deine Heldenphase: 1 Modell dieser Einheit ist ein Gottessprecher. Wirf 8 Würfel. Für jede 4+ kannst du bis zum Beginn deines nächsten Zuges 1 Trefferwurf, 1 Verwundungswurf, 1 Rennenwurf oder 1 Schutzwurf für diese Einheit wiederholen.","Your hero phase: 1 model in this unit is a Soothsayer. Roll 8 dice. For each 4+, until the start of your next turn you can re-roll 1 hit roll, 1 wound roll, 1 run roll or 1 save roll for this unit."]}]},{"n":["Finsterschwur-Grauensreiter","Darkoath Dreadriders"],"kw":[["Kavallerie","Cavalry"],["Verstärkung","Reinforcements"]],"mv":12,"hp":3,"m":5,"sv":5,"cv":1,"wd":0,"b":"60x35","g":0,"note":null,"rw":[],"mw":[{"n":["Grauensreiter-Klingen","Dreadrider Blades"],"a":2,"h":4,"w":3,"rd":0,"d":1,"f":"C"},{"n":["Hufe des Kriegsrosses","Warhorse's Hooves"],"a":2,"h":5,"w":3,"rd":0,"d":1,"f":"G"}],"ab":[{"n":["Schnelle Angreifer","Swift Raiders"],"t":["Passiv: Subtrahiere 1 von Trefferwürfen für Fernkampfattacken, deren Ziel diese Einheit ist.","Passive: Subtract 1 from hit rolls for shooting attacks that target this unit."]}]},{"n":["Finsterschwur-Barbaren","Darkoath Marauders"],"kw":[["Infanterie","Infantry"],["Verstärkung","Reinforcements"]],"mv":5,"hp":1,"m":10,"sv":5,"cv":1,"wd":0,"b":"28.5","g":0,"note":null,"rw":[],"mw":[{"n":["Plündererwaffen","Raider Weapons"],"a":2,"h":4,"w":3,"rd":0,"d":1,"f":""}],"ab":[{"n":["Glorreicher Tod","Glorious Death"],"t":["Passiv: Wirf jedes Mal einen Würfel, wenn ein Modell dieser Einheit durch eine Nahkampfattacke getötet wird und im Nahkampf mit der attackierenden Einheit war. Bei 5+ füge der attackierenden Einheit 1 tödlichen Schaden zu, nachdem die Kämpfen-Fähigkeit abgehandelt wurde.","Passive: Roll a dice each time a model in this unit is slain by a melee attack and was in combat with the attacking unit. On a 5+, inflict 1 mortal damage on the attacking unit after the Fight ability has been resolved."]}]}]},{"i":42,"f":["Tiefenvolk der Idoneth","Idoneth Deepkin"],"n":["Seelenraubgesellschaft","Soulraid Hunt"],"traits":[{"n":["Tiden des Todes","Tides of Death"],"t":["In jeder Schlachtrunde haben alle befreundeten Einheiten die passive Fähigkeit, die der Rundennummer zugeordnet ist: Runde 1 Das Wasser steigt: −1 auf Trefferwürfe für Fernkampfattacken, deren Ziel die Einheit ist. Runde 2 Die Flut bricht herein: Die Einheit kann eine Rennen-Fähigkeit einsetzen und trotzdem später noch Fernkampf- und/oder Angriff-Fähigkeiten einsetzen. Runde 3 Macht der Sturmflut: Die Einheit hat Kämpft zuerst. Runde 4 Die Flut ebbt ab: Die Einheit kann eine Rückzug-Fähigkeit einsetzen und trotzdem später noch Fernkampf- und/oder Angriff-Fähigkeiten einsetzen.","In each battle round, all friendly units have the passive ability matching the round number: Round 1 The Waters Rise: subtract 1 from hit rolls for shooting attacks that target the unit. Round 2 The Flood Breaks: the unit can use a Run ability and still use Shoot and/or Charge abilities later this turn. Round 3 Power of the Storm Surge: the unit has Strikes First. Round 4 The Tide Ebbs: the unit can use a Retreat ability and still use Shoot and/or Charge abilities later this turn."]}],"reg":[{"n":["Weg der hereinbrechenden Welle","Way of the Crashing Wave"],"t":["Passiv: Addiere 1 auf den Wuchtwert der Nahkampfwaffen befreundeter Namarti-Schwertknechte-Einheiten, die im selben Zug angegriffen haben.","Passive: Add 1 to the Rend of the melee weapons of friendly Namarti Thralls units that charged in the same turn."]},{"n":["Schleiersee-Raubfische","Veilsea Raiders"],"t":["Einmal pro Zug (Armee), Ende eines beliebigen Zuges: Wähle eine befreundete Kavallerie-Einheit, die in diesem Zug eine Kämpfen-Fähigkeit eingesetzt hat: Heile (W3) jene Einheit.","Once per turn (army), end of any turn: Pick a friendly Cavalry unit that used a Fight ability this turn: heal (D3) that unit."]}],"enh":[{"n":["Erzritualist","Arch-ritualist"],"t":["Passiv: Addiere 1 auf Würfe für die Fähigkeit „Ritual des schleichenden Nebels“ deines Generals.","Passive: Add 1 to rolls for your general's Ritual of the Creeping Mist ability."]},{"n":["Stahlausterpanzer","Steel Oyster Armour"],"t":["Passiv: Ignoriere alle Modifikatoren auf Schutzwürfe deines Generals (positive und negative).","Passive: Ignore all modifiers to your general's save rolls (positive and negative)."]},{"n":["Geistesfeuer","Spirit Fire"],"t":["Einmal pro Schlacht, beliebige Nahkampfphase: Wähle eine feindliche Einheit im Nahkampf mit deinem General: Bis zum Ende der Phase erzielen Attacken jener Einheit Treffer nur bei einem unmodifizierten Trefferwurf von 6.","Once per battle, any combat phase: Pick an enemy unit in combat with your general: until the end of the phase, attacks made by that unit only hit on an unmodified hit roll of 6."]},{"n":["Köstliche Leckerbissen","Delicious Morsels"],"t":["Deine Heldenphase: Heile (1) jede befreundete Kavallerie-Einheit in Nahkampfreichweite deines Generals.","Your hero phase: Heal (1) each friendly Cavalry unit within combat range of your general."]}],"units":[{"n":["Isharann-Seelenfinder","Isharann Soulscryer"],"kw":[["Held","Hero"],["Infanterie","Infantry"]],"mv":6,"hp":5,"m":1,"sv":5,"cv":2,"wd":0,"b":"32","g":1,"note":null,"rw":[{"n":["Orakelfischschwarm","Oracle Fish Swarm"],"r":10,"a":8,"h":5,"w":5,"rd":0,"d":1,"f":"B"}],"mw":[{"n":["Berührung des Abgrunds","Touch of the Abyss"],"a":3,"h":3,"w":4,"rd":0,"d":["W3","D3"],"f":""}],"ab":[{"n":["Ritual des schleichenden Nebels","Ritual of the Creeping Mist"],"t":["Deine Heldenphase: Wähle eine sichtbare befreundete Einheit ganz innerhalb von 12 Zoll um diese Einheit und wirf einen Würfel. Bei 3+ subtrahiere bis zum Beginn deines nächsten Zuges 1 von Verwundungswürfen für Attacken, deren Ziel jene Einheit ist.","Your hero phase: Pick a visible friendly unit wholly within 12\" of this unit and roll a dice. On a 3+, until the start of your next turn subtract 1 from wound rolls for attacks that target that unit."]}]},{"n":["Akhelianer-Morrsarrgarde","Akhelian Morrsarr Guard"],"kw":[["Kavallerie","Cavalry"],["Fliegen","Fly"]],"mv":14,"hp":4,"m":3,"sv":4,"cv":1,"wd":0,"b":"60x35","g":0,"note":null,"rw":[],"mw":[{"n":["Voltspeer","Voltspear"],"a":2,"h":3,"w":4,"rd":1,"d":1,"f":"C"},{"n":["Zähne und Schwanz des Fangmoras","Fangmora's Teeth and Tail"],"a":3,"h":4,"w":3,"rd":1,"d":["W3","D3"],"f":"G"}],"ab":[{"n":["Biovoltaischer Schlag (Seelenraubgesellschaft)","Biovoltaic Blast (Soulraid Company)"],"t":["Einmal pro Schlacht, beliebige Angriffsphase: Hat diese Einheit in dieser Phase angegriffen, wähle eine feindliche Einheit innerhalb von 1 Zoll als Ziel und wirf eine Anzahl Würfel gleich der Anzahl Modelle dieser Einheit. Für jede 4-5 füge dem Ziel 1 tödlichen Schaden zu, für jede 6+ W3 tödlichen Schaden. Addiere 1 zu jedem Wurf, wenn die Zieleinheit aus mehr Modellen besteht als diese Einheit.","Once per battle, any charge phase: If this unit charged in this phase, pick an enemy unit within 1\" as the target and roll a number of dice equal to the number of models in this unit. For each 4-5, inflict 1 mortal damage on the target. For each 6+, inflict D3 mortal damage. Add 1 to each roll if the target unit has more models than this unit."]},{"n":["Biovoltaischer Schlag (Akhelianer-Flutgarde)","Biovoltaic Blast (Akhelian Tidal Guard)"],"t":["Einmal pro Schlacht, beliebige Angriffsphase: Hat diese Einheit in dieser Phase angegriffen, wähle eine feindliche Einheit innerhalb von 1 Zoll als Ziel und wirf eine Anzahl Würfel gleich der Anzahl Modelle dieser Einheit. Addiere 1 zu jedem Ergebnis, wenn die Zieleinheit mehr Modelle hat als diese Einheit. Für jedes Ergebnis von 3+ füge dem Ziel 1 tödlichen Schaden zu.","Once per battle, any charge phase: If this unit charged this phase, pick an enemy unit within 1\" as the target and roll a number of dice equal to the number of models in this unit. Add 1 to each roll if the target has more models than this unit. For each 3+, inflict 1 mortal damage on the target."]}]},{"n":["Akhelianer-Allopex","Akhelian Allopex"],"kw":[["Kavallerie","Cavalry"],["Fliegen","Fly"],["Verstärkung","Reinforcements"]],"mv":12,"hp":8,"m":1,"sv":4,"cv":2,"wd":0,"b":"90x52","g":0,"note":null,"rw":[{"n":["Klingenmuschel-Harpunenwerfer","Bladeclam Harpoon Launcher"],"r":18,"a":2,"h":3,"w":2,"rd":1,"d":3,"f":"O"}],"mw":[{"n":["Haken und Klingen","Hooks and Blades"],"a":4,"h":3,"w":4,"rd":1,"d":1,"f":""},{"n":["Wilder Biss des Allopexes","Allopex's Savage Bite"],"a":3,"h":4,"w":2,"rd":2,"d":2,"f":"G"}],"ab":[{"n":["Blutrünstige Räuber","Bloodthirsty Predators"],"t":["Passiv: Addiere 1 auf den Attackenwert des Wilden Bisses des Allopexes dieser Einheit, solange sie sich innerhalb von 6 Zoll um mindestens eine feindliche Einheit befindet, die angeschlagen ist oder aus der im selben Zug mindestens ein Modell getötet wurde.","Passive: Add 1 to the Attacks of this unit's Allopex's Savage Bite while it is within 6\" of at least one enemy unit that is battle-damaged or had at least one model slain this turn."]}]},{"n":["Namarti-Schwertknechte","Namarti Thralls"],"kw":[["Infanterie","Infantry"],["Verstärkung","Reinforcements"]],"mv":6,"hp":1,"m":5,"sv":5,"cv":1,"wd":0,"b":"32","g":0,"note":null,"rw":[],"mw":[{"n":["Lanmari","Lanmari"],"a":2,"h":3,"w":4,"rd":1,"d":1,"f":"IO"}],"ab":[{"n":["Geschwungene Hiebe","Sweeping Blows"],"t":["Passiv: Addiere bei Attacken dieser Einheit, deren Ziel ein feindliches Monster ist, 1 auf den Wuchtwert der Lanmari dieser Einheit.","Passive: Add 1 to the Rend of this unit's Lanmari for attacks that target an enemy Monster."]}]}]},{"i":43,"f":["Tiefenvolk der Idoneth","Idoneth Deepkin"],"n":["Akhelianer-Flutgarde","Akhelian Tidal Guard"],"traits":[{"n":["Königlicher Imperativ","Royal Imperative"],"t":["Einmal pro Schlacht (Armee), beliebige Nahkampfphase, nur in der dritten Schlachtrunde: Wähle 1 Effekt, der für den Rest der Schlacht gilt: Auf sie!: Befreundete Einheiten haben Kämpft zuerst. Gezielter Schlag: Die Nahkampfwaffen befreundeter Einheiten haben Krit. (tödlich).","Once per battle (army), any combat phase, third battle round only: Pick 1 effect that lasts for the rest of the battle: Strike Them!: Friendly units fight first. Aimed Strike: Friendly melee weapons have Crit (Mortal)."]}],"reg":[{"n":["Der Speer von Asphoren","The Spear of Asphoren"],"t":["Einmal pro Zug (Armee), beliebige Angriffsphase: Wähle eine befreundete Einheit, die nicht im Nahkampf ist und eine Angriff-Fähigkeit einsetzt: Addiere für den Rest des Zuges 1 auf Angriffswürfe für jene Einheit.","Once per turn (army), any charge phase: Pick a friendly unit that is not in combat and uses a charge ability: Add 1 to its charge rolls for the rest of the turn."]},{"n":["Der Schild von Ulchiss","The Shield of Ulchiss"],"t":["Einmal pro Zug (Armee), deine Bewegungsphase: Wähle eine befreundete Einheit im Nahkampf, die eine Rückzug-Fähigkeit einsetzt: Bis zum Ende des Zugs wird ihr bei jedem Rückzug kein tödlicher Schaden zugefügt.","Once per turn (army), your movement phase: Pick a friendly unit in combat that uses a retreat ability: until the end of the turn, no mortal damage is inflicted on it when it retreats."]}],"enh":[{"n":["Pflichtbewusste Seelen","Dutiful Souls"],"t":["Einmal pro Schlacht, deine Heldenphase: Wähle eine befreundete Einheit ganz innerhalb von 12 Zoll um deinen General: Du kannst 1 getötetes Modell in die Zieleinheit zurückbringen. Ist das Ziel eine Infanterie-Einheit, kannst du stattdessen W3 getötete Modelle zurückbringen.","Once per battle, your hero phase: Pick a friendly unit wholly within 12\" of your general: you can return 1 slain model to the target unit. If the target is an Infantry unit, you can return D3 slain models instead."]},{"n":["Schimmerndes Amulett","Shimmering Amulet"],"t":["Passiv: Dein General hat Rettung (5+).","Passive: Your general has Ward (5+)."]},{"n":["Voltaischer Angriff","Voltaic Charge"],"t":["Passiv: Die Königlichen Akhelianer-Waffen deines Generals haben Angriff (+1 Schaden).","Passive: Your general's Royal Akhelian Weapons have Charge (+1 Damage)."]},{"n":["Seelenräuber","Soul Thief"],"t":["Ende eines beliebigen Zuges: Wenn dein General im Nahkampf ist, heile (W3) deinen General.","End of any turn: If your general is in combat, heal (D3) your general."]}],"units":[{"n":["Akhelianer-König","Akhelian King"],"kw":[["Held","Hero"],["Kavallerie","Cavalry"],["Fliegen","Fly"]],"mv":12,"hp":7,"m":1,"sv":3,"cv":2,"wd":0,"b":"60","g":1,"note":null,"rw":[],"mw":[{"n":["Königliche Akhelianer-Waffen","Royal Akhelian Weapons"],"a":5,"h":3,"w":4,"rd":1,"d":2,"f":""},{"n":["Fänge, Krallen und peitschende Schwänze des Tiefseerosses","Fangs, Claws and Lashing Tails of the Deepmare"],"a":4,"h":4,"w":3,"rd":1,"d":2,"f":"G"}],"ab":[{"n":["Zum Raub entschlossen","Bound for Plunder"],"t":["Deine Heldenphase: Wähle eine andere befreundete Einheit vollständig in Nahkampfreichweite dieser Einheit und wirf einen Würfel. Bei 3+ addiere bis zum Beginn deines nächsten Zugs 1 auf Schutzwürfe für das Ziel.","Your hero phase: Pick another friendly unit wholly within combat range of this unit and roll a die. On a 3+, add 1 to save rolls for the target until the start of your next turn."]},{"n":["Wellenreiter","Wave Rider"],"t":["Beliebige Angriffsphase: Hat diese Einheit in dieser Phase angegriffen, wähle eine feindliche Einheit innerhalb von 1 Zoll als Ziel und wirf einen W3. Bei 2+ füge dem Ziel tödlichen Schaden in Höhe des Wurfergebnisses zu.","Any charge phase: If this unit charged this phase, pick an enemy unit within 1\" as the target and roll a D3. On a 2+, inflict mortal damage on the target equal to the roll."]}]},{"n":["Akhelianer-Morrsarrgarde","Akhelian Morrsarr Guard"],"kw":[["Kavallerie","Cavalry"],["Fliegen","Fly"]],"mv":14,"hp":4,"m":3,"sv":4,"cv":1,"wd":0,"b":"60x35","g":0,"note":null,"rw":[],"mw":[{"n":["Voltspeer","Voltspear"],"a":2,"h":3,"w":4,"rd":1,"d":1,"f":"C"},{"n":["Zähne und Schwanz des Fangmoras","Fangmora's Teeth and Tail"],"a":3,"h":4,"w":3,"rd":1,"d":["W3","D3"],"f":"G"}],"ab":[{"n":["Biovoltaischer Schlag (Seelenraubgesellschaft)","Biovoltaic Blast (Soulraid Company)"],"t":["Einmal pro Schlacht, beliebige Angriffsphase: Hat diese Einheit in dieser Phase angegriffen, wähle eine feindliche Einheit innerhalb von 1 Zoll als Ziel und wirf eine Anzahl Würfel gleich der Anzahl Modelle dieser Einheit. Für jede 4-5 füge dem Ziel 1 tödlichen Schaden zu, für jede 6+ W3 tödlichen Schaden. Addiere 1 zu jedem Wurf, wenn die Zieleinheit aus mehr Modellen besteht als diese Einheit.","Once per battle, any charge phase: If this unit charged in this phase, pick an enemy unit within 1\" as the target and roll a number of dice equal to the number of models in this unit. For each 4-5, inflict 1 mortal damage on the target. For each 6+, inflict D3 mortal damage. Add 1 to each roll if the target unit has more models than this unit."]},{"n":["Biovoltaischer Schlag (Akhelianer-Flutgarde)","Biovoltaic Blast (Akhelian Tidal Guard)"],"t":["Einmal pro Schlacht, beliebige Angriffsphase: Hat diese Einheit in dieser Phase angegriffen, wähle eine feindliche Einheit innerhalb von 1 Zoll als Ziel und wirf eine Anzahl Würfel gleich der Anzahl Modelle dieser Einheit. Addiere 1 zu jedem Ergebnis, wenn die Zieleinheit mehr Modelle hat als diese Einheit. Für jedes Ergebnis von 3+ füge dem Ziel 1 tödlichen Schaden zu.","Once per battle, any charge phase: If this unit charged this phase, pick an enemy unit within 1\" as the target and roll a number of dice equal to the number of models in this unit. Add 1 to each roll if the target has more models than this unit. For each 3+, inflict 1 mortal damage on the target."]}]},{"n":["Akhelianer-Ishlaengarde","Akhelian Ishlaen Guard"],"kw":[["Kavallerie","Cavalry"],["Fliegen","Fly"]],"mv":14,"hp":4,"m":3,"sv":4,"cv":1,"wd":0,"b":"60x35","g":0,"note":null,"rw":[],"mw":[{"n":["Helsäbel","Helsabre"],"a":3,"h":3,"w":4,"rd":1,"d":1,"f":""},{"n":["Zähne und Schwanz des Fangmoras","Fangmora's Teeth and Tail"],"a":3,"h":4,"w":3,"rd":1,"d":["W3","D3"],"f":"G"}],"ab":[{"n":["Biovoltaisches Feld","Biovoltaic Field"],"t":["Einmal pro Schlacht, beliebige Nahkampfphase: Wähle eine feindliche Einheit im Nahkampf mit dieser Einheit und wirf einen Würfel. Bei 3+ subtrahiere für den Rest des Zuges 1 vom Attackenwert der Nahkampfwaffen des Ziels.","Once per battle, any combat phase: Pick an enemy unit in combat with this unit and roll a die. On a 3+, subtract 1 from the Attacks characteristic of the target's melee weapons for the rest of the turn."]}]},{"n":["Namarti-Bogenschützen","Namarti Archers"],"kw":[["Infanterie","Infantry"],["Verstärkungen","Reinforcements"]],"mv":7,"hp":1,"m":10,"sv":5,"cv":1,"wd":0,"b":"32","g":0,"note":null,"rw":[{"n":["Wisperbogen","Whisperbow"],"r":12,"a":2,"h":3,"w":4,"rd":1,"d":1,"f":""}],"mw":[{"n":["Totenklageklinge","Deathwail Blade"],"a":1,"h":3,"w":4,"rd":0,"d":1,"f":""}],"ab":[{"n":["Im Laufen schießen","Shoot on the Move"],"t":["Passiv: Diese Einheit kann auch dann Fernkampf-Fähigkeiten einsetzen, wenn sie im selben Zug eine Rennen- oder Rückzug-Fähigkeit eingesetzt hat.","Passive: This unit can use shooting abilities even if it used a run or retreat ability in the same turn."]}]}]},{"i":44,"f":["Orruk-Kriegsclans","Orruk Warclans"],"n":["Eisenkiefa-Moschmob","Ironjaw Mosh Mob"],"traits":[],"reg":[{"n":["Naturgewalt","Force of Nature"],"t":["Passiv: Addiere bei einem unmodifizierten Angriffswurf von 8+ für eine befreundete Einheit für den Rest des Zugs 1 auf den Attackenwert der Nahkampfwaffen jener Einheit.","Passive: On an unmodified charge roll of 8+, add 1 to the Attacks characteristic of the melee weapons of that friendly unit for the rest of the turn."]},{"n":["Ordentlicher Radau","Proper Ruckus"],"t":["Einmal pro Schlacht, Reaktion: Du sagst die Fähigkeit „Mächtige Zerstörer“ an. Alle befreundeten Einheiten auf dem Schlachtfeld, die nicht in diesem Zug aufgestellt wurden, sind stattdessen Ziele dieser Fähigkeit.","Once per battle, reaction: You declare the Mighty Destroyers ability. All friendly units on the battlefield that were not set up this turn are targets of that ability instead."]}],"enh":[{"n":["Bernsteinknochen-Wetzstein","Amberbone Whetstone"],"t":["Passiv: Der Wuchtwert der Nahkampfwaffen deines Generals ist 2.","Passive: The Rend characteristic of your general's melee weapons is 2."]},{"n":["Trophäenschädel","Trophy Skulls"],"t":["Passiv: Der Kontrollwert deines Generals ist 5.","Passive: The control score of your general is 5."]},{"n":["Rüstung des Gork","Armour of Gork"],"t":["Passiv: Dein General hat Rettung (6+).","Passive: Your general has Ward (6+)."]},{"n":["Megabossig","Megabossy"],"t":["Passiv: Wenn dein General in diesem Zug angegriffen hat, addiere für den Rest des Zugs 1 auf Angriffswürfe für befreundete Einheiten, solange sie sich vollständig innerhalb von 12 Zoll um deinen General befinden.","Passive: If your general charged this turn, add 1 to charge rolls for friendly units wholly within 12\" of your general for the rest of the turn."]}],"units":[{"n":["Megaboss","Megaboss"],"kw":[["Held","Hero"],["Infanterie","Infantry"]],"mv":4,"hp":8,"m":1,"sv":3,"cv":2,"wd":0,"b":"60","g":1,"note":null,"rw":[],"mw":[{"n":["Boss-Spalta","Boss Choppa"],"a":8,"h":4,"w":2,"rd":1,"d":2,"f":"" rw":[],"mw":[{"n":["Kraftprotz-Waffen","Brute Weapons"],"a":3,"h":4,"w":3,"rd":1,"d":2,"f":""}],"ab":[{"n":["Jetz’ geht’s los","Here We Go"],"t":["Deine Bewegungsphase (ab der dritten Schlachtrunde): Stelle diese Einheit weiter als 6 Zoll von allen feindlichen Einheiten entfernt irgendwo auf dem Schlachtfeld auf. Diese Einheit wird nicht in der Aufstellungsphase aufgestellt.","Your movement phase (from the third battle round): Set up this unit anywhere on the battlefield more than 6\" from all enemy units. This unit is not set up during the setup phase."]},{"n":["Was glotzt’n so?","What You Lookin' At?"],"t":["Passiv: Feindliche Einheiten mit Ausdauerwert 1 oder 2 können keine Ziele beanspruchen, solange sie im Nahkampf mit dieser Einheit sind.","Passive: Enemy units with a Health characteristic of 1 or 2 cannot claim objectives while they are in combat with this unit."]}]}]},{"i":45,"f":["Höfe der Leichenfresser","Flesh-eater Courts"],"n":["Aaskreuzzug","Carrion Crusade"],"traits":[],"reg":[{"n":["Auf dem Kreuzzug","On Crusade"],"t":["Passiv: Addiere 1 auf Rennen- und Angriffswürfe für befreundete Einheiten.","Passive: Add 1 to run and charge rolls for friendly units."]},{"n":["Verteidiger der Krone","Defenders of the Crown"],"t":["Passiv: Addiere 1 auf Schutzwürfe für befreundete Einheiten, die ein von dir kontrolliertes Ziel beanspruchen.","Passive: Add 1 to save rolls for friendly units that claim an objective you control."]}],"enh":[{"n":["Ulguisches Geschmeide","Ulguan Finery"],"t":["Passiv: Dein General ist für feindliche Modelle, die weiter als 12 Zoll von ihm entfernt sind, nicht sichtbar.","Passive: Your general is not visible to enemy models more than 12\" away from it."]},{"n":["Blutflussgral","Grail of the Blood River"],"t":["Einmal pro Schlacht, deine Heldenphase: Heile (2W3) deinen General.","Once per battle, your hero phase: Heal (2D3) your general."]},{"n":["Erhebende Rede","Rousing Speech"],"t":["Deine Heldenphase: Wirf für jede befreundete Einheit vollständig innerhalb von 12 Zoll um deinen General (außer ihn selbst) einen Würfel. Für jede 5+ gib deinem General 1 Edle-Taten-Punkt.","Your hero phase: Roll a die for each friendly unit wholly within 12\" of your general (excluding your general). For each 5+, give your general 1 Noble Deeds point."]},{"n":["Blutrote Kost","Crimson Feast"],"t":["Deine Heldenphase: Wähle eine sichtbare feindliche Einheit innerhalb von 18 Zoll um deinen General als Ziel und führe einen Zauberwurf (2W6) aus. Bei 6+ füge dem Ziel W3 tödlichen Schaden zu. Dann kannst du, wenn sich deine Gruftgarde-Einheit innerhalb von 6 Zoll um das Ziel befindet, für jeden durch diese Fähigkeit zugewiesenen Schadenspunkt 1 getötetes Modell in deine Gruftgarde-Einheit zurückbringen.","Your hero phase: Pick a visible enemy unit within 18\" of your general as the target and make a casting roll (2D6). On a 6+, inflict D3 mortal damage on the target. Then, if your Crypt Guard unit is within 6\" of the target, for each damage point allocated by this ability you can return 1 slain model to that Crypt Guard unit."]}],"units":[{"n":["Scheußlicher Erzregent","Abhorrent Archregent"],"kw":[["Held","Hero"],["Infanterie","Infantry"]],"mv":6,"hp":6,"m":1,"sv":5,"cv":2,"wd":6,"b":"40","g":1,"note":null,"rw":[],"mw":[{"n":["Blutige Krallen und Reißzähne","Bloody Claws and Fangs"],"a":5,"h":3,"w":3,"rd":1,"d":2,"f":""}],"ab":[{"n":["Krankhafte Verwandlung","Morbid Transformation"],"t":["Deine Heldenphase: Wähle eine sichtbare befreundete Einheit vollständig innerhalb von 18 Zoll um diese Einheit als Ziel; führe einen Zauberwurf (2W6) aus. Bei 6+ addiere bis zum Beginn deines nächsten Zugs 2 Zoll auf den Bewegungswert der Zieleinheit und 1 auf Verwundungswürfe für ihre Attacken.","Your hero phase: Pick a visible friendly unit wholly within 18\" of this unit as the target and make a casting roll (2D6). On a 6+, add 2\" to the target's Move characteristic and 1 to wound rolls for its attacks until the start of your next turn."]}]},{"n":["Gruftgarde","Crypt Guard"],"kw":[["Infanterie","Infantry"],["Verstärkung","Reinforcements"]],"mv":6,"hp":1,"m":10,"sv":6,"cv":1,"wd":5,"b":"25","g":0,"note":null,"rw":[],"mw":[{"n":["Verfluchte Waffe","Cursed Weapon"],"a":3,"h":4,"w":4,"rd":1,"d":1,"f":""}],"ab":[{"n":["Königliche Leibwache","Royal Bodyguard"],"t":["Passiv: Addiere 1 auf Rettungswürfe (Schutzwürfe) für befreundete Helden vollständig innerhalb der Nahkampfreichweite dieser Einheit.","Passive: Add 1 to save rolls for friendly heroes wholly within combat range of this unit."]}]},{"n":["Morbheg-Ritter","Morbheg Knights"],"kw":[["Kavallerie","Cavalry"],["Fliegen","Fly"]],"mv":12,"hp":4,"m":3,"sv":4,"cv":1,"wd":6,"b":"75x42","g":0,"note":null,"rw":[],"mw":[{"n":["Grausige Lanze","Ghastly Lance"],"a":2,"h":3,"w":4,"rd":1,"d":1,"f":"C"},{"n":["Krallen und Fänge des Nachtkreischers","Claws and Fangs of the Night Screamer"],"a":3,"h":4,"w":3,"rd":1,"d":2,"f":"G"}],"ab":[{"n":["Raubtiersprünge","Predator Leaps"],"t":["Passiv: Diese Einheit kann Angriff-Fähigkeiten auch dann einsetzen, wenn sie im selben Zug Rückzug-Fähigkeiten eingesetzt hat. Außerdem wird dieser Einheit kein tödlicher Schaden zugefügt, wenn sie Rückzug-Fähigkeiten einsetzt.","Passive: This unit can use charge abilities even if it used retreat abilities in the same turn. In addition, no mortal damage is inflicted on this unit when it uses retreat abilities."]}]},{"n":["Varghulf-Höfling","Varghulf Courtier"],"kw":[["Held","Hero"],["Bestie","Beast"]],"mv":10,"hp":8,"m":1,"sv":5,"cv":2,"wd":6,"b":"90x52","g":0,"note":null,"rw":[],"mw":[{"n":["Ungeheuerliche Krallen","Monstrous Claws"],"a":7,"h":4,"w":3,"rd":1,"d":2,"f":""},{"n":["Dolchgleiche Fangzähne","Dagger-like Fangs"],"a":1,"h":3,"w":2,"rd":2,"d":3,"f":""}],"ab":[{"n":["Siegesmahl","Victory Feast"],"t":["Ende eines beliebigen Zuges: Hat diese Einheit in diesem Zug mindestens ein Modell getötet, heile (W6) diese Einheit. Sie kann sofort die Fähigkeit „Rückzug“ einsetzen, ohne dass ihr dadurch tödlicher Schaden zugefügt wird.","End of any turn: If this unit slew at least one model this turn, heal (D6) this unit. It can immediately use the Retreat ability without mortal damage being inflicted on it."]}]}]},{"i":46,"f":["Höfe der Leichenfresser","Flesh-eater Courts"],"n":["Gebeinwache","Bonereaper Guard"],"traits":[],"reg":[{"n":["Wahn des Wächters","Delusion of the Warden"],"t":["Passiv: Solange du an diesen Wahn glaubst, addiere 1 auf Rettungswürfe für befreundete Einheiten, solange jedes Modell der Einheit ein Ziel beansprucht.","Passive: While you believe in this delusion, add 1 to save rolls for friendly units while every model in the unit is contesting an objective."]},{"n":["Wahn des Jägers","Delusion of the Hunter"],"t":["Passiv: Solange du an diesen Wahn glaubst, addiere 1 auf Verwundungswürfe für Nahkampfattacken befreundeter Einheiten, solange kein Modell der Einheit ein Ziel beansprucht.","Passive: While you believe in this delusion, add 1 to wound rolls for friendly units' melee attacks while no model in the unit is contesting an objective."]}],"enh":[{"n":["Fast bei Sinnen","Nearly Sane"],"t":["Einmal pro Schlacht, Reaktion: Du sagst die Fähigkeit „Wahn und Irrsinn“ an. Du kannst den Wahnwurf wiederholen.","Once per battle, reaction: You declare the Delusion and Madness ability. You can re-roll the delusion roll."]},{"n":["Eine würdige Herausforderung","A Worthy Challenge"],"t":["Einmal pro Schlacht, beliebige Nahkampfphase: Wähle als Ziel eine feindliche Einheit, die die Schlacht mit 3 oder weniger Modellen begonnen hat und sich im Nahkampf mit deinem General befindet. Dein Gegner entscheidet, ob das Ziel die Herausforderung annimmt: Dann müssen für den Rest der Phase alle Attacken deines Generals und des Ziels einander als Ziel haben. Lehnt es ab, hat das Ziel für den Rest der Phase Kämpft zuletzt.","Once per battle, any combat phase: Pick an enemy unit that started the battle with 3 or fewer models and is in combat with your general. Your opponent decides whether the target accepts the challenge: if so, for the rest of the phase all attacks made by your general and the target must target each other. If it declines, the target has Fights Last for the rest of the phase."]},{"n":["Jagdgefährte","Hunting Companion"],"t":["Ende eines beliebigen Zugs: Falls dein General nicht im Nahkampf ist, kann er sich 3 Zoll bewegen, aber nicht in den Nahkampf.","End of any turn: If your general is not in combat, it can move 3\", but not into combat."]},{"n":["Chorleiter","Choirmaster"],"t":["Einmal pro Schlacht, deine Fernkampfphase: Wähle als Ziel eine sichtbare feindliche Einheit innerhalb von 6 Zoll um deinen General. Addiere für den Rest des Zugs 1 auf den Schadenswert der Fernkampfattacken befreundeter Einheiten gegen jene Einheit.","Once per battle, your shooting phase: Pick a visible enemy unit within 6\" of your general. For the rest of the turn, add 1 to the Damage characteristic of friendly units' ranged attacks against that unit."]}],"units":[{"n":["Scheußlicher Bluthüter","Abhorrant Bloodhound"],"kw":[["Held","Hero"],["Zauberer","Wizard"],["Infanterie","Infantry"],["Fliegen","Fly"]],"mv":12,"hp":7,"m":1,"sv":5,"cv":2,"wd":6,"b":"40","g":1,"note":null,"rw":[],"mw":[{"n":["Blutige Krallen und Reißzähne","Bloody Claws and Fangs"],"a":5,"h":3,"w":3,"rd":1,"d":2,"f":""}],"ab":[{"n":["Blast zur Jagd!","Sound the Hunt!"],"t":["Deine Heldenphase: Wähle als Ziel eine befreundete Einheit vollständig innerhalb von 12 Zoll um diese Einheit, dann führe einen Zauberwurf (2W6) aus. Bei 6+ addiere bis zum Beginn deines nächsten Zugs bei Angriffswürfen für das Ziel 1 zur Anzahl der geworfenen Würfel (bis zu einem Maximum von 3), dann entferne 1 Würfel deiner Wahl und verwende die verbleibenden Würfel als Angriffswurf.","Your hero phase: Pick a friendly unit wholly within 12\" of this unit, then make a casting roll (2D6). On 6+, until the start of your next turn, add 1 to the number of dice rolled for the target's charge rolls (up to a maximum of 3), then remove 1 die of your choice and use the remaining dice as the charge roll."]}]},{"n":["Königliche Bestienhäuter","Royal Beastflayers"],"kw":[["Infanterie","Infantry"],["Knechte","Menials"]],"mv":6,"hp":1,"m":10,"sv":6,"cv":1,"wd":6,"b":"32","g":0,"note":null,"rw":[],"mw":[{"n":["Bestienhäuterwaffen","Beastflayer Weapons"],"a":3,"h":4,"w":4,"rd":0,"d":1,"f":""}],"ab":[{"n":["Beschaffenheit des Landes","Lay of the Land"],"t":["Deine Bewegungsphase: Wenn sich diese Einheit nicht im Nahkampf befindet und vollständig innerhalb von 6 Zoll um eine Schlachtfeldkante ist, entferne sie vom Schlachtfeld und stelle sie erneut auf, vollständig innerhalb von 6 Zoll um eine Schlachtfeldkante und weiter als 6 Zoll von allen feindlichen Einheiten entfernt.","Your movement phase: If this unit is not in combat and is wholly within 6\" of a battlefield edge, remove it from the battlefield and set it up again wholly within 6\" of a battlefield edge and more than 6\" from all enemy units."]}]},{"n":["Gruftschrecken","Crypt Horrors"],"kw":[["Infanterie","Infantry"],["Ritter","Knights"],["Verstärkung","Reinforcements"]],"mv":7,"hp":4,"m":3,"sv":5,"cv":1,"wd":6,"b":"50","g":0,"note":null,"rw":[],"mw":[{"n":["Keule und giftige Krallen","Club and Poisonous Claws"],"a":4,"h":4,"w":3,"rd":1,"d":2,"f":""}],"ab":[{"n":["Heilige Knochenklingen","Sacred Bone Blades"],"t":["Beliebige Nahkampfphase: Wähle als Ziel eine feindliche Einheit, die in diesem Zug angegriffen hat und sich im Nahkampf mit dieser Einheit befindet. Wirf einen Würfel für jedes Modell der Zieleinheit. Für jede 5+ füge der Zieleinheit 1 tödlichen Schaden zu.","Any combat phase: Pick an enemy unit that charged this turn and is in combat with this unit. Roll a die for each model in the target unit. For each 5+, inflict 1 mortal damage on the target unit."]}]},{"n":["Gruftschinder","Crypt Flayers"],"kw":[["Infanterie","Infantry"],["Ritter","Knights"],["Fliegen","Fly"]],"mv":12,"hp":4,"m":3,"sv":5,"cv":1,"wd":6,"b":"50","g":0,"note":null,"rw":[{"n":["Todesschrei","Death Scream"],"r":10,"a":4,"h":4,"w":3,"rd":2,"d":1,"f":"B"}],"mw":[{"n":["Durchbohrende Krallen","Piercing Talons"],"a":4,"h":4,"w":3,"rd":1,"d":1,"f":""}],"ab":[{"n":["Unheiliger Chor","Unholy Choir"],"t":["Deine Fernkampfphase: Wähle als Ziel eine sichtbare feindliche Einheit innerhalb von 10 Zoll um diese Einheit. Subtrahiere für den Rest des Zugs die Anzahl der Schadenspunkte, die dem Ziel in dieser Phase durch die Fernkampfattacken dieser Einheit zugewiesen wurden, vom Kontrollwert des Ziels.","Your shooting phase: Pick a visible enemy unit within 10\" of this unit. For the rest of the turn, subtract the number of damage points allocated to the target in this phase by this unit's ranged attacks from the target's Control characteristic."]}]}]},{"i":47,"f":["Himmelsherrscher der Kharadron","Kharadron Overlords"],"n":["Himmelsschlagverband","Skystrike Force"],"traits":[{"n":["Durchquert die Himmel","Traverse the Skies"],"t":["Reaktion: Du sagst eine Bewegung-Fähigkeit für eine Arkanauten-Fregatte an, die kein Angriff ist. Wähle eine befreundete Infanterie-Einheit, die sich vollständig innerhalb der Nahkampfreichweite jener Fregatte und nicht im Nahkampf befindet. Entferne sie vom Schlachtfeld. Wenn die Fregatte ihre Bewegung beendet hat, stelle die Einheit vollständig innerhalb der Nahkampfreichweite der Fregatte und nicht im Nahkampf wieder auf. Eine Einheit kann keine Angriff-Fähigkeiten einsetzen, wenn sie im selben Zug transportiert wurde.","Reaction: You declare a Move ability for an Arkanaut Frigate that is not a Charge. Pick a friendly Infantry unit wholly within combat range of that Frigate and not in combat. Remove it from the battlefield. When the Frigate has finished its move, set that unit up again wholly within combat range of the Frigate and not in combat. A unit cannot use Charge abilities if it was transported in the same turn."]}],"reg":[{"n":["Angriffsschiff","Assault Ship"],"t":["Einmal pro Schlacht, deine Bewegungsphase: Wähle eine befreundete Einheit, die in diesem Zug transportiert wurde. Jene Einheit kann später in diesem Zug noch Angriff-Fähigkeiten einsetzen.","Once per battle, your movement phase: Pick a friendly unit that was transported this turn. That unit can still use Charge abilities later this turn."]},{"n":["Lösen","Disengage"],"t":["Einmal pro Schlacht, deine Bewegungsphase: Wähle eine befreundete Arkanauten-Fregatte. Wenn jene Einheit in dieser Phase eine Rückzug-Fähigkeit einsetzt, wird ihr kein tödlicher Schaden zugefügt und sie kann später in diesem Zug noch Fernkampf-Fähigkeiten einsetzen.","Once per battle, your movement phase: Pick a friendly Arkanaut Frigate. If that unit uses a Retreat ability this phase, no mortal damage is inflicted on it and it can still use Shoot abilities later this turn."]}],"enh":[{"n":["Meisterliche Rüstung","Masterwork Armour"],"t":["Passiv: Dein General hat Rettung (6+).","Passive: Your general has Ward (6+)."]},{"n":["Flasche auserlesenen Gorognas","Bottle of Fine Gorogna"],"t":["Einmal pro Schlacht, beliebige Heldenphase: Heile (W6) deinen General.","Once per battle, any hero phase: Heal (D6) your general."]},{"n":["Kein Lohn ohne Risiko","No Reward Without Risk"],"t":["Einmal pro Schlacht, Reaktion: Du sagst eine Angriff-Fähigkeit für eine Einheit vollständig innerhalb von 12 Zoll um deinen General an. Du kannst den Angriffswurf für jene Angriff-Fähigkeit wiederholen.","Once per battle, reaction: You declare a Charge ability for a unit wholly within 12\" of your general. You can re-roll the charge roll for that ability."]},{"n":["Kein Duardin wird zurückgelassen","No Duardin Left Behind"],"t":["Einmal pro Schlacht, deine Heldenphase: Wähle eine befreundete Arkanauten-Kompanie-Einheit vollständig innerhalb von 12 Zoll um deinen General und wirf einen Würfel für jedes zerstörte Modell jener Einheit. Für jede 4+ kannst du 1 zerstörtes Modell in jene Einheit zurückbringen.","Once per battle, your hero phase: Pick a friendly Arkanaut Company unit wholly within 12\" of your general and roll a die for each destroyed model in that unit. For each 4+, you can return 1 destroyed model to that unit."]}],"units":[{"n":["Arkanauten-Admiral","Arkanaut Admiral"],"kw":[["Held","Hero"],["Infanterie","Infantry"]],"mv":4,"hp":6,"m":1,"sv":3,"cv":2,"wd":0,"b":"40","g":1,"note":null,"rw":[{"n":["Meisterhafte Salvenpistole","Masterwork Volley Pistol"],"r":10,"a":3,"h":3,"w":3,"rd":1,"d":2,"f":"B"}],"mw":[{"n":["Skalfhammer","Skaref Hammer"],"a":3,"h":3,"w":2,"rd":1,"d":3,"f":""}],"ab":[{"n":["Nimm dir stets, was dir zusteht","Take What Is Owed"],"t":["Deine Heldenphase: Wähle als Ziel eine befreundete Arkanauten-Kompanie-Einheit vollständig innerhalb von 12 Zoll um diese Einheit. Addiere bis zu deinem nächsten Zug W6 zum Kontrollwert des Ziels.","Your hero phase: Pick a friendly Arkanaut Company unit wholly within 12\" of this unit. Until your next turn, add D6 to the target's Control characteristic."]}]},{"n":["Himmelswächter","Skywardens"],"kw":[["Infanterie","Infantry"],["Fliegen","Fly"],["Verstärkung","Reinforcements"]],"mv":12,"hp":2,"m":3,"sv":4,"cv":1,"wd":0,"b":"32","g":0,"note":null,"rw":[{"n":["Vulkanisationspistole","Vulcaniser Pistol"],"r":10,"a":3,"h":3,"w":3,"rd":1,"d":1,"f":"B"},{"n":["Aethermatisches Salvengewehr","Aethermatic Volley Gun"],"r":15,"a":["2W6","2D6"],"h":4,"w":4,"rd":0,"d":1,"f":""}],"mw":[{"n":["Himmelspike","Skypike"],"a":2,"h":3,"w":3,"rd":1,"d":2,"f":"T"},{"n":["Gewehrkolben","Rifle Butt"],"a":1,"h":4,"w":5,"rd":0,"d":1,"f":""}],"ab":[{"n":["Sprengladungen mit Zeitzünder","Delayed-Fuse Charges"],"t":["Ende eines beliebigen Zuges: Wähle als Ziel eine feindliche Einheit im Nahkampf mit dieser Einheit, dann wirf einen Würfel. Bei 2+ weise dem Ziel 1 tödlichen Schaden zu. Diese Einheit kann sofort die Fähigkeit „Rückzug“ einsetzen, ohne dass ihr dadurch tödlicher Schaden zugewiesen wird.","End of any turn: Pick an enemy unit in combat with this unit, then roll a die. On 2+, inflict 1 mortal damage on the target. This unit can immediately use the Retreat ability without mortal damage being inflicted on it."]}]},{"n":["Arkanauten-Kompanie (Himmelspike)","Arkanaut Company (Skypike)"],"kw":[["Infanterie","Infantry"],["Verstärkung","Reinforcements"],["Arkanauten-Kompanie","Arkanaut Company"]],"mv":4,"hp":1,"m":5,"sv":4,"cv":1,"wd":0,"b":"32","g":0,"note":null,"rw":[{"n":["Freibeuterpistole","Privateer Pistol"],"r":10,"a":2,"h":4,"w":4,"rd":0,"d":1,"f":"B"}],"mw":[{"n":["Arkanaut-Enterwaffe","Arkanaut Boarding Weapon"],"a":2,"h":4,"w":4,"rd":0,"d":1,"f":""},{"n":["Himmelspike","Skypike"],"a":2,"h":3,"w":3,"rd":1,"d":2,"f":"T"}],"ab":[{"n":["Auf der Suche nach Ruhm","Seeking Glory"],"t":["Passiv: Addiere 1 zu den Trefferwürfen für Attacken dieser Einheit, deren Ziel eine Einheit ist, die ein Ziel beansprucht.","Passive: Add 1 to hit rolls for attacks made by this unit that target a unit contesting an objective."]}]},{"n":["Arkanauten-Kompanie (Salvengewehr)","Arkanaut Company (Volley Gun)"],"kw":[["Infanterie","Infantry"],["Verstärkung","Reinforcements"],["Arkanauten-Kompanie","Arkanaut Company"]],"mv":4,"hp":1,"m":5,"sv":4,"cv":1,"wd":0,"b":"32","g":0,"note":null,"rw":[{"n":["Freibeuterpistole","Privateer Pistol"],"r":10,"a":2,"h":4,"w":4,"rd":0,"d":1,"f":"B"},{"n":["Aethermatisches Salvengewehr","Aethermatic Volley Gun"],"r":15,"a":["2W6","2D6"],"h":4,"w":4,"rd":0,"d":1,"f":""},{"n":["Leichte Himmelsharpune","Light Skyhook"],"r":15,"a":1,"h":4,"w":3,"rd":2,"d":["W3","D3"],"f":""}],"mw":[{"n":["Arkanaut-Enterwaffe","Arkanaut Boarding Weapon"],"a":2,"h":4,"w":4,"rd":0,"d":1,"f":""},{"n":["Gewehrkolben","Rifle Butt"],"a":1,"h":4,"w":5,"rd":0,"d":1,"f":""}],"ab":[{"n":["Auf der Suche nach Ruhm","Seeking Glory"],"t":["Passiv: Addiere 1 zu den Trefferwürfen für Attacken dieser Einheit, deren Ziel eine Einheit ist, die ein Ziel beansprucht.","Passive: Add 1 to hit rolls for attacks made by this unit that target a unit contesting an objective."]}]},{"n":["Arkanauten-Fregatte","Arkanaut Frigate"],"kw":[["Kriegsmaschine","War Machine"],["Fliegen","Fly"]],"mv":12,"hp":15,"m":1,"sv":3,"cv":5,"wd":0,"b":"170x80","g":0,"note":null,"rw":[{"n":["Schwere Himmelsharpune","Heavy Skyhook"],"r":24,"a":2,"h":4,"w":3,"rd":2,"d":["W6","D6"],"f":""},{"n":["Aetherprojektil-Karabiner","Aethershot Carbine"],"r":12,"a":4,"h":3,"w":3,"rd":1,"d":2,"f":"B"}],"mw":[{"n":["Enterwaffen der Mannschaft","Crew's Boarding Weapons"],"a":8,"h":4,"w":4,"rd":0,"d":1,"f":""}],"ab":[{"n":["Schwer angeschlagen","Badly Wounded"],"t":["Passiv: Solange dieser Einheit mindestens 10 Schadenspunkte zugewiesen sind, ist der Attackenwert ihrer Schweren Himmelsharpune 1.","Passive: While this unit has 10 or more damage points allocated to it, the Attacks characteristic of its Heavy Skyhook is 1."]},{"n":["Bombenvorrat","Bomb Stores"],"t":["Einmal pro Schlacht, deine Bewegungsphase: Wähle als Ziel eine feindliche Einheit, über die sich diese Einheit in dieser Phase hinwegbewegt hat, dann wirf einen Würfel. Bei 2+ füge dem Ziel W3 tödlichen Schaden zu.","Once per battle, your movement phase: Pick an enemy unit this unit moved over this phase, then roll a die. On 2+, inflict D3 mortal damage on the target."]}]}]}],"R":[{"id":"ablauf","ph":"x","t":["Spielablauf im Überblick","Game overview"],"s":["Eine Schlacht besteht aus Schlachtrunden. In jeder Runde hat jeder Spieler einen Zug; jeder Zug läuft in festen Phasen ab.","A battle is fought in battle rounds. In each round both players take a turn, and every turn is played in fixed phases."],"d":[["Spearhead dauert 4 Schlachtrunden (ca. 1,5 Stunden). Gewonnen hat, wer am Ende die meisten Siegespunkte hat.","Spearhead lasts 4 battle rounds (about 1.5 hours). Whoever has the most victory points at the end wins."],["Reihenfolge im Zug: Zugbeginn → Heldenphase → Bewegungsphase → Fernkampfphase → Angriffsphase → Kampfphase → Zugende.","Order within a turn: start of turn → Hero phase → Movement phase → Shooting phase → Charge phase → Combat phase → end of turn."],["Der Spieler, der gerade am Zug ist, heißt aktiver Spieler – egal ob er den ersten oder zweiten Zug der Runde hat.","The player whose turn it is is the active player – whether they go first or second in the round."],["Vor der ersten Runde folgen Vorbereitung und Aufstellungsphase.","Before round 1 come the pre-battle steps and the deployment phase."]],"sp":null},{"id":"messen","ph":"x","t":["Entfernungen, Kampfreichweite, Zusammenhalt","Distances, combat range, coherency"],"s":["Gemessen wird in Zoll (\") von Basenrand zu Basenrand. Jedes Modell hat 3\" Kampfreichweite; Einheiten müssen zusammenhalten.","Distances are measured in inches (\") from base edge to base edge. Every model has a 3\" combat range; units must stay together."],"d":[["Kampfreichweite: 3\" waagerecht um den Basenrand, senkrecht unbegrenzt. Die Kampfreichweite einer Einheit ist die Summe der Reichweiten all ihrer Modelle.","Combat range: 3\" horizontally from the base edge, unlimited vertically. A unit's combat range is the combined range of all its models."],["Zwei gegnerische Einheiten, die in der Kampfreichweite der anderen liegen und sich sehen können, sind im Nahkampf.","Two opposing units within each other's combat range that can see each other are in combat."],["Zusammenhalt: Nach jedem Setzen oder Bewegen muss jedes Modell höchstens ½\" (waagerecht) von mindestens einem Modell der eigenen Einheit entfernt sein, die Einheit bildet also eine einzige Gruppe.","Coherency: after being set up or moving, every model must be within ½\" (horizontally) of at least one other model of its unit, so the unit forms one single group."],["Hat eine Einheit 7 oder mehr Modelle, muss jedes Modell zu mindestens zwei anderen Modellen Zusammenhalt haben.","While a unit has 7 or more models, each model must be in coherency with at least two others."],["Kann eine Bewegung nicht im Zusammenhalt enden, darf sie nicht ausgeführt werden. Beim Entfernen gefallener Modelle muss der Zusammenhalt erhalten bleiben (möglichst wenige zusätzliche Modelle entfernen).","If a move cannot end in coherency it cannot be made. When slain models are removed, coherency must be kept (remove as few extra models as possible)."]],"sp":null},{"id":"sicht","ph":"x","t":["Sichtbarkeit","Visibility"],"s":["Ein Modell sieht ein anderes, wenn man von seinem Körper aus eine Sichtlinie zu irgendeinem Teil des anderen ziehen kann.","A model can see another if a line of sight can be drawn from its body to any part of the other model."],"d":[["Modelle in derselben Einheit blockieren die Sicht nicht; Geländestücke mit „Versperrt Sicht“ schon.","Models in the same unit never block sight; terrain with Obscuring does."],["Für Fernkampf muss das Ziel sichtbar sein, im Nahkampf muss es sichtbar und in Kampfreichweite sein.","For shooting the target must be visible; for melee it must be visible and within combat range."],["Hinter einem Gelände mit „Deckung“ stehende Ziele sind schwerer zu treffen (−1 auf Trefferwürfe).","Targets behind terrain with Cover are harder to hit (−1 to hit rolls)."]],"sp":null},{"id":"schriftrolle","ph":"x","t":["Truppenschriftrolle und Werte","Warscroll and characteristics"],"s":["Jede Einheit hat eine Truppenschriftrolle mit Werten, Waffen, Fähigkeiten und Schlüsselwörtern.","Every unit has a warscroll with characteristics, weapons, abilities and keywords."],"d":[["Bewegung (Move): wie weit sich Modelle bei Bewegungen höchstens bewegen dürfen.","Move: the maximum distance models can move."],["Ausdauer (Health): so viele Schadenspunkte tötet 1 Modell. Schutzwurf (Save): Mindestwurf, um einen Treffer abzuwehren.","Health: damage points needed to slay one model. Save: the roll needed to stop a successful attack."],["Kontrolle (Control): Beitrag der Modelle zur Zielkontrolle. Rettung (Ward): zusätzlicher Wurf gegen jeden einzelnen Schadenspunkt.","Control: how much each model counts for objective control. Ward: an extra roll against each single damage point."],["Waffen: Reichweite, Attacken, Treffen, Verwunden, Wucht (Rend), Schaden sowie Waffenfähigkeiten.","Weapons: Range, Attacks, Hit, Wound, Rend and Damage, plus weapon abilities."],["Schlüsselwörter wie Held, Infanterie, Fliegen oder Verstärkung entscheiden, welche Regeln und Fähigkeiten auf die Einheit wirken.","Keywords such as Hero, Infantry, Fly or Reinforcements decide which rules and abilities apply to the unit."]],"sp":null},{"id":"faehigkeiten","ph":"x","t":["Fähigkeiten einsetzen","Using abilities"],"s":["Fähigkeiten werden angesagt, Gegner können reagieren, dann wird der Effekt abgehandelt. Passive Fähigkeiten wirken automatisch.","Abilities are declared, opponents may react, then the effect is resolved. Passive abilities just apply."],"d":[["1. Fähigkeit ansagen (Ziel/Ansage). 2. Reaktionen: abwechselnd, der aktive Spieler beginnt. 3. Effekt abhandeln.","1. Declare the ability. 2. Reactions, alternating, active player first. 3. Resolve the effect."],["Eine Einheit darf pro Phase nur 1 Kern-Fähigkeit (Core) einsetzen.","A unit can use only 1 Core ability per phase."],["Passive Fähigkeiten werden nicht angesagt; sie wirken immer, solange ihre Bedingung erfüllt ist. Dieselbe passive Wirkung zählt nie doppelt.","Passive abilities are not declared; they always apply while their condition is met. The same passive effect never stacks."],["„Einmal pro Schlacht / Zug / Phase“ begrenzt, wie oft eine Fähigkeit zählt (je Einheit oder, bei „Armee“, für das ganze Heer).","“Once per battle / turn / phase” limits how often an ability can be used (per unit or, with “army”, for the whole army)."],["Regeln der Eins: 1 Kern-Fähigkeit pro Phase; dieselbe Fähigkeit nicht mehrmals pro Phase (wenn nicht anders angegeben); dieselbe passive Wirkung nie mehrfach gleichzeitig.","Rules of One: 1 Core ability per phase; the same ability not more than once per phase (unless stated); the same passive effect never twice at the same time."]],"sp":null},{"id":"befehle","ph":"x","t":["Befehlspunkte und Befehle","Command points and commands"],"s":["Befehle sind Fähigkeiten, die Befehlspunkte (BP) kosten. Pro Schlachtrunde gibt es 4 BP, mit Außenseiter-Bonus 5.","Commands are abilities that cost command points (CP). Each battle round you get 4 CP, or 5 as the underdog."],"d":[["Befehlspunkte verfallen am Rundenende – nichts wird gespart.","Unused command points are lost at the end of the battle round – nothing is saved."],["Jede Einheit darf pro Phase nur 1 Befehl einsetzen, jeder Befehl nur 1-mal pro Armee und Phase.","Each unit can use only 1 command per phase, and each command only once per army per phase."],["Typische Befehle: Sammeln (Rally), Im Laufschritt, Vorwärts zum Sieg (Angriffswurf wiederholen), Gegenangriff, Magischer Eingriff, Alles-oder-nichts-Angriff und Alles-oder-nichts-Verteidigung.","Typical commands: Rally, At the Double, Forward to Victory (re-roll a charge), Counter-charge, Magical Intervention, All-out Attack and All-out Defence."]],"sp":null},{"id":"vorbereitung","ph":"v","t":["Vorbereitung der Schlacht","Pre-battle steps"],"s":["Armeen wählen, Schlachtplan und Seite bestimmen, Gelände aufbauen – dann beginnt die Aufstellung.","Choose armies, determine battleplan and side, set up terrain – then deployment begins."],"d":[["Jeder Spieler nimmt eine Spearhead-Armee; ihre Zusammensetzung ist fest und kann nicht verändert werden.","Each player takes a Spearhead army; its composition is fixed and cannot be changed."],["Ein Wurf entscheidet, wer Angreifer und wer Verteidiger ist. Beide wählen ein Regimentsfähigkeit und eine Verbesserung für den General.","A roll-off decides attacker and defender. Both pick one regiment ability and one enhancement for their general."],["Auf der gewählten Karte (Aufstellungsplan) gehört je eine Hälfte als Territorium jedem Spieler; die Seite der Reiche-Schlachtfeld-Regel wird ausgewählt.","On the chosen map each player owns a territory; the realm battlefield side is chosen."],["Gelände: jeder Spieler stellt 1 großes und 1 kleines Geländestück. Anderes Gelände mehr als 6\" entfernt, mehr als 3\" von langen Kanten und gegnerischem Territorium, nicht auf Zielen.","Terrain: each player places 1 large and 1 small terrain feature. Other terrain more than 6\" away, more than 3\" from long edges and enemy territory, not on objectives."],["Wähle Taktikkarten-Deck und Wendungskarten (Twist) des gewählten Reichs.","Prepare the battle tactic deck and the twist cards of the chosen realm."]],"sp":["Die Zusammensetzung einer Spearhead-Armee ist fest: Regiment, General, Kampfeigenschaften.","A Spearhead army has a fixed composition: regiment, general, battle traits."]},{"id":"aufstellung","ph":"v","t":["Aufstellungsphase","Deployment phase"],"s":["Abwechselnd werden Einheiten innerhalb des eigenen Territoriums aufgestellt. Der Angreifer beginnt.","Players alternate setting up units wholly inside their own territory. The attacker starts."],"d":[["Einheit aufstellen (Deploy): ganz im eigenen Territorium und mehr als 6\" (Schnelleinstieg: 9\") vom gegnerischen Territorium.","Deploy: wholly within your territory and more than 6\" (Quick Start: 9\") from enemy territory."],["Fraktionsgelände wird ganz in deinem Territorium, mehr als 3\" von Zielen und anderem Gelände aufgestellt.","Faction terrain is set up wholly in your territory, more than 3\" from objectives and other terrain."],["Aufstellungsfähigkeiten der Armee (z. B. Reserve, Tunnel) werden danach abgehandelt.","Army deployment abilities (reserve, tunnels, etc.) are used afterwards."],["Ein Regiment kann am Stück aufgestellt werden („Regiment aufstellen“).","A whole regiment can be deployed in one go (“Deploy regiment”)."]],"sp":null},{"id":"rundenbeginn","ph":"r","t":["Beginn der Schlachtrunde","Start of the battle round"],"s":["Wer beginnt, ist in Runde 1 der Angreifer; danach entscheidet der Prioritätswurf. Außenseiter, Taktikkarten und Befehlspunkte werden bestimmt.","In round 1 the attacker starts; later the priority roll decides. Underdog, tactic cards and command points are determined."],"d":[["Aktiven Spieler bestimmen: Runde 1 entscheidet der Angreifer; ab Runde 2 würfeln beide (Prioritätswurf), der Gewinner wählt den ersten Zug. Bei Gleichstand entscheidet, wer zuletzt den ersten Zug hatte.","Active player: in round 1 the attacker chooses; from round 2 both roll (priority roll) and the winner picks who goes first. On a tie, whoever went first last round chooses."],["Außenseiter ist, wer weniger Siegespunkte hat; bei Gleichstand gibt es keinen.","The underdog is the player with fewer victory points; on a tie there is none."],["Wendungskarte der Runde aufdecken; Taktikkarten ziehen/auffüllen (Hand: 3 Karten).","Reveal the round's twist card; draw/refill battle tactic cards (hand size 3)."],["Befehlspunkte: jeder erhält 4 (Außenseiter 5). Danach Fähigkeiten „Beginn der Schlachtrunde“ (aktiver Spieler zuerst).","Command points: each player gets 4 (underdog 5). Then Start of Battle Round abilities (active player first)."],["Initiative ergreifen: Wer den ersten Zug in Runde 2+ wählt, erhält keine neuen Taktikkarten, außer als Außenseiter mit ≥5 SP Rückstand.","Seizing the initiative: a player choosing the first turn in round 2+ draws no new tactic cards unless they are underdog by 5+ VP."]],"sp":null},{"id":"zugablauf","ph":"z","t":["Zugbeginn und Zugende","Start and end of turn"],"s":["Zu Zugbeginn und Zugende gibt es eigene Fähigkeiten; am Zugende werden Ziele geprüft und Siegespunkte gewertet.","There are abilities at the start and end of each turn; objectives are checked and victory points scored at the end."],"d":[["Zugbeginn: Taktisches Vorhaben (1× pro Runde, ein Taktik-Vorhaben zusätzlich versuchen), Ort der Macht aktivieren.","Start of turn: Tactical Gambit (once per round), Activate Place of Power."],["In jeder Phase nutzt zuerst der aktive Spieler seine Fähigkeiten, danach der Gegner.","In every phase the
